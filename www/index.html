function executeDoping(id){
  const p = playerById(id);
  if(!p || p.doped || p.banned) return;
  const cost = dopingCost(p);
  if(state.budget < cost) return;
  state.budget -= cost;
  const caught = Math.random() < 0.4;
  if(caught){
    p.banned = true;
    p.indispo = 9999;
    p.banUntilYear = (state.year||2026) + 4;
    if(state.captainId===p.id) state.captainId = null;
    Object.keys(state.lineup).forEach(slot=>{ if(state.lineup[slot]===p.id) delete state.lineup[slot]; });
    addNews("Scandale", `🚨 Contrôle antidopage positif : ${p.nom} est suspendu 4 ans et banni de la sélection nationale jusqu'en ${p.banUntilYear}.`);
    SFX.crowdBurst(false, false);
    openPlayerSheet(id, `⛔ Contrôle positif : ${p.nom} est suspendu 4 ans (retour possible en ${p.banUntilYear}).`);
  } else {
    p.doped = true;
    const newCap = dopeCapFor(p);
    p.potentiel = newCap;
    const statBoost = rand(6,14);
    p.attaque = Math.min(newCap, p.attaque + statBoost);
    p.defense = Math.min(newCap, p.defense + statBoost);
    p.forme = 99;
    addNews("Filière", `💉 ${p.nom} explose son plafond grâce à un protocole discret (potentiel désormais ${p.potentiel}).`);
    SFX.crowdBurst(true, true);
    openPlayerSheet(id, `💪 Le protocole a fonctionné : plafond porté au maximum (${p.potentiel}), stats en hausse.`);
  }
  render();
}

function soinPlayer(id){
  if(state.soinToday >= 3 || state.budget < 5) return;
  const p = playerById(id);
  if(p.forme >= 95) return;
  state.budget -= 5;
  state.soinToday++;
  const kineLvl = state.staff.kine||0;
  const gain = rand(8,15) + kineLvl*2;
  p.forme = Math.min(99, p.forme + gain);
  openPlayerSheet(id, `Séance de soins : ${p.nom} récupère (+${gain} forme).`);
  render();
}

// Petit indicateur visuel de série (FIFA Tournament) : jusqu'à 3 pips qui se remplissent
// vert/rouge au fil des matchs contre le même pays, 2 victoires suffisent pour se qualifier.
function renderSeriesTrack(matchObj){
  if(!matchObj || state.competition !== "fifatournament" || KO_ORDER_FIFAT.indexOf(matchObj.type)===-1) return "";
  const cal = (matchObj.ctx==="club" ? (state.club&&state.club.calendar) : state.calendar) || [];
  const games = cal.filter(m=> m.type===matchObj.type && m.opp===matchObj.opp);
  const pips = games.map(m=> m.status==="W" ? '<div class="series-pip win"></div>' : m.status==="L" ? '<div class="series-pip loss"></div>' : '<div class="series-pip"></div>').join("");
  const wins = games.filter(m=>m.status==="W").length, losses = games.filter(m=>m.status==="L").length;
  return `<div class="series-track">${pips}<span style="font-size:12px;color:var(--chalk);margin-left:4px;">Série ${wins}-${losses} · 2 victoires qualifient</span></div>`;
}

  const spec = FORMATIONS[state.tactique.formation].spec;
  const slots = slotsSpec();
  const filledCount = slots.filter(s=> state.lineup[s]).length;
  const formation = FORMATIONS[state.tactique.formation];
  const style = STYLES[state.tactique.style];
  el.innerHTML = `
    <div class="eyebrow">${typeLabel(next.type, next)}</div>
    <h2 class="section-title">France 🇫🇷 vs ${next.opp}</h2>
    <div class="s3d-hero" id="s3dHero"></div>

function saveCurrentLineup(){
  const filledCount = slotsSpec().filter(s=> state.lineup[s]).length;
  if(filledCount === 0) return;
  state.savedLineups = state.savedLineups || [];
  const defaultName = `Compo ${state.savedLineups.length+1}`;
  let name = defaultName;
  try{
    if(typeof prompt === "function"){
      const entered = prompt("Nom de cette composition :", defaultName);
      if(entered === null) return; // annulé
      if(entered.trim()) name = entered.trim().slice(0,30);
    }
  }catch(e){}
  const preset = {
    id: uid(), name,
    formation: state.tactique.formation,
    style: state.tactique.style,
    slots: {...state.lineup},
    note: filledCount < 11 ? `Incomplète (${filledCount}/11)` : null
  };
  state.savedLineups.push(preset);
  if(state.savedLineups.length > 10) state.savedLineups.shift();
  render();
}
function applySavedLineup(id){
  const preset = (state.savedLineups||[]).find(l=>l.id===id);
  if(!preset) return;
  state.tactique.formation = preset.formation;
  if(preset.style) state.tactique.style = preset.style;
  const newLineup = {};
  Object.entries(preset.slots||{}).forEach(([slot,pid])=>{
    const p = playerById(pid);
    if(p && p.indispo<=0) newLineup[slot] = pid;
  });
  state.lineup = newLineup;
  render();
}
function deleteSavedLineup(id){
  state.savedLineups = (state.savedLineups||[]).filter(l=>l.id!==id);
  render();
}

/* ---------------- MATCH SIMULATION ---------------- */
function buildFormPos(spec){
  const linesX = {GB:8, DEF:24, MIL:46, ATT:66};
  const pos = [];
  spec.forEach(([posName,count])=>{
    for(let i=0;i<count;i++){
      const y = count===1 ? 50 : 12 + (76*i/(count-1));
      pos.push({pos:posName, x:linesX[posName], y});
    }
  });
  return pos;
}
const OPP_FORM_POS = buildFormPos(FORMATIONS["442"].spec);
const OPP_POS = OPP_FORM_POS.map(p=>({pos:p.pos, x:100-p.x, y:p.y}));
const OPP_ATT_IDX = [9,10];
const OPP_ADV_MIL_IDX = 8;

/* ---------------- SFX — sons de match synthétisés (aucun fichier externe requis) ---------------- */
const SFX = (function(){
  let ctx = null, master = null, crowdNodes = null;
  const noiseCache = {};
  function enabled(){ return !!(state.settings && state.settings.sound); }
  function getCtx(){
    if(ctx) return ctx;
    try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
    master = ctx.createGain();
    master.gain.value = enabled() ? 1 : 0;
    master.connect(ctx.destination);
    return ctx;
  }
  function unlock(){
    const c = getCtx();
    if(c && c.state === "suspended") c.resume();
  }
  function setEnabled(on){
    const c = getCtx(); if(!c) return;
    master.gain.setTargetAtTime(on ? 1 : 0, c.currentTime, 0.05);
    if(!on) stopCrowdLoop();
  }
  function noiseBuffer(seconds, brown){
    const c = getCtx(); if(!c) return null;
    const key = seconds+(brown?"b":"w");
    if(noiseCache[key]) return noiseCache[key];
    const len = Math.floor(c.sampleRate*seconds);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      if(brown){ last = (last + 0.02*w) / 1.02; data[i] = last*3.2; }
      else data[i] = w;
    }
    noiseCache[key] = buf;
    return buf;
  }
  function whistle(long){
    if(!enabled()) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime;
    const notes = long ? [[t0,0.42],[t0+0.5,0.42],[t0+1.02,0.72]] : [[t0,0.14],[t0+0.19,0.18]];
    notes.forEach(([start,dur])=>{
      const osc = c.createOscillator(); const osc2 = c.createOscillator(); const g = c.createGain();
      const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600; lp.Q.value = 0.5;
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1750, start);
      osc.frequency.linearRampToValueAtTime(1900, start+dur*0.4);
      osc.frequency.linearRampToValueAtTime(1680, start+dur);
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(1755, start);
      osc2.frequency.linearRampToValueAtTime(1905, start+dur*0.4);
      osc2.frequency.linearRampToValueAtTime(1685, start+dur);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.1, start+0.035);
      g.gain.linearRampToValueAtTime(0.08, start+dur*0.7);
      g.gain.linearRampToValueAtTime(0, start+dur);
      osc.connect(lp); osc2.connect(lp); lp.connect(g); g.connect(master);
      osc.start(start); osc.stop(start+dur+0.03);
      osc2.start(start); osc2.stop(start+dur+0.03);
    });
  }
  function cardBlip(){
    if(!enabled()) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime;
    [0,0.16].forEach(off=>{
      const osc = c.createOscillator(); const g = c.createGain();
      osc.type = "square"; osc.frequency.setValueAtTime(2600, t0+off);
      g.gain.setValueAtTime(0, t0+off);
      g.gain.linearRampToValueAtTime(0.15, t0+off+0.015);
      g.gain.linearRampToValueAtTime(0, t0+off+0.11);
      osc.connect(g); g.connect(master);
      osc.start(t0+off); osc.stop(t0+off+0.13);
    });
  }
  function tap(){
    if(!enabled()) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime;
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(720, t0);
    osc.frequency.exponentialRampToValueAtTime(480, t0+0.06);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.06, t0+0.008);
    g.gain.linearRampToValueAtTime(0, t0+0.08);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0+0.09);
  }
  function ambientCheer(){
    if(!enabled()) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime;
    const dur = 1.3 + Math.random()*0.6;
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(2, false);
    const band = c.createBiquadFilter();
    band.type = "bandpass"; band.frequency.value = 750 + Math.random()*200; band.Q.value = 0.6;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.14 + Math.random()*0.06, t0+0.3);
    g.gain.linearRampToValueAtTime(0.05, t0+dur*0.6);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    src.connect(band); band.connect(g); g.connect(master);
    src.start(t0); src.stop(t0+dur+0.1);
  }
  function crowdBurst(big, positive){
    if(!enabled()) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime;
    const dur = big ? 2.6 : 1.1;
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(Math.min(dur+0.4, 3), false);
    const band = c.createBiquadFilter();
    band.type = "bandpass"; band.frequency.value = positive ? 900 : 320; band.Q.value = 0.7;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(big?0.55:0.3, t0+(big?0.25:0.15));
    g.gain.linearRampToValueAtTime(big?0.32:0.16, t0+dur*0.55);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    src.connect(band); band.connect(g); g.connect(master);
    src.start(t0); src.stop(t0+dur+0.1);
    if(positive){
      [220,277,330].forEach((f,i)=>{
        const o = c.createOscillator(); const og = c.createGain();
        o.type = "sawtooth"; o.frequency.setValueAtTime(f, t0);
        o.frequency.linearRampToValueAtTime(f*1.08, t0+dur*0.6);
        og.gain.setValueAtTime(0, t0);
        og.gain.linearRampToValueAtTime(big?0.05:0.03, t0+0.3+i*0.05);
        og.gain.linearRampToValueAtTime(0, t0+dur*0.9);
        const lp = c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900;
        o.connect(lp); lp.connect(og); og.connect(master);
        o.start(t0); o.stop(t0+dur);
      });
    }
  }
  function startCrowdLoop(){
    if(!enabled()) return;
    const c = getCtx(); if(!c || crowdNodes) return;
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(4, true); src.loop = true;
    const band = c.createBiquadFilter(); band.type = "bandpass"; band.frequency.value = 420; band.Q.value = 0.5;
    const g = c.createGain(); g.gain.value = 0.03;
    const lfo = c.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.12;
    const lfoGain = c.createGain(); lfoGain.gain.value = 0.012;
    lfo.connect(lfoGain); lfoGain.connect(g.gain);
    src.connect(band); band.connect(g); g.connect(master);
    src.start(); lfo.start();
    crowdNodes = {src, g, lfo};
  }
  function setCrowdLevel(pct){
    if(!crowdNodes) return;
    const c = getCtx(); if(!c) return;
    const target = 0.02 + clamp(pct,0,1)*0.09;
    crowdNodes.g.gain.setTargetAtTime(target, c.currentTime, 0.6);
  }
  function stopCrowdLoop(){
    if(!crowdNodes) return;
    const c = getCtx();
    try{
      crowdNodes.g.gain.setTargetAtTime(0, c.currentTime, 0.3);
      crowdNodes.src.stop(c.currentTime+0.6);
      crowdNodes.lfo.stop(c.currentTime+0.6);
    }catch(e){}
    crowdNodes = null;
  }
  return {unlock, setEnabled, whistle, cardBlip, crowdBurst, startCrowdLoop, setCrowdLevel, stopCrowdLoop, tap, ambientCheer};
})();
["pointerdown","touchstart","keydown"].forEach(ev=> document.addEventListener(ev, ()=> SFX.unlock()));
let _lastTapSfx = 0;
document.addEventListener("click", (e)=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  const inApp = document.getElementById("app").contains(btn);
  const inOverlay = btn.closest(".overlay");
  if(!inApp && !inOverlay) return;
  const now = performance.now();
  if(now - _lastTapSfx < 60) return; // évite l'empilement de nœuds audio sur des clics rapprochés
  _lastTapSfx = now;
  SFX.tap();
});

function startMatch(matchObj){
  matchObj.status = "live";
  matchObj.competition = state.competition;
  matchObj.minute = 0;
  matchObj.us = 0; matchObj.them = 0;
  matchObj.log = [];
  matchObj.halftimeDone = false;
  matchObj.halftimeMod = null;
  matchObj.subsUsed = 0;
  matchObj.subsMax = 3;
  matchObj.weather = pick(WEATHERS);
  matchObj.home = state.homeAway !== "exterieur";
  matchObj.stats = {
    possUs:50, possThem:50,
    tirsUs:0, tirsThem:0, cadresUs:0, cadresThem:0,
    corUs:0, corThem:0, fautesUs:0, fautesThem:0,
    cartons:[]
  };
  const slots = slotsSpec();
  matchObj.usOrder = slots.map(s => playerById(state.lineup[s]));
  const startingIds = new Set(matchObj.usOrder.filter(Boolean).map(p=>p.id));
  matchObj.benchIds = state.squad.filter(p=>!startingIds.has(p.id)).map(p=>p.id);
  matchObj.outIds = [];
  const spec = FORMATIONS[state.tactique.formation].spec;
  matchObj.formPos = buildFormPos(spec);
  const idxByPos = {};
  matchObj.formPos.forEach((p,i)=>{ (idxByPos[p.pos] = idxByPos[p.pos] || []).push(i); });
  matchObj.attIdx = idxByPos.ATT || [idxByPos.MIL[idxByPos.MIL.length-1]];
  matchObj.advMilIdx = idxByPos.MIL ? idxByPos.MIL[idxByPos.MIL.length-1] : idxByPos.DEF[idxByPos.DEF.length-1];
  matchObj.styleKey = state.tactique.style;
  const style = STYLES[matchObj.styleKey] || STYLES.equilibre;
  const analysteBonus = (state.staff.analyste||0) * 0.8;
  const gbInLineup = (matchObj.usOrder||[]).some(p=> p && p.pos==="GB");
  const gardienBonus = gbInLineup ? (state.staff.gardien||0) * 0.9 : 0;
  const isKO = koOrder().indexOf(matchObj.type) !== -1;
  const mentalBonus = (state.staff.mental||0) * (isKO ? 1.2 : 0.4);
  ensureOppTactique(matchObj);
  const matchup = matchupReport(state.tactique.formation, state.tactique.style, matchObj.oppTactique.formation, matchObj.oppTactique.style);
  matchObj.tacticMod = matchup.mod;
  matchObj.tacticLines = matchup.lines;
  matchObj.ourStrength = teamStrength() + (style.strengthMod||0) + analysteBonus + gardienBonus + mentalBonus + matchup.mod + (matchObj.home?2.5:-1.5);
  matchObj.oppStrength = oppStrengthFor(matchObj.type, matchObj.opp);
  resetPositions(matchObj);
  if(matchup.mod > 0) addNews("Tactique", `Votre plan de jeu prend l'ascendant sur le système de ${matchObj.opp}.`);
  else if(matchup.mod < 0) addNews("Tactique", `Le système de ${matchObj.opp} pose quelques soucis tactiques à vos joueurs.`);
  addNews(typeLabel(matchObj.type), `Coup d'envoi contre ${matchObj.opp} sous ${matchObj.weather.label.replace(/^\S+\s/,'')}.`);
  SFX.whistle(false);
  SFX.startCrowdLoop();
  render();
  setTimeout(()=> tickMatch(matchObj), 700);
}

function resetPositions(m){
  m.pos = {
    ball: {x:50, y:50},
    us: m.formPos.map(p=>({x:p.x, y:p.y})),
    them: OPP_POS.map(p=>({x:p.x, y:p.y})),
  };
}

function delay(ms){ return new Promise(res => setTimeout(res, ms)); }

function pushEntry(m, entry){
  m.log.push(entry);
  if(isLiveScreenActive(m)){ appendCommentary(entry); updateScoreboardDOM(m); }
}

function applyFrame(m){
  m.pos.us.forEach((p,i)=>{
    const base = m.formPos[i];
    p.x = clamp(0.82*p.x + 0.18*(base.x + (m.shiftUs||0)) + rand(-1.5,1.5), 3, 97);
    p.y = clamp(0.82*p.y + 0.18*base.y + rand(-2,2), 5, 95);
  });
  m.pos.them.forEach((p,i)=>{
    const base = OPP_POS[i];
    p.x = clamp(0.82*p.x + 0.18*(base.x + (m.shiftThem||0)) + rand(-1.5,1.5), 3, 97);
    p.y = clamp(0.82*p.y + 0.18*base.y + rand(-2,2), 5, 95);
  });
  if(isLiveScreenActive(m)) placeAllDots(m);
}

// Boucle d'ambiance : fait légèrement bouger les joueurs en continu entre deux événements
// de jeu pour éviter l'effet "pause puis tout bouge d'un coup".
function startAmbientMotion(m){
  stopAmbientMotion(m);
  m._ambientTimer = setInterval(()=>{
    if(!isLiveScreenActive(m)){ stopAmbientMotion(m); return; }
    applyFrame(m);
  }, 260);
}
function stopAmbientMotion(m){
  if(m._ambientTimer){ clearInterval(m._ambientTimer); m._ambientTimer = null; }
}

function flashResult(m, side, idx){
  if(!isLiveScreenActive(m)) return;
  if(window.Stade3D) Stade3D.onGoal(m, side, idx);
  if(side==="us") showGoalCard(m, idx);
  SFX.crowdBurst(side==="us", side==="us");
  const gf = document.getElementById("goalFlash");
  if(gf){ gf.classList.remove("show"); void gf.offsetWidth; gf.classList.add("show"); setTimeout(()=> gf.classList.remove("show"), 900); }
  const dotId = side==="us" ? "dot-us-"+idx : "dot-them-"+idx;
  const d = document.getElementById(dotId);
  if(d){ d.classList.add("scored"); setTimeout(()=> d.classList.remove("scored"), 850); }
  const wrap = document.getElementById("pitchWrap");
  if(wrap){
    wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake");
    setTimeout(()=> wrap.classList.remove("shake"), 550);
    if(side==="us") spawnConfetti(wrap);
  }
}

// v47 : carte "Ultimate Team" du buteur qui glisse sur le terrain après un but des nôtres
function showGoalCard(m, idx){
  const p = m.usOrder && m.usOrder[idx];
  const wrap = document.getElementById("pitchWrap");
  if(!p || !wrap) return;
  const old = wrap.querySelector(".goal-card-pop"); if(old) old.remove();
  const d = document.createElement("div");
  d.className = "goal-card-pop";
  d.innerHTML = `<div class="gcp-lab">⚽ BUT !</div>${futCardHTML(p, {id:false, flag: m.ctx==="club" ? "🏙️" : "🇫🇷"})}`;
  wrap.appendChild(d);
  setTimeout(()=> d.classList.add("in"), 1200);
  setTimeout(()=> d.classList.remove("in"), 5200);
  setTimeout(()=> d.remove(), 5900);
}
function spawnConfetti(wrap){
  const colors = ["#d4af37","#f4f7f5","#5fb87a","#4c86c4"];
  for(let i=0;i<16;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.background = pick(colors);
    c.style.setProperty("--dx", (rand(-70,70))+"px");
    c.style.setProperty("--dy", (rand(-70,10))+"px");
    c.style.setProperty("--rot", rand(-180,180)+"deg");
    c.style.left = "50%"; c.style.top = "40%";
    wrap.appendChild(c);
    requestAnimationFrame(()=> c.classList.add("burst"));
    setTimeout(()=> c.remove(), 950);
  }
}

/* ---------------- v44 : MATCH RÉALISTE — rythme, vrais effectifs adverses, vraies séquences de passes ----------------
   - Le match avance désormais MINUTE PAR MINUTE (plus par tranches de 5) ; les probabilités d'occasion/faute/blessure
     de tickMatch() sont ramenées à la minute (facteur PER_MIN) pour garder le même équilibre sur 90 minutes.
   - Chaque action est une vraie séquence de passes entre joueurs NOMMÉS (playPassChain), avec déplacement en bloc des
     deux équipes (m.shiftUs / m.shiftThem lus par applyFrame) : le moteur 3D anime ces passes une à une.
   - Rythme réglable (Rapide / Normal / Réaliste) : préférence localStorage "sel-matchpace", appliquée par mDelay().
   - Effectifs adverses réels (OPP_ROSTERS, ordre = OPP_POS : GB, 4 DEF, 4 MIL, 2 ATT) ; clubs : noms générés selon la ville. */
const MATCH_PACES = {
  rapide:  {label:"⏩ Rapide",   f:0.45},
  normal:  {label:"▶ Normal",    f:1},
  reel:    {label:"🎬 Réaliste", f:1.9},
};
function matchPaceKey(){ try{ const k = localStorage.getItem("sel-matchpace"); return MATCH_PACES[k] ? k : "normal"; }catch(e){ return "normal"; } }
function cycleMatchPace(){
  const keys = Object.keys(MATCH_PACES);
  const k = keys[(keys.indexOf(matchPaceKey())+1) % keys.length];
  try{ localStorage.setItem("sel-matchpace", k); }catch(e){}
  document.querySelectorAll("[data-pace-label]").forEach(el=> el.textContent = MATCH_PACES[k].label);
}
function mDelay(ms){ return delay(ms * MATCH_PACES[matchPaceKey()].f); }

function seededRng(seedStr){ let h=2166136261; for(let i=0;i<seedStr.length;i++){ h^=seedStr.charCodeAt(i); h=Math.imul(h,16777619); } return ()=>{ h=Math.imul(h^(h>>>15), 2246822507); h=Math.imul(h^(h>>>13), 3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function oppNamesFor(m){
  if(Array.isArray(m.oppNames) && m.oppNames.length===11) return m.oppNames;
  if(OPP_ROSTERS[m.opp]){ m.oppNames = OPP_ROSTERS[m.opp].slice(); return m.oppNames; }
  const city = String(m.opp||"").replace(/^FC\s+/,"");
  const pool = CLUB_NAME_POOLS[CITY_POOL_KEY[city]] || [PRENOMS, NOMS];
  const r = seededRng(String(m.opp));
  const used = new Set();
  m.oppNames = [];
  while(m.oppNames.length<11){
    const n = pool[0][Math.floor(r()*pool[0].length)] + " " + pool[1][Math.floor(r()*pool[1].length)];
    if(!used.has(n)){ used.add(n); m.oppNames.push(n); }
  }
  return m.oppNames;
}
function playerNameAt(m, side, i){
  if(side==="us"){ const p = m.usOrder && m.usOrder[i]; return p ? p.nom : "Un joueur"; }
  return oppNamesFor(m)[i] || m.opp;
}
// Déplacement du bloc : pr = 0 (ballon chez nous, près de notre but) -> 1 (dans la surface adverse)
function setTeamShift(m, side, pr){
  const push = -4 + pr*18, drop = pr*9;
  if(side==="us"){ m.shiftUs = push; m.shiftThem = drop; }
  else { m.shiftThem = -push; m.shiftUs = -drop; }
}
function relaxTeamShift(m){ m.shiftUs = (m.shiftUs||0)*0.5; m.shiftThem = (m.shiftThem||0)*0.5; }
// v45 : chaque geste du moteur est aussi envoyé au stade 3D, qui le joue physiquement (ballon au pied)
function s3dAction(m, a){ try{ if(window.Stade3D && Stade3D.onAction && isLiveScreenActive(m)) Stade3D.onAction(m, a); }catch(e){} }
const DRIBBLE_MOVES = [
  {key:"crochet",   lines:["{a} efface {b} d'un crochet court !", "Crochet de {a}, {b} est passé !"]},
  {key:"passement", lines:["Passement de jambes de {a}, {b} est dans le vent !", "{a} enchaîne les passements et déstabilise {b}."]},
  {key:"petitpont", lines:["PETIT PONT de {a} sur {b} !", "{a} glisse le ballon entre les jambes de {b} !"]},
  {key:"roulette",  lines:["Roulette de {a} qui élimine {b} !", "{a} pivote sur une roulette et laisse {b} sur place."]},
];
// v45 : continuité de possession — le jeu reprend du dernier porteur réel (m.lastHolder) au lieu
// d'un joueur tiré au hasard, pour que le ballon ne "saute" jamais d'un bout à l'autre du terrain.
function setHolder(m, side, idx){ m.lastHolder = {side, idx}; }
function startHolder(m, side, fallback){
  const lh = m.lastHolder;
  if(lh && lh.side === side && (side!=="us" || m.usOrder[lh.idx])) return {idx:lh.idx, turnover:false};
  return {idx:fallback, turnover: !!lh};
}
function countPass(m, side){ if(!m.stats) return; if(side==="us") m.stats.passUs = (m.stats.passUs||0)+1; else m.stats.passThem = (m.stats.passThem||0)+1; }

const PASS_LINES = {
  courte:  ["{a} ➜ {b}, passe courte.", "{a} glisse le ballon à {b}.", "Remise de {a} pour {b}.", "{a} combine avec {b}."],
  avant:   ["{a} trouve {b} entre les lignes !", "Passe verticale de {a} vers {b}.", "{a} casse une ligne et sert {b}."],
  longue:  ["Long ballon de {a} pour {b}.", "{a} renverse le jeu vers {b} !", "Transversale de {a}, contrôlée par {b}."],
  retrait: ["{a} temporise et ressort sur {b}.", "{a} repart de derrière avec {b}."],
};

// Joue n passes pour `side`, de la progression prFrom à prTo. Retourne l'index du dernier porteur.
async function playPassChain(m, side, holder, n, prFrom, prTo, talk){
  const ours = side==="us";
  const arr = ours ? m.pos.us : m.pos.them;
  const base = ours ? m.formPos : OPP_POS;
  for(let k=0;k<n;k++){
    const pr = prFrom + (prTo-prFrom)*((k+1)/n);
    setTeamShift(m, side, pr);
    const xT = ours ? 18 + pr*68 : 82 - pr*68;              // zone où doit arriver le ballon
    let best = -1, bestScore = -1e9;
    for(let i=1;i<arr.length;i++){
      if(i===holder || (ours && !m.usOrder[i])) continue;
      const bx = base[i].x + (ours ? (m.shiftUs||0) : (m.shiftThem||0));
      const score = -Math.abs(bx - xT) - Math.abs(base[i].y - (arr[holder]?arr[holder].y:50))*0.25 + Math.random()*16;
      if(score > bestScore){ bestScore = score; best = i; }
    }
    if(best<0) break;
    const from = arr[holder] || {x:50,y:50};
    arr[best].x = clamp(xT + rand(-5,5), 4, 96);
    arr[best].y = clamp(base[best].y + rand(-9,9), 6, 94);
    const fwd = (arr[best].x - from.x) * (ours?1:-1), dist = Math.hypot(arr[best].x-from.x, (arr[best].y-from.y)*0.65);
    const type = dist > 34 ? "longue" : fwd > 12 ? "avant" : fwd < -6 ? "retrait" : "courte";
    m.pos.ball.x = arr[best].x; m.pos.ball.y = arr[best].y;
    countPass(m, side);
    s3dAction(m, {kind:"pass", side, from:holder, to:best, type});
    setHolder(m, side, best);
    applyFrame(m);
    if(Math.random() < talk){
      pushEntry(m, {min:m.minute, goal:false, text: pick(PASS_LINES[type]).replace("{a}", playerNameAt(m,side,holder)).replace("{b}", playerNameAt(m,side,best))});
    }
    holder = best;
    // v45 : attente = durée réelle de la passe en 3D (élan + vol du ballon à la vitesse de PASS_SPEED + contrôle)
    const distM = Math.hypot((arr[best].x-from.x)*1.05, (arr[best].y-from.y)*0.68);
    const spd = {courte:16, retrait:15, avant:20, longue:24}[type];
    await mDelay(550 + distM/spd*1000 + 350);
  }
  return holder;
}

// Minute "calme" : circulation de balle de l'équipe en possession, parfois perdue sur une interception.
async function playPossessionMinute(m){
  const usHas = Math.random()*100 < (m.stats ? m.stats.possUs : 50);
  const side = usHas ? "us" : "them";
  const arr = usHas ? m.pos.us : m.pos.them;
  let holder = 1 + Math.floor(Math.random()*8);
  if(usHas && !m.usOrder[holder]){ const f = m.usOrder.findIndex((p,i)=> i>0 && p); holder = f>0 ? f : 1; }
  const sh0 = startHolder(m, side, holder);
  holder = sh0.idx;
  m.pos.ball.x = arr[holder].x; m.pos.ball.y = arr[holder].y;
  s3dAction(m, {kind: sh0.turnover ? "intercept" : "gain", side, who:holder});
  setHolder(m, side, holder);
  const pr0 = rand(0.15, 0.45);
  holder = await playPassChain(m, side, holder, 1 + Math.floor(Math.random()*3), pr0, pr0 + rand(-0.05, 0.25), 0.3);
  if(Math.random() < 0.22){
    const other = usHas ? "them" : "us";
    const oArr = usHas ? m.pos.them : m.pos.us;
    let thief = 5 + Math.floor(Math.random()*4);
    if(other==="us" && !m.usOrder[thief]) thief = 1 + Math.floor(Math.random()*4);
    if(oArr[thief]){ oArr[thief].x = m.pos.ball.x + rand(-3,3); oArr[thief].y = m.pos.ball.y + rand(-3,3); }
    s3dAction(m, {kind:"intercept", side:other, who:thief});
    setHolder(m, other, thief);
    applyFrame(m);
    if(Math.random() < 0.5) pushEntry(m, {min:m.minute, goal:false, text: pick([
      `Interception de ${playerNameAt(m,other,thief)} !`,
      `${playerNameAt(m,other,thief)} récupère le ballon dans les pieds de ${playerNameAt(m,side,holder)}.`,
      `Bon pressing, ${playerNameAt(m,other,thief)} gagne son duel.`])});
    updatePossession(m, other==="us");
    await mDelay(500);
  } else if(Math.random() < 0.12){
    const fillers = ["Le public pousse son équipe.","Circulation de balle patiente pour casser le bloc adverse.","Le rythme retombe un peu au milieu.","Les deux blocs se jaugent."];
    pushEntry(m, {min:m.minute, goal:false, text:pick(fillers)});
  }
  relaxTeamShift(m);
}

async function playSequence(m, side, outcome){
  // outcome: "goal" | "saved" (on target, stopped) | "off" (missed target) | "corner"
  const lane = pick([25,50,75]);
  const ours = side === "us";
  const attIdxPool = ours ? m.attIdx : OPP_ATT_IDX;
  const advIdx = ours ? m.advMilIdx : OPP_ADV_MIL_IDX;
  const attIdx = pick(attIdxPool);
  const shooterIdx = Math.random() < 0.7 ? attIdx : advIdx;
  const arr = ours ? m.pos.us : m.pos.them;
  const base = ours ? m.formPos : OPP_POS;
  const dir = ours ? 1 : -1;
  const goalX = ours ? 95 : 5;
  const nameOf = (i)=> playerNameAt(m, side, i);
  // v44 : vraie construction — 2 à 5 passes entre joueurs nommés, le bloc monte avec le ballon
  let holder = 1 + Math.floor(Math.random()*7);
  if(ours && !m.usOrder[holder]){ const f = m.usOrder.findIndex((p,k)=> k>0 && p); holder = f>0 ? f : 1; }
  const sh0 = startHolder(m, side, holder);
  holder = sh0.idx;
  if(holder===shooterIdx && sh0.turnover) holder = Math.max(1, shooterIdx-4);
  m.pos.ball.x = arr[holder].x; m.pos.ball.y = arr[holder].y;
  s3dAction(m, {kind: sh0.turnover ? "intercept" : "gain", side, who:holder});
  setHolder(m, side, holder);
  applyFrame(m);
  holder = await playPassChain(m, side, holder, 2 + Math.floor(Math.random()*4), 0.12, 0.62, 0.55);
  // v45 : dribble avant le dernier geste (le porteur élimine un défenseur, en 3D comme dans le texte)
  if(Math.random() < 0.5){
    const otherSide = ours ? "them" : "us";
    const defIdx = 1 + Math.floor(Math.random()*4);
    const mv = pick(DRIBBLE_MOVES);
    const oArr = ours ? m.pos.them : m.pos.us;
    if(oArr[defIdx]){ oArr[defIdx].x = clamp(arr[holder].x + dir*4, 4, 96); oArr[defIdx].y = arr[holder].y; }
    arr[holder].x = clamp(arr[holder].x + dir*9, 5, 95);
    m.pos.ball.x = arr[holder].x; m.pos.ball.y = arr[holder].y;
    s3dAction(m, {kind:"dribble", side, who:holder, past:defIdx, move:mv.key});
    setHolder(m, side, holder);
    applyFrame(m);
    pushEntry(m, {min:m.minute, goal:false, text: pick(mv.lines).replace("{a}", nameOf(holder)).replace("{b}", playerNameAt(m, otherSide, defIdx))});
    await mDelay(1300);
  }
  // dernier geste : centre ou passe en profondeur vers le tireur qui attaque la surface
  if(holder === shooterIdx){
    const alt = [advIdx, ...attIdxPool].find(i=> i!==shooterIdx && (!ours || m.usOrder[i])) ?? (shooterIdx>1 ? shooterIdx-1 : 2);
    s3dAction(m, {kind:"pass", side, from:holder, to:alt, type:"courte"});
    countPass(m, side);
    holder = alt; setHolder(m, side, holder);
    await mDelay(700);
  }
  const assistIdx = holder;
  const wide = arr[assistIdx] && (arr[assistIdx].y < 28 || arr[assistIdx].y > 72);
  setTeamShift(m, side, 0.85);
  arr[shooterIdx].x = clamp(goalX - dir*rand(9,16), 5, 95);
  arr[shooterIdx].y = clamp(lane + rand(-8,8), 22, 78);
  if(wide && arr[assistIdx]) arr[assistIdx].x = clamp(goalX - dir*rand(6,14), 5, 95);
  m.pos.ball.x = arr[shooterIdx].x; m.pos.ball.y = arr[shooterIdx].y;
  countPass(m, side);
  const isHeader = wide && Math.random() < 0.55;    // v47 : reprise de la tête sur centre
  s3dAction(m, {kind:"pass", side, from:assistIdx, to:shooterIdx, type: wide ? "centre" : "avant", header:isHeader});
  applyFrame(m);
  pushEntry(m, {min:m.minute, goal:false, text: wide
    ? pick([`Centre de ${nameOf(assistIdx)} vers ${nameOf(shooterIdx)}…`, `${nameOf(assistIdx)} déborde et centre pour ${nameOf(shooterIdx)} !`])
    : pick([`Passe en profondeur de ${nameOf(assistIdx)} pour ${nameOf(shooterIdx)} !`, `${nameOf(assistIdx)} lance ${nameOf(shooterIdx)} dans la surface…`, `Une-deux entre ${nameOf(assistIdx)} et ${nameOf(shooterIdx)} !`])});
  await mDelay(950);

  m.pos.ball.x = goalX; m.pos.ball.y = lane;
  s3dAction(m, {kind:"shot", side, who:shooterIdx, outcome, header:isHeader});
  // après la frappe : le gardien adverse (arrêt, sortie de but) ou un coup d'envoi (but)
  if(outcome === "goal") m.lastHolder = null;
  else if(outcome === "corner" || outcome === "post") setHolder(m, side, shooterIdx);
  else setHolder(m, ours ? "them" : "us", 0);
  applyFrame(m);
  await mDelay(420);

  const st = m.stats;
  if(outcome === "goal"){
    if(ours){ st.tirsUs++; st.cadresUs++; } else { st.tirsThem++; st.cadresThem++; }
    if(ours){
      m.us++;
      const scorer = m.usOrder[shooterIdx];
      if(scorer) scorer.buts = (scorer.buts||0) + 1;
    } else m.them++;
    pushEntry(m, {min:m.minute, goal:true, text: ours
      ? `⚽ BUT ! ${nameOf(shooterIdx)} ${isHeader ? "place une tête imparable" : "conclut d'un tir précis"} ! (passe décisive : ${nameOf(assistIdx)})`
      : `⚽ But encaissé — ${nameOf(shooterIdx)} (${m.opp}) punit la défense française, sur un service de ${nameOf(assistIdx)}.`});
    flashResult(m, side, shooterIdx);
    await mDelay(1600);
    m.pos.ball.x = 50; m.pos.ball.y = 50;
    m.shiftUs = 0; m.shiftThem = 0;
    s3dAction(m, {kind:"kickoff", side: ours ? "them" : "us"});
    setHolder(m, ours ? "them" : "us", 9);
    applyFrame(m);
  } else if(outcome === "save-great"){
    if(ours){ st.tirsUs++; st.cadresUs++; } else { st.tirsThem++; st.cadresThem++; }
    m.pos.ball.x = clamp(m.pos.ball.x - dir*10, 15, 85);
    m.pos.ball.y = clamp(50 + rand(-6,6), 20, 80);
    applyFrame(m);
    if(isLiveScreenActive(m)) SFX.crowdBurst(false, false);
    if(window.Stade3D) Stade3D.onEvent(m, "save");
    pushEntry(m, {min:m.minute, goal:false, text: ours
      ? `🧤 ARRÊT EXCEPTIONNEL de ${playerNameAt(m,"them",0)} sur la tentative de ${nameOf(shooterIdx)} !`
      : `🧤 Parade exceptionnelle de ${playerNameAt(m,"us",0)} devant ${nameOf(shooterIdx)}, ovation du stade !`});
  } else if(outcome === "post"){
    if(ours) st.tirsUs++; else st.tirsThem++;
    m.pos.ball.x = clamp(goalX + (ours?-3:3), 2, 98); m.pos.ball.y = pick([8,92]);
    applyFrame(m);
    const wrap = document.getElementById("pitchWrap");
    if(isLiveScreenActive(m) && wrap){ wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake"); setTimeout(()=> wrap.classList.remove("shake"), 400); }
    if(window.Stade3D) Stade3D.onEvent(m, "post");
    pushEntry(m, {min:m.minute, goal:false, text: ours
      ? `🥴 Le POTEAU repousse la frappe de ${nameOf(shooterIdx)} ! Si près du but...`
      : `😅 ${nameOf(shooterIdx)} trouve le poteau, les Bleus ont eu chaud !`});
  } else if(outcome === "saved"){
    if(ours){ st.tirsUs++; st.cadresUs++; } else { st.tirsThem++; st.cadresThem++; }
    m.pos.ball.x = clamp(m.pos.ball.x - dir*14, 15, 85);
    m.pos.ball.y = 50;
    applyFrame(m);
    pushEntry(m, {min:m.minute, goal:false, text: ours
      ? `${isHeader ? "Tête" : "Tir"} de ${nameOf(shooterIdx)}, repoussé${isHeader ? "e" : ""} par ${playerNameAt(m,"them",0)} !`
      : `Frappe de ${nameOf(shooterIdx)} captée par ${playerNameAt(m,"us",0)}.`});
  } else if(outcome === "corner"){
    if(ours) st.corUs++; else st.corThem++;
    if(ours) st.tirsUs++; else st.tirsThem++;
    m.pos.ball.x = ours ? 97 : 3; m.pos.ball.y = pick([5,95]);
    applyFrame(m);
    pushEntry(m, {min:m.minute, goal:false, text: ours
      ? `Tir de ${nameOf(shooterIdx)} dévié — corner pour la France.`
      : `Frappe de ${nameOf(shooterIdx)} contrée, corner pour ${m.opp}.`});
  } else {
    if(ours) st.tirsUs++; else st.tirsThem++;
    m.pos.ball.x = clamp(m.pos.ball.x + dir*10, 5, 95);
    m.pos.ball.y = clamp(lane + rand(-25,25), 2, 98);
    applyFrame(m);
    pushEntry(m, {min:m.minute, goal:false, text: ours
      ? `Tir de ${nameOf(shooterIdx)}, largement à côté !`
      : `${nameOf(shooterIdx)} (${m.opp}) manque le cadre de peu.`});
  }
  await mDelay(500);
  relaxTeamShift(m);
}

async function playMidfield(m){
  m.pos.ball.x = clamp(50 + rand(-10,10), 25, 75);
  m.pos.ball.y = clamp(50 + rand(-16,16), 15, 85);
  applyFrame(m);
  const fillers = ["Jeu au milieu de terrain, possession équilibrée.","Sortie de balle propre côté français.","Le public pousse son équipe.","Changement tactique discret.","Bonne récupération haute sur le terrain.","Circulation de balle patiente pour casser le bloc adverse."];
  pushEntry(m, {min:m.minute, goal:false, text:pick(fillers)});
  await delay(500);
}

function updatePossession(m, favUs){
  const target = favUs ? clamp(50 + (m.ourStrength-m.oppStrength)/3 + rand(-4,4), 30, 75) : clamp(50 - (m.ourStrength-m.oppStrength)/3 + rand(-4,4), 25, 70);
  m.stats._pf = (typeof m.stats._pf === "number" ? m.stats._pf : m.stats.possUs)*0.93 + target*0.07;   // flottant : évite de rester bloqué par l'arrondi
  m.stats.possUs = Math.round(m.stats._pf);
  m.stats.possThem = 100 - m.stats.possUs;
}

async function playFoul(m, side){
  const ours = side === "us";
  const weather = m.weather || WEATHERS[0];
  const teamName = ours ? "la France" : m.opp;
  if(ours) m.stats.fautesUs++; else m.stats.fautesThem++;
  { const fk = 5+Math.floor(Math.random()*4); s3dAction(m, {kind:"foul", side, who:fk}); setHolder(m, side, fk); }
  const cardRoll = Math.random();
  const cardChance = Math.max(0.04, 0.16 + (weather.passFail||0)*0.3 - (state.staff.mental||0)*0.025);
  if(cardRoll < cardChance){
    if(isLiveScreenActive(m)) SFX.cardBlip();
    let target = null, targetName = `${playerNameAt(m,"them",1+Math.floor(Math.random()*10))} (${m.opp})`, isRed = Math.random() < 0.12;
    if(ours){
      const onPitch = m.usOrder.filter(Boolean);
      target = pick(onPitch);
      targetName = target ? target.nom : "un joueur français";
    }
    if(target){
      target.cardsThisMatch = target.cardsThisMatch || 0;
      target.cardsThisMatch++;
      if(target.cardsThisMatch >= 2) isRed = true;
    }
    if(isRed){
      pushEntry(m, {min:m.minute, goal:false, text:`🟥 Carton rouge ! ${targetName} est exclu.`});
      m.stats.cartons.push({min:m.minute, color:"rouge", who:targetName, ours});
      if(ours && target){
        target.cartons = target.cartons||{jaune:0,rouge:0}; target.cartons.rouge++; target.indispo = Math.max(target.indispo||0, 1);
        const idx = m.usOrder.findIndex(pl=> pl && pl.id===target.id);
        const bench = (m.benchIds||[]).map(bid=>ctxPlayerById(m,bid)).filter(Boolean).sort((a,b)=> overall(b)-overall(a));
        if(idx!==-1 && bench.length && (m.subsUsed||0) < (m.subsMax||3)){
          const inPlayer = bench[0];
          m.usOrder[idx] = inPlayer;
          m.benchIds = (m.benchIds||[]).filter(bid=> bid!==inPlayer.id);
          m.outIds = m.outIds||[]; m.outIds.push(target.id);
          m.subsUsed = (m.subsUsed||0) + 1;
          const delta = (overall(inPlayer) - overall(target)) * 0.15;
          m.ourStrength = (m.ourStrength||0) + delta - 2.5; // remplaçant entré à froid, contexte défavorable
          pushEntry(m, {min:m.minute, goal:false, text:`🔄 Remplacement forcé : ${inPlayer.nom} entre à la place de ${targetName}, exclu.`});
        } else {
          if(idx!==-1) m.usOrder[idx] = null;
          m.ourStrength -= 6;
          pushEntry(m, {min:m.minute, goal:false, text:`Plus aucun changement disponible : ${teamName} termine à dix.`});
        }
      } else if(!ours){ m.oppStrength -= 4; }
    } else {
      pushEntry(m, {min:m.minute, goal:false, text:`🟨 Carton jaune pour ${targetName}.`});
      m.stats.cartons.push({min:m.minute, color:"jaune", who:targetName, ours});
      if(ours){
        m.ourStrength -= 1;
        if(target){ target.cartons = target.cartons||{jaune:0,rouge:0}; target.cartons.jaune++; }
      } else { m.oppStrength -= 0.5; }
    }
  } else {
    pushEntry(m, {min:m.minute, goal:false, text: ours ? `Faute de ${playerNameAt(m,"them",1+Math.floor(Math.random()*10))} (${m.opp}), coup franc pour nous.` : `Faute de ${playerNameAt(m,"us",1+Math.floor(Math.random()*10))}, ${m.opp} récupère un coup franc.`});
  }
  await mDelay(900);
}

async function playInjury(m){
  const onPitch = m.usOrder.map((p,i)=>({p,i})).filter(x=>x.p);
  if(!onPitch.length) return;
  const {p:victim, i:idx} = pick(onPitch);
  const weather = m.weather || WEATHERS[0];
  const severityCut = (state.staff.medecin||0)*0.4 + ((state.facilities && state.facilities.medical) ? 1 : 0);
  const severity = Math.max(1, pick([1,1,2,3]) - Math.round(severityCut));
  const label = severity>=3 ? "une blessure sérieuse" : severity===2 ? "un vilain coup" : "une petite alerte physique";
  pushEntry(m, {min:m.minute, goal:false, text:`🩼 Coup dur : ${victim.nom} souffre d'${label} et grimace au sol.`});
  await mDelay(1200);
  const bench = (m.benchIds||[]).map(id=>ctxPlayerById(m,id)).filter(Boolean).sort((a,b)=> overall(b)-overall(a));
  victim.blessuresNb = (victim.blessuresNb||0) + 1;
  victim.indispo = Math.max(victim.indispo||0, severity);
  if(bench.length && (m.subsUsed||0) < (m.subsMax||3)){
    const inPlayer = bench[0];
    m.usOrder[idx] = inPlayer;
    m.benchIds = (m.benchIds||[]).filter(id=> id!==inPlayer.id);
    m.outIds = m.outIds||[]; m.outIds.push(victim.id);
    m.subsUsed = (m.subsUsed||0) + 1;
    const delta = (overall(inPlayer) - overall(victim)) * 0.15;
    m.ourStrength = (m.ourStrength||0) + delta - 1.5;
    pushEntry(m, {min:m.minute, goal:false, text:`🔄 ${victim.nom} ne peut pas continuer, ${inPlayer.nom} le remplace.`});
  } else {
    m.ourStrength -= 4;
    pushEntry(m, {min:m.minute, goal:false, text:`${victim.nom} serre les dents et termine la rencontre diminué.`});
  }
  await delay(400);
}

function isKnockoutMatch(m){
  if(m.ctx === "club") return m.type !== "ldc-poule";
  return koOrder().indexOf(m.type) !== -1;
}
async function tickMatch(matchObj){
  const isKO = isKnockoutMatch(matchObj);
  const regEnd = 90;
  // v36 : la prolongation n'est plus 2x15 minutes fixes suivies de tirs au but si toujours à
  // égalité — c'est désormais une MORT SUBITE (but en or) : le temps continue à défiler minute
  // par minute (91, 92, 93...) sans limite fixe, et le match s'arrête dès qu'un but est marqué.
  // ETSAFETY_CAP est un simple filet de sécurité (extrêmement improbable à atteindre) pour éviter
  // une boucle infinie en cas de très longue série sans but.
  const ETSAFETY_CAP = 150;

  if(!matchObj.extraTime && matchObj.minute >= regEnd){
    // Temps réglementaire écoulé : si c'est un match à élimination directe et que le score est
    // encore à égalité, on bascule en prolongation (mort subite) plutôt que de finir tout de suite.
    if(!matchObj.etOffered && isKO && matchObj.us === matchObj.them){
      matchObj.etOffered = true;
      matchObj.extraTime = true;
      matchObj.subsMax = (matchObj.subsMax||3) + 1; // une 4e fenêtre de changement, comme dans les vraies prolongations
      SFX.whistle(false);
      pushEntry(matchObj, {min:90, goal:false, text:"⏱️ Égalité au bout des 90 minutes : direction la PROLONGATION EN MORT SUBITE — le premier but marqué met fin au match !"});
      if(isLiveScreenActive(matchObj)){ updateScoreboardDOM(matchObj); saveGame(); }
      setTimeout(()=> tickMatch(matchObj), 900);
      return;
    }
    if(!matchObj.finalWhistlePlayed){
      matchObj.finalWhistlePlayed = true;
      if(isKO && !matchObj.etOffered){
        pushEntry(matchObj, {min:90, goal:false, text:"🔔 Coup de sifflet final, pas besoin de prolongation, le match est déjà tranché !"});
      }
      SFX.whistle(true);
      SFX.stopCrowdLoop();
      stopAmbientMotion(matchObj);
    }
    if(isLiveScreenActive(matchObj)) showFinalButton(matchObj);
    return;
  }
  if(!matchObj.extraTime && !matchObj.halftimeDone && matchObj.minute>=45){
    matchObj.halftimeDone = true;
    matchObj.minute = 45;
    SFX.whistle(false);
    stopAmbientMotion(matchObj);
    if(isLiveScreenActive(matchObj)){
      updateScoreboardDOM(matchObj);
      showHalftimeOverlay(matchObj);
      saveGame();
      return;
    }
    saveGame();
    setTimeout(()=> tickMatch(matchObj), 300);
    return;
  }
  // Filet de sécurité : si par extraordinaire personne n'a marqué après une très longue mort
  // subite, on part quand même aux tirs au but pour ne jamais bloquer le match.
  if(matchObj.extraTime && matchObj.minute >= ETSAFETY_CAP && matchObj.us === matchObj.them){
    if(!matchObj.finalWhistlePlayed){
      matchObj.finalWhistlePlayed = true;
      pushEntry(matchObj, {min:matchObj.minute, goal:false, text:"🔔 Toujours à égalité après une interminable mort subite : place aux tirs au but !"});
      SFX.whistle(true);
      SFX.stopCrowdLoop();
      stopAmbientMotion(matchObj);
    }
    if(isLiveScreenActive(matchObj)) showFinalButton(matchObj);
    return;
  }
  if(!matchObj._ko1){ matchObj._ko1 = true; s3dAction(matchObj, {kind:"kickoff", side:"us"}); setHolder(matchObj, "us", 9); }
  if(matchObj.halftimeDone && !matchObj._ko2 && !matchObj.extraTime){ matchObj._ko2 = true; s3dAction(matchObj, {kind:"kickoff", side:"them"}); setHolder(matchObj, "them", 9); }
  matchObj.minute += 1;   // v44 : minute par minute (avant : +5 en temps réglementaire)
  // Probabilités historiques calibrées pour une tranche de 5 minutes -> ramenées à la minute.
  // (La prolongation en mort subite gardait déjà un pas d'1 minute avec ces probabilités : inchangée.)
  const PER_MIN = matchObj.extraTime ? 1 : 0.2;
  if(isLiveScreenActive(matchObj)) updateScoreboardDOM(matchObj);

  const style = STYLES[matchObj.styleKey] || STYLES.equilibre;
  const weather = matchObj.weather || WEATHERS[0];
  const halftimeConcede = (matchObj.halftimeMod && matchObj.minute>45) ? (matchObj.halftimeMod.concedeMod||0) : 0;
  const diff = matchObj.ourStrength - matchObj.oppStrength;
  const ourChance = 0.16 + Math.max(-0.1, Math.min(0.25, diff/300)) + (style.chanceMod||0) + (weather.chanceMod||0);
  const theirChance = 0.16 - Math.max(-0.1, Math.min(0.25, diff/300)) + (style.concedeMod ? style.concedeMod*0.4 : 0) + halftimeConcede*0.4;
  const roll = Math.random();
  let side = null;
  if(roll < ourChance*PER_MIN) side = "us";
  else if(roll < (ourChance + theirChance)*PER_MIN) side = "them";

  updatePossession(matchObj, side==="us" ? true : (side==="them" ? false : Math.random()<0.5));

  if(side){
    const goalRoll = Math.random();
    const styleGoalMod = side==="us" ? (style.goalMod||0) : -(style.concedeMod||0);
    const goalChance = side==="us" ? 0.42 + diff/400 + styleGoalMod : 0.38 - diff/400 - styleGoalMod;
    const clampedGoal = Math.max(0.15, Math.min(0.7, goalChance));
    let outcome;
    if(goalRoll < clampedGoal) outcome = "goal";
    else {
      const remainder = (goalRoll - clampedGoal) / (1 - clampedGoal);
      outcome = remainder < 0.28 ? "saved" : remainder < 0.40 ? "save-great" : remainder < 0.55 ? "post" : (remainder < 0.78 ? "off" : "corner");
    }
    await playSequence(matchObj, side, outcome);
  } else if(Math.random() < 0.24*PER_MIN){
    await playFoul(matchObj, Math.random()<0.5 ? "us" : "them");
  } else {
    if(isLiveScreenActive(matchObj) && Math.random() < 0.16*PER_MIN) SFX.ambientCheer();
    await playPossessionMinute(matchObj);
  }

  // But en or : dès qu'un but est marqué pendant la mort subite, le match s'arrête immédiatement.
  if(matchObj.extraTime && matchObj.us !== matchObj.them && !matchObj.finalWhistlePlayed){
    matchObj.finalWhistlePlayed = true;
    pushEntry(matchObj, {min:matchObj.minute, goal:false, text: matchObj.us>matchObj.them
      ? "🏆 BUT EN OR ! La prolongation s'arrête immédiatement, victoire des Bleus !"
      : "💔 But en or encaissé, la prolongation s'arrête immédiatement..."});
    SFX.whistle(true);
    SFX.stopCrowdLoop();
    stopAmbientMotion(matchObj);
    if(isLiveScreenActive(matchObj)){ updateScoreboardDOM(matchObj); showFinalButton(matchObj); }
    saveGame();
    return;
  }

  const injChance = 0.018 * ((DIFFICULTIES[(state.settings&&state.settings.difficulty)||"normal"]||DIFFICULTIES.normal).injuryMod) * (weather.injuryMod||1) * (1 - (state.staff.medecin||0)*0.12);
  if(matchObj.minute < (matchObj.extraTime?150:90) && Math.random() < injChance*PER_MIN){
    await playInjury(matchObj);
  }

  matchObj._tickN = (matchObj._tickN||0) + 1;
  if(matchObj._tickN % 10 === 0) saveGame();
  setTimeout(()=> tickMatch(matchObj), 260 * MATCH_PACES[matchPaceKey()].f);
}

function finishMatch(matchObj){
  SFX.stopCrowdLoop();
  stopAmbientMotion(matchObj);
  let statusBase = matchObj.us>matchObj.them ? "W" : matchObj.us<matchObj.them ? "L" : "D";
  if(statusBase === "D" && koOrder().indexOf(matchObj.type) !== -1){
    matchObj.penalties = true;
    const wonPens = typeof matchObj.wonPensResult === "boolean"
      ? matchObj.wonPensResult
      : Math.random() < clamp(0.5 + (matchObj.ourStrength-matchObj.oppStrength)/300, 0.25, 0.75);
    statusBase = wonPens ? "W" : "L";
    const etTxt = matchObj.extraTime ? " après prolongation" : "";
    const scoreTxt = matchObj.penaltiesScore ? ` (${matchObj.penaltiesScore.us}-${matchObj.penaltiesScore.opp} t.a.b.)` : "";
    pushEntry(matchObj, {min: matchObj.extraTime?120:90, goal:false, text: wonPens ? `🥅 Séance de tirs au but remportée par les Bleus${scoreTxt}${etTxt} !` : `🥅 Séance de tirs au but perdue${scoreTxt}${etTxt}...`});
  }
  matchObj.status = statusBase;
  updateWorldRanking(matchObj, statusBase);
  if(statusBase==="W"){
    const wrap = document.getElementById("pitchWrap");
    if(wrap){ spawnConfetti(wrap); setTimeout(()=> spawnConfetti(wrap), 250); }
  }
  const scoreLabel = `${matchObj.us}-${matchObj.them}${matchObj.penalties?' t.a.b.':''}`;
  const newsTitle = statusBase==="W"
    ? `Les Bleus s'imposent ${scoreLabel} face à ${matchObj.opp} !`
    : statusBase==="D"
      ? `Match nul ${scoreLabel} entre la France et ${matchObj.opp}.`
      : `Revers pour la France, battue ${scoreLabel} par ${matchObj.opp}.`;
  addNews(typeLabel(matchObj.type), newsTitle);
  addSupporterNews(statusBase);
  if(Math.random() < 0.35) addWorldFootballNews();
  const preCotes = {};
  state.squad.forEach(p=> preCotes[p.id] = cote(p));

  state.career[statusBase==="W"?"w":statusBase==="L"?"l":"d"]++;

  // Historique face-à-face (H2H) par nation
  if(!state.h2h) state.h2h = {};
  if(!state.h2h[matchObj.opp]) state.h2h[matchObj.opp] = {w:0,d:0,l:0,gf:0,ga:0};
  const h2hRec = state.h2h[matchObj.opp];
  h2hRec[statusBase==="W"?"w":statusBase==="L"?"l":"d"]++;
  h2hRec.gf += matchObj.us; h2hRec.ga += matchObj.them;

  // Série de victoires en cours / meilleure série
  if(!state.career2) state.career2 = {streak:0, bestStreak:0, biggestWin:null, worstLoss:null};
  if(statusBase==="W"){
    state.career2.streak = (state.career2.streak||0) + 1;
    if(state.career2.streak > (state.career2.bestStreak||0)) state.career2.bestStreak = state.career2.streak;
    const diff = matchObj.us - matchObj.them;
    if(!state.career2.biggestWin || diff > state.career2.biggestWin.diff){
      state.career2.biggestWin = {opp:matchObj.opp, us:matchObj.us, them:matchObj.them, diff, year:state.year};
    }
  } else {
    state.career2.streak = 0;
    if(statusBase==="L"){
      const diff = matchObj.them - matchObj.us;
      if(!state.career2.worstLoss || diff > state.career2.worstLoss.diff){
        state.career2.worstLoss = {opp:matchObj.opp, us:matchObj.us, them:matchObj.them, diff, year:state.year};
      }
    }
  }

  state.teamStats.golMarques += matchObj.us;
  state.teamStats.golEncaisses += matchObj.them;
  if(matchObj.them===0) state.teamStats.cleanSheets++;
  const st = matchObj.stats || {cartons:[]};
  const ourCards = st.cartons.filter(c=>c.ours);
  state.teamStats.cartonsJ += ourCards.filter(c=>c.color==="jaune").length;
  state.teamStats.cartonsR += ourCards.filter(c=>c.color==="rouge").length;
  state.matchIdx++;
  state.trainToday = 0;
  state.soinToday = 0;
  state.restUsedToday = false;
  state.restIndivToday = 0;
  state.shootoutToday = 0;
  if(matchObj.grudge){
    if(statusBase==="W"){
      const revengeBonus = 25;
      state.budget += revengeBonus;
      state.worldRanking = clamp((state.worldRanking||18) - 1, 1, 60);
      addNews("Revanche", `🔥 Revanche réussie face à ${matchObj.opp} ! Prime spéciale de ${revengeBonus} M€ et prestige renforcé.`);
    } else {
      addNews("Revanche", `😤 La revanche face à ${matchObj.opp} n'a pas tourné en faveur des Bleus, ce sera pour une prochaine fois.`);
    }
  }
  const kineLvl = state.staff.kine||0;
  const participants = matchObj.usOrder ? [...matchObj.usOrder, ...((matchObj.outIds||[]).map(playerById))].filter(Boolean) : lineupPlayers();
  const seen = new Set();
  participants.forEach(p=>{
    if(!p || seen.has(p.id)) return;
    seen.add(p.id);
    const enduranceFactor = (100 - p.endurance) / 100;
    const loss = Math.max(0, Math.round(rand(2,8) * (0.5 + enduranceFactor) - kineLvl*1.5 - (state.staff.nutrition||0)*1));
    p.forme = Math.max(50, p.forme - loss);
    p.matchsJoues = (p.matchsJoues||0) + 1;
    p.historique = p.historique || [];
    p.historique.unshift({year:state.year, type:matchObj.type, opp:matchObj.opp, score:`${matchObj.us}-${matchObj.them}`, result:statusBase});
    if(p.historique.length>25) p.historique.length = 25;
    p.cardsThisMatch = 0;
    if(p.blessuresNb) state.teamStats.blessures = state.squad.reduce((s,x)=>s+(x.blessuresNb||0),0);
  });
  // decay suspension/injury counters for whole squad after the match
  state.squad.forEach(p=>{ if(p.indispo>0) p.indispo--; });
  state.lineup = {};
  state.teamTalkDone = false;
  resolveWeeklyChallenge(matchObj, statusBase);
  state.squad.forEach(p=> p.prevCote = preCotes[p.id]);

  // homme du match
  const candidates = (matchObj.usOrder||[]).filter(Boolean);
  if(candidates.length && statusBase !== "L"){
    const scored = candidates.map(p=>({p, score:(p.buts||0)*10 + overall(p) + (p.id===state.captainId?3:0) + Math.random()*8}));
    scored.sort((a,b)=> b.score-a.score);
    matchObj.motm = scored[0].p.id;
    scored[0].p.motm = (scored[0].p.motm||0) + 1;
  }
  candidates.forEach(p=> updateClubRecords(p));

  const diffKey = (state.settings && state.settings.difficulty) || "normal";
  const moneyMod = (DIFFICULTIES[diffKey]||DIFFICULTIES.normal).moneyMod;
  const typeMult = {amical:0.6, nations:0.8, qualif:1, "cdm-groupe":1.3, "cdm-seize":1.45, "cdm-huit":1.6, "cdm-quart":2, "cdm-demi":2.4, "cdm-finale":3};
  const fsPrizeMult = matchObj.competition === "footballstar" ? 1.6 : 1; // le plus grand tournoi verse la plus grosse prime
  const bonus = Math.round(((statusBase==="W"?16:statusBase==="D"?8:4) + rand(0,6)) * (typeMult[matchObj.type]||1) * moneyMod * fsPrizeMult);
  state.budget += bonus;
  matchObj.bonus = bonus;
  for(let i=0;i<2;i++){
    const slot = rand(0, state.market.length-1);
    const fresh = makePlayer(pick(POS));
    fresh.price = computePrice(fresh);
    state.market[slot] = fresh;
  }
  if(statusBase !== "L" && Math.random() < 0.5) state.scoutPending = true;

  // achievements
  if(statusBase==="W") unlockAchievement("premiereVictoire");
  if(!st.cartons.length) unlockAchievement("sansCarton");
  if(state.teamStats.cleanSheets >= 5) unlockAchievement("clean5");
  if(state.squad.some(p=> (p.matchsJoues||0) >= 20)) unlockAchievement("centenaire");
  if(state.squad.some(p=> (p.buts||0) >= 10)) unlockAchievement("buteurMaison");
  checkMaxAchievements();

  const koOrd = koOrder();
  const isFinalWin = statusBase==="W" && koOrd.indexOf(matchObj.type) === koOrd.length-1;
  const wonCompetition = state.competition;
  checkYearlyAgingTick();
  progressSeason();
  runDLCHooks("matchEnd", matchObj, statusBase);
  render();
  if(isFinalWin){
    setTimeout(()=> showChampionCelebration(matchObj, statusBase, wonCompetition), 500);
  } else {
    setTimeout(()=> showMatchSummary(matchObj, statusBase), 400);
  }
}

/* ---------------- MATCH LIVE DU CLUB (même moteur que la sélection, contexte "club") ---------------- */
function startClubLiveMatch(matchObj){
  const c = state.club;
  matchObj.ctx = "club";
  matchObj.status = "live";
  matchObj.minute = 0;
  matchObj.us = 0; matchObj.them = 0;
  matchObj.log = [];
  matchObj.halftimeDone = false;
  matchObj.halftimeMod = null;
  matchObj.subsUsed = 0;
  matchObj.subsMax = 3;
  matchObj.weather = pick(WEATHERS);
  matchObj.home = Math.random() < 0.5;
  matchObj.stats = {
    possUs:50, possThem:50,
    tirsUs:0, tirsThem:0, cadresUs:0, cadresThem:0,
    corUs:0, corThem:0, fautesUs:0, fautesThem:0,
    cartons:[]
  };
  const slots = clubSlotsSpec();
  matchObj.usOrder = slots.map(s => clubPlayerById(c.lineup[s]));
  const startingIds = new Set(matchObj.usOrder.filter(Boolean).map(p=>p.id));
  matchObj.benchIds = c.squad.filter(p=>!startingIds.has(p.id)).map(p=>p.id);
  matchObj.outIds = [];
  const spec = FORMATIONS[c.tactique.formation].spec;
  matchObj.formPos = buildFormPos(spec);
  const idxByPos = {};
  matchObj.formPos.forEach((p,i)=>{ (idxByPos[p.pos] = idxByPos[p.pos] || []).push(i); });
  matchObj.attIdx = idxByPos.ATT || [idxByPos.MIL[idxByPos.MIL.length-1]];
  matchObj.advMilIdx = idxByPos.MIL ? idxByPos.MIL[idxByPos.MIL.length-1] : idxByPos.DEF[idxByPos.DEF.length-1];
  matchObj.styleKey = c.tactique.style || "equilibre";
  const style = STYLES[matchObj.styleKey] || STYLES.equilibre;
  const analysteBonus = (state.staff.analyste||0) * 0.6;
  const mentalBonus = (state.staff.mental||0) * 0.5;
  ensureOppTactique(matchObj);
  const matchup = matchupReport(c.tactique.formation, matchObj.styleKey, matchObj.oppTactique.formation, matchObj.oppTactique.style);
  matchObj.tacticMod = matchup.mod;
  matchObj.tacticLines = matchup.lines;
  matchObj.ourStrength = clubTeamStrength() + (style.strengthMod||0) + analysteBonus + mentalBonus + matchup.mod + (matchObj.home?2.5:-1.5);
  const range = CLUB_OPP_RANGES[matchObj.type] || [45,75];
  matchObj.oppStrength = clamp(rand(range[0], range[1]), 20, 99);
  resetPositions(matchObj);
  if(matchup.mod > 0) addNews("Club", `Votre plan de jeu prend l'ascendant sur le système de ${matchObj.opp}.`);
  else if(matchup.mod < 0) addNews("Club", `Le système de ${matchObj.opp} pose quelques soucis tactiques à votre équipe.`);
  addNews("Club", `Coup d'envoi : ${c.name} contre ${matchObj.opp} sous ${matchObj.weather.label.replace(/^\S+\s/,'')}.`);
  SFX.whistle(false);
  SFX.startCrowdLoop();
  render();
  setTimeout(()=> tickMatch(matchObj), 700);
}

function finishClubMatch(matchObj){
  SFX.stopCrowdLoop();
  stopAmbientMotion(matchObj);
  const c = state.club;
  let statusBase = matchObj.us>matchObj.them ? "W" : matchObj.us<matchObj.them ? "L" : "D";
  const knockout = isKnockoutMatch(matchObj);
  if(statusBase === "D" && knockout){
    matchObj.penalties = true;
    const wonPens = typeof matchObj.wonPensResult === "boolean"
      ? matchObj.wonPensResult
      : Math.random() < clamp(0.5 + (matchObj.ourStrength-matchObj.oppStrength)/300, 0.25, 0.75);
    statusBase = wonPens ? "W" : "L";
    const etTxt = matchObj.extraTime ? " après prolongation" : "";
    const scoreTxt = matchObj.penaltiesScore ? ` (${matchObj.penaltiesScore.us}-${matchObj.penaltiesScore.opp} t.a.b.)` : "";
    pushEntry(matchObj, {min: matchObj.extraTime?120:90, goal:false, text: wonPens ? `🥅 Séance de tirs au but remportée${scoreTxt}${etTxt} !` : `🥅 Séance de tirs au but perdue${scoreTxt}${etTxt}...`});
  }
  matchObj.status = statusBase;
  if(statusBase==="W"){
    const wrap = document.getElementById("pitchWrap");
    if(wrap){ spawnConfetti(wrap); setTimeout(()=> spawnConfetti(wrap), 250); }
  }
  const scoreLabel = `${matchObj.us}-${matchObj.them}${matchObj.penalties?' t.a.b.':''}`;
  const newsTitle = statusBase==="W"
    ? `${c.name} s'impose ${scoreLabel} face à ${matchObj.opp} !`
    : statusBase==="D"
      ? `Match nul ${scoreLabel} entre ${c.name} et ${matchObj.opp}.`
      : `${c.name} s'incline ${scoreLabel} face à ${matchObj.opp}.`;
  addNews(typeLabelClub(matchObj.type), newsTitle);

  const bonus = Math.round((statusBase==="W"?6:statusBase==="D"?3:1) + rand(0,3));
  c.budget += bonus;
  matchObj.bonus = bonus;

  const participants = matchObj.usOrder ? [...matchObj.usOrder, ...((matchObj.outIds||[]).map(id=>clubPlayerById(id)))].filter(Boolean) : [];
  const seen = new Set();
  participants.forEach(p=>{
    if(!p || seen.has(p.id)) return;
    seen.add(p.id);
    const enduranceFactor = (100 - p.endurance) / 100;
    const loss = Math.max(0, Math.round(rand(2,8) * (0.5 + enduranceFactor)));
    p.forme = Math.max(50, p.forme - loss);
    p.matchsJoues = (p.matchsJoues||0) + 1;
    p.historique = p.historique || [];
    p.historique.unshift({year:state.year, type:matchObj.type, opp:matchObj.opp, score:`${matchObj.us}-${matchObj.them}`, result:statusBase});
    if(p.historique.length>25) p.historique.length = 25;
    p.cardsThisMatch = 0;
  });
  c.squad.forEach(p=>{ if(p.indispo>0) p.indispo--; });
  c.lineup = {};

  const candidates = (matchObj.usOrder||[]).filter(Boolean);
  if(candidates.length && statusBase !== "L"){
    const scored = candidates.map(p=>({p, score:(p.buts||0)*10 + overall(p) + Math.random()*8}));
    scored.sort((a,b)=> b.score-a.score);
    matchObj.motm = scored[0].p.id;
    scored[0].p.motm = (scored[0].p.motm||0) + 1;
  }

  const isClubFinalWin = c.phase === "finale" && matchObj.type === "ldc-finale" && statusBase === "W";
  progressClubSeason();
  render();
  if(isClubFinalWin){
    setTimeout(()=> showClubChampionCelebration(matchObj, statusBase), 500);
  } else {
    setTimeout(()=> showClubMatchSummary(matchObj, statusBase), 400);
  }
}

function placeAllDots(m){
  const ball = document.getElementById("ball");
  const ballShadow = document.getElementById("ballShadow");
  if(ball){ ball.style.left = m.pos.ball.x+"%"; ball.style.top = m.pos.ball.y+"%"; }
  if(ballShadow){ ballShadow.style.left = m.pos.ball.x+"%"; ballShadow.style.top = m.pos.ball.y+"%"; }
  let closestD = null, closestDist = Infinity;
  m.pos.us.forEach((p,i)=>{
    const d = document.getElementById("dot-us-"+i);
    if(d){
      d.style.left=p.x+"%"; d.style.top=p.y+"%";
      const dist = Math.hypot(p.x-m.pos.ball.x, p.y-m.pos.ball.y);
      if(dist < closestDist){ closestDist = dist; closestD = d; }
    }
  });
  m.pos.them.forEach((p,i)=>{
    const d = document.getElementById("dot-them-"+i);
    if(d){
      d.style.left=p.x+"%"; d.style.top=p.y+"%";
      const dist = Math.hypot(p.x-m.pos.ball.x, p.y-m.pos.ball.y);
      if(dist < closestDist){ closestDist = dist; closestD = d; }
    }
  });
  document.querySelectorAll(".dot.has-ball").forEach(el=>{ if(el!==closestD) el.classList.remove("has-ball"); });
  if(closestD && closestDist < 9) closestD.classList.add("has-ball");
}

// Séance de tirs au but simulée round par round (au lieu d'un simple tirage au sort instantané) :
// rend les matchs qui vont au bout (prolongation + t.a.b.) visiblement plus longs et plus tendus
// à regarder que les matchs pliés en 90 minutes. Le résultat (m.wonPensResult/m.penaltiesScore)
// est calculé ICI, à partir du même écart de force que l'ancien tirage (winChance), puis repris
// tel quel par finishMatch()/finishClubMatch() pour éviter toute incohérence entre le score de
// la séance affiché à l'écran et le verdict final annoncé juste après.
function isPenaltyShootoutNeeded(m){
  return !!m.extraTime && m.us === m.them && isKnockoutMatch(m);
}
async function playPenaltyShootoutAnimation(m){
  if(!isPenaltyShootoutNeeded(m) || m.wonPensResult !== undefined) return;
  const teamName = m.ctx==="club" ? state.club.name : "les Bleus";
  const diff = (m.ourStrength||0) - (m.oppStrength||0);
  const winChance = clamp(0.5 + diff/300, 0.25, 0.75);
  const skew = (winChance - 0.5) * 0.3;
  const usPerKick = clamp(0.74 + skew, 0.55, 0.92);
  const oppPerKick = clamp(0.74 - skew, 0.55, 0.92);
  pushEntry(m, {min:120, goal:false, text:`🥅 Toujours à égalité après prolongation : place à la séance de tirs au but entre ${teamName} et ${m.opp} !`});
  await mDelay(700);
  let usScore = 0, oppScore = 0, round = 0;
  while(true){
    round++;
    const usScored = Math.random() < usPerKick;
    if(usScored) usScore++;
    pushEntry(m, {min:120, goal:false, text: usScored ? `🥅 ${teamName} transforme son tir (${usScore}-${oppScore}).` : `❌ ${teamName} manque son tir (${usScore}-${oppScore}).`});
    await mDelay(620);
    const oppScored = Math.random() < oppPerKick;
    if(oppScored) oppScore++;
    pushEntry(m, {min:120, goal:false, text: oppScored ? `🥅 ${m.opp} transforme son tir (${usScore}-${oppScore}).` : `❌ ${m.opp} manque son tir (${usScore}-${oppScore}).`});
    await mDelay(620);
    if(round >= 5 && usScore !== oppScore) break;
    if(round >= 15) { if(usScore===oppScore) usScore++; break; } // filet de sécurité (quasi jamais atteint)
  }
  m.penaltiesScore = {us:usScore, opp:oppScore};
  m.wonPensResult = usScore > oppScore;
  pushEntry(m, {min:120, goal:false, text:"🤐 Fin de la séance, place au verdict..."});
  await mDelay(500);
}

function showFinalButton(m){
  const footer = document.getElementById("liveMatchFooter");
  if(footer && !document.getElementById("finalBtn")){
    footer.innerHTML = `<button class="btn btn-primary" id="finalBtn" style="margin-top:12px;">Voir le résultat final</button>`;
    document.getElementById("finalBtn").onclick = async ()=>{
      const btn = document.getElementById("finalBtn");
      if(btn){ btn.disabled = true; btn.textContent = "..."; }
      await playPenaltyShootoutAnimation(m);
      (m.ctx==="club" ? finishClubMatch(m) : finishMatch(m));
    };
  }
}

          </div>`).join("") : `<div class="empty-note">Plus personne de disponible sur le banc.</div>`}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("closeSheet").onclick = closeSheet;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
  overlay.querySelectorAll("[data-in]").forEach(c=> c.onclick = ()=> doSubstitution(m, outIdx, c.dataset.in));
}

function doSubstitution(m, outIdx, inId){
  const inPlayer = ctxPlayerById(m, inId);
  const outPlayer = m.usOrder[outIdx];
  if(!inPlayer || !outPlayer) return;
  m.usOrder[outIdx] = inPlayer;
  m.benchIds = (m.benchIds||[]).filter(id=> id!==inId);
  m.outIds = m.outIds||[]; m.outIds.push(outPlayer.id);
  m.subsUsed++;
  const delta = (overall(inPlayer) - overall(outPlayer)) * 0.15;
  m.ourStrength = (m.ourStrength||0) + delta + 0.8;
  pushEntry(m, {min:m.minute, goal:false, text:`🔄 Changement : ${inPlayer.nom} entre à la place de ${outPlayer.nom}.`});
  closeSheet();
  render();
}

function upgradeStaff(key){
  const lvl = state.staff[key]||0;
  if(lvl>=3) return;
  const cost = staffCost(key, lvl);
  if(state.budget < cost) return;
  state.budget -= cost;
  state.staff[key] = lvl+1;
  recalcMaxTrain();
  addNews("Staff", `${STAFF_DEFS[key].label} passe niveau ${lvl+1} au sein du staff technique.`);
  render();
}

function buyPlayer(idx){
  const p = state.market[idx];
  if(!p || state.budget < p.price) return;
  state.budget -= p.price;
  addNews("Mercato", `${p.nom} (${p.pos}) rejoint la sélection contre ${p.price} M€.`);
  delete p.price;
  state.squad.push(p);
  state.transfersCount = (state.transfersCount||0) + 1;
  if(state.transfersCount >= 10) unlockAchievement("recruteur10");
  const fresh = makePlayer(pick(POS));
  fresh.price = computePrice(fresh);
  state.market[idx] = fresh;
  render();
}

/* ---------------- CÉLÉBRATION CHAMPION DU MONDE / EUROPE ---------------- */
function spawnFireworks(container, bursts){
  const colors = ["#d4af37","#ffe38a","#5fb87a","#4c86c4","#f4f7f5","#c1121f"];
  let done = 0;
  function oneBurst(){
    // Si l'écran de célébration a déjà été fermé (fiche retirée du DOM), on arrête
    // la chaîne de setTimeout au lieu de continuer à créer des particules dans le vide :
    // ça évite des timers et des nœuds DOM orphelins qui s'accumulent en arrière-plan.
    if(!container || !container.isConnected) return;
    const cx = rand(15,85), cy = rand(15,60);
    const color = pick(colors);
    for(let i=0;i<14;i++){
      const p = document.createElement("div");
      p.className = "fw-particle";
      const angle = (Math.PI*2/14)*i + Math.random()*0.4;
      const dist = rand(40,90);
      p.style.left = cx+"%"; p.style.top = cy+"%"; p.style.color = color;
      p.style.setProperty("--fx", Math.round(Math.cos(angle)*dist)+"px");
      p.style.setProperty("--fy", Math.round(Math.sin(angle)*dist)+"px");
      container.appendChild(p);
      requestAnimationFrame(()=> p.classList.add("burst"));
      setTimeout(()=> p.remove(), 1100);
    }
    done++;
    if(done < bursts) setTimeout(oneBurst, rand(350,600));
  }
  oneBurst();
}
