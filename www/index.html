.opp-names{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12.5px; color:#e8ecf5;}

/* ---- v44 : terrain 2D en perspective 2.5D (vue "tribune"), pions debout face caméra ---- */
.pitch-wrap:not(.mode3d){transform:perspective(720px) rotateX(30deg) scale(0.97); transform-origin:50% 75%; margin-top:-34px;
  box-shadow:0 30px 40px -18px rgba(0,0,0,0.7);}
.pitch-wrap:not(.mode3d) .dot{transform:translate(-50%,-85%) rotateX(-30deg); transform-origin:50% 100%;}
.pitch-wrap:not(.mode3d) .goal-flash{transform:rotateX(-30deg);}
.pitch-wrap:not(.mode3d) .goal-l, .pitch-wrap:not(.mode3d) .goal-r{box-shadow:0 -6px 0 rgba(255,255,255,0.35);}

/* ---- v44 : cartes joueurs façon "cartes à collectionner" ---- */
.player-card{position:relative; overflow:hidden;}
.player-card::after{content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.07) 45%, transparent 55%); background-size:250% 100%;
  animation:cardSheen 6s ease-in-out infinite;}
.player-card.special::after{background:linear-gradient(115deg, transparent 35%, rgba(255,228,140,0.22) 45%, transparent 55%); background-size:250% 100%;}
@keyframes cardSheen{0%,70%{background-position:120% 0;} 100%{background-position:-120% 0;}}
.pos-badge{border-radius:10px 10px 10px 3px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), 0 3px 8px rgba(0,0,0,0.35);}

/* =====================================================================================
   v45 — REFONTE DES MENUS ET DES OPTIONS (dernier bloc : prioritaire sur les précédents)
   ===================================================================================== */
:root{ --glass:rgba(255,255,255,0.055); --glass-2:rgba(255,255,255,0.09); --stroke:rgba(255,255,255,0.10); --accent:#4c86c4; }
/* Barre du haut */
.topbar{position:relative; padding:12px 14px 10px; background:
  radial-gradient(ellipse 80% 120% at 0% 0%, rgba(76,134,196,0.22), transparent 60%),
  radial-gradient(ellipse 60% 120% at 100% 0%, rgba(212,175,55,0.16), transparent 60%),
  linear-gradient(180deg, rgba(14,22,48,0.96), rgba(8,12,28,0.85));}
.topbar .brand{gap:10px;}
.brand-logo{width:40px; height:40px; border-radius:12px; box-shadow:0 0 0 1px rgba(212,175,55,0.45), 0 6px 16px rgba(0,0,0,0.5);}
.brand-txt h1{font-size:23px; line-height:1;}
.brand-sub{display:flex; align-items:center; gap:6px; margin-top:3px; font-family:'Barlow Condensed'; font-weight:600; font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--chalk); opacity:.85;}
.brand-sub .flag{width:16px; height:11px;}
.icon-cluster{background:var(--glass); border-color:var(--stroke); padding:4px; gap:2px;}
.icon-cluster .close-x{width:34px; height:34px; border-radius:12px; font-size:16px;}
.stat-strip-top{gap:7px; margin-top:12px;}
.record{display:block; white-space:nowrap; padding:6px 12px 6px; border-radius:12px; background:var(--glass);
  border-color:var(--stroke); font-size:13px; line-height:1.1; box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);}
.record .rk{display:block; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--chalk); opacity:.6; margin-bottom:2px;}
.record b{margin:0 1px;}
/* Titres et sous-navigation segmentée */
.section-title{font-size:30px; margin:2px 0 12px;}
.eyebrow{display:inline-flex; align-items:center; gap:6px;}
.eyebrow::before{content:''; width:14px; height:2px; background:var(--gold); border-radius:2px; box-shadow:0 0 8px var(--gold);}
.subnav{background:rgba(0,0,0,0.28); border:1px solid var(--stroke); border-radius:14px; padding:4px; gap:4px;}
.subnav-btn{border:none; border-radius:10px; background:transparent; padding:9px 6px;}
.subnav-btn.active{background:linear-gradient(180deg, rgba(212,175,55,0.32), rgba(212,175,55,0.14)); box-shadow:inset 0 0 0 1px rgba(212,175,55,0.5), 0 4px 12px rgba(0,0,0,0.3);}
/* Boutons d'action secondaires */
.btn-soin{border-radius:12px; background:linear-gradient(180deg, rgba(76,134,196,0.22), rgba(76,134,196,0.1)); border-color:rgba(76,134,196,0.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.25); transition:transform .12s, filter .15s;}
.btn-soin:active:not(:disabled){transform:scale(0.97); filter:brightness(1.15);}
.btn-ghost{border-radius:12px; background:var(--glass); border-color:var(--stroke);}
.btn{border-radius:13px;}
/* Listes, classements, actus, sélecteurs */
.standing-row{border-bottom-color:rgba(255,255,255,0.06); border-radius:10px; padding:10px 8px;}
.standing-row:nth-child(odd){background:rgba(255,255,255,0.025);}
.news-item{border-radius:14px; border-color:var(--stroke); background:linear-gradient(135deg, var(--glass-2), rgba(255,255,255,0.02));}
.slot-pick{border-radius:12px; background:var(--glass); border-color:var(--stroke); padding:11px 13px;}
.slot-pick.filled{border-color:rgba(95,184,122,0.55); background:linear-gradient(90deg, rgba(95,184,122,0.12), var(--glass) 60%);}
.tactic-bar{border-radius:14px; padding:12px 14px;}
.commentary{border-radius:14px; border-color:var(--stroke); background:rgba(0,0,0,0.25);}
.commentary .ev{border-bottom-color:rgba(255,255,255,0.05);}
/* Fiches (sheets) */
.overlay{background:rgba(3,6,14,0.72); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
.sheet{border-radius:26px 26px 0 0; padding:14px 18px 30px; border-top:1px solid rgba(212,175,55,0.35);}
.sheet::before{content:''; display:block; width:44px; height:5px; border-radius:3px; background:rgba(255,255,255,0.22); margin:0 auto 12px;}
.sheet-head{padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.07); margin-bottom:14px;}
.close-x{border-radius:50%;}
.sheet-head .close-x{width:34px; height:34px; background:var(--glass); border:1px solid var(--stroke); font-size:15px;}
/* Réglages : sections, cartes, interrupteurs, choix segmentés */
.set-title{font-family:'Barlow Condensed'; font-weight:700; text-transform:uppercase; letter-spacing:.12em; font-size:12.5px;
  color:var(--gold); margin:18px 2px 8px;}
.set-title.danger{color:#f19aa0;}
.set-card{background:linear-gradient(135deg, var(--glass-2), rgba(255,255,255,0.025)); border:1px solid var(--stroke); border-radius:16px;
  padding:4px 12px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 20px rgba(0,0,0,0.25);}
.set-row{display:flex; align-items:center; gap:12px; padding:12px 0; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.06);}
.set-card > :last-child{border-bottom:none;}
.set-ic{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px;
  background:rgba(255,255,255,0.07); flex-shrink:0;}
.set-lab{flex:1; font-weight:600; font-size:14.5px; display:flex; flex-direction:column; gap:2px;}
.set-lab small{font-weight:400; font-size:11.5px; color:var(--chalk); opacity:.75;}
.set-block{padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.06);}
.set-block .set-lab{margin-bottom:9px;}
.switch{width:48px; height:28px; border-radius:16px; background:rgba(255,255,255,0.14); position:relative; flex-shrink:0; transition:background .2s;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.4);}
.switch i{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.4);
  transition:transform .22s cubic-bezier(.3,1.4,.5,1);}
.switch.on{background:linear-gradient(90deg,#2f9e5a,#5fd08a);}
.switch.on i{transform:translateX(20px);}
.seg{display:flex; gap:4px; background:rgba(0,0,0,0.3); border:1px solid var(--stroke); border-radius:12px; padding:3px; flex-wrap:wrap;}
.set-card > .seg{margin:10px 0;}
.seg-btn{flex:1; min-width:60px; border:none; background:transparent; color:var(--chalk); font-family:'Barlow Condensed'; font-weight:700;
  font-size:13px; letter-spacing:.03em; padding:8px 6px; border-radius:9px; cursor:pointer; transition:background .15s, color .15s;}
.seg-btn.on{background:linear-gradient(180deg,#f0d77a,#d4af37); color:#1d1500; box-shadow:0 3px 10px rgba(212,175,55,0.35);}
/* Barre d'onglets */
.tabbar{padding:7px 6px; gap:3px;}
.tab-btn{font-size:9.5px; gap:3px; padding:7px 0 6px; position:relative;}
.tab-btn .ic{font-size:20px; filter:saturate(0.7); transition:transform .2s, filter .2s;}
.tab-btn.active .ic{filter:saturate(1.2) drop-shadow(0 0 6px rgba(212,175,55,0.6)); transform:translateY(-1px);}
.tab-btn.active::after{content:''; position:absolute; bottom:2px; left:30%; right:30%; height:3px; border-radius:2px; background:var(--gold); box-shadow:0 0 8px var(--gold);}

/* =====================================================================================
   v46 — NOUVEAU DESIGN DE L'APPLI ("Matchday") : graphite, bleu électrique, rouge, cartes pleines,
   titres condensés italiques. Tout est préfixé par body:not(.in-live) (= body:not(.in-live)) : le MATCH EN DIRECT
   (buildLiveMatch ajoute body.in-live) garde volontairement son design précédent.
   ===================================================================================== */
body:not(.in-live) {
  --bg:#0a0c11; --bg-2:#0f121a; --card:#161a24; --card-2:#1c2130; --card-3:#232a3c;
  --ink:#f3f6fb; --ink-2:#a9b2c6; --ink-3:#6f7a92; --blue:#3d7bff; --blue-2:#6aa0ff; --red:#ff3b4e; --green:#2bd47d; --amber:#ffb020;
  --gold:#ffcc3d; --line:rgba(255,255,255,0.07); --chalk:#a9b2c6;
  background:var(--bg) !important;
}
body:not(.in-live) #app{background:var(--bg); border:none; box-shadow:none; padding-bottom:96px;}
body:not(.in-live) .screen{padding:16px 16px 24px;}
/* Typographie */
body:not(.in-live) .section-title, body:not(.in-live) h2{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-style:italic; text-transform:uppercase;
  letter-spacing:.01em; text-shadow:none;}
body:not(.in-live) .section-title{font-size:32px; line-height:1; margin:4px 0 14px;}
body:not(.in-live) .eyebrow{font-family:'Barlow',sans-serif; font-weight:700; font-size:11px; letter-spacing:.16em; color:var(--blue-2);}
body:not(.in-live) .eyebrow::before{width:6px; height:6px; border-radius:50%; background:var(--red); box-shadow:none;}
body:not(.in-live) .formation-note, body:not(.in-live) .potential-note{color:var(--ink-2);}
body:not(.in-live) .empty-note{color:var(--ink-3);}
/* En-tête */
body:not(.in-live) .topbar{background:var(--bg-2); border-bottom:1px solid var(--line); box-shadow:none; padding:12px 16px 12px;}
body:not(.in-live) .brand-logo{border-radius:50%; box-shadow:0 0 0 2px var(--blue), 0 0 0 4px rgba(61,123,255,0.25);}
body:not(.in-live) .brand-txt h1, body:not(.in-live) .brand h1{background:none; -webkit-background-clip:initial; background-clip:initial; color:var(--ink);
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-style:italic; font-size:24px; letter-spacing:.01em; text-transform:uppercase;}
body:not(.in-live) .brand-sub{color:var(--ink-3); letter-spacing:.08em;}
body:not(.in-live) .icon-cluster{background:var(--card); border:1px solid var(--line); border-radius:14px;}
body:not(.in-live) .icon-cluster .close-x{border-radius:10px;}
body:not(.in-live) .record{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:none; color:var(--ink);}
body:not(.in-live) .record b{color:var(--ink);}
body:not(.in-live) .record .rk{color:var(--blue-2); opacity:1;}
/* Cartes génériques */
body:not(.in-live) .player-card, body:not(.in-live) .news-item, body:not(.in-live) .staff-card, body:not(.in-live) .stat-box, body:not(.in-live) .scout-card, body:not(.in-live) .tactic-bar, body:not(.in-live) .slot-pick, body:not(.in-live) .opp-lineup,
body:not(.in-live) .set-card, body:not(.in-live) .friendly-box, body:not(.in-live) .info-chip{
  background:var(--card) !important; border:1px solid var(--line) !important; border-radius:18px; box-shadow:none !important;
  -webkit-backdrop-filter:none; backdrop-filter:none;}
body:not(.in-live) .player-card{padding:12px 14px; margin-bottom:10px;}
body:not(.in-live) .player-card::after{display:none;}
body:not(.in-live) .player-card:active{background:var(--card-2) !important; transform:scale(0.985);}
body:not(.in-live) .player-card.special{border-color:rgba(255,204,61,0.45) !important; background:linear-gradient(100deg, rgba(255,204,61,0.12), var(--card) 55%) !important;}
body:not(.in-live) .player-card.doped-card{border-color:rgba(165,87,224,0.6) !important;}
body:not(.in-live) .player-card.banned-card{border-color:rgba(255,59,78,0.6) !important;}
body:not(.in-live) .pc-name{font-weight:700; font-size:15.5px;}
body:not(.in-live) .pc-sub{color:var(--ink-3);}
body:not(.in-live) .pos-badge{border-radius:12px; width:40px; height:40px; font-size:13px; border:none; box-shadow:none; font-family:'Barlow Condensed'; font-style:italic;}
body:not(.in-live) .pos-GB{background:linear-gradient(160deg,#ffb020,#c77a00);}
body:not(.in-live) .pos-DEF{background:linear-gradient(160deg,#3d7bff,#1f4fc7);}
body:not(.in-live) .pos-MIL{background:linear-gradient(160deg,#2bd47d,#169454);}
body:not(.in-live) .pos-ATT{background:linear-gradient(160deg,#ff3b4e,#c4162a);}
body:not(.in-live) .stat-pill{background:var(--card-3); border:none; box-shadow:none; width:30px; height:30px; font-size:12.5px;}
body:not(.in-live) .stat-pill.cote{background:rgba(255,204,61,0.16); color:var(--gold);}
body:not(.in-live) .stat-pill.hi{color:var(--green);} body:not(.in-live) .stat-pill.lo{color:#ff7d8a;}
body:not(.in-live) .stat-box .num{font-family:'Barlow Condensed'; font-weight:700; font-style:italic; font-size:28px; color:var(--ink);}
body:not(.in-live) .stat-box .lab{color:var(--ink-3); letter-spacing:.06em;}
body:not(.in-live) .stat-box-clickable:active{background:var(--card-2) !important;}
body:not(.in-live) .news-item{padding:14px;}
body:not(.in-live) .news-tag{color:var(--blue-2); background:rgba(61,123,255,0.12); border:none; border-radius:8px;}
body:not(.in-live) .news-title{color:var(--ink);}
body:not(.in-live) .standing-row{background:transparent !important; border-radius:0; border-bottom:1px solid var(--line); padding:12px 4px;}
body:not(.in-live) .standing-row.fr-row{background:rgba(61,123,255,0.10) !important; border-radius:12px; border-bottom-color:transparent;}
body:not(.in-live) .tag{border-radius:8px; letter-spacing:.04em;}
body:not(.in-live) .tag.W{background:rgba(43,212,125,0.15); color:var(--green);}
body:not(.in-live) .tag.D{background:rgba(255,176,32,0.15); color:var(--amber);}
body:not(.in-live) .tag.L{background:rgba(255,59,78,0.15); color:#ff7d8a;}
body:not(.in-live) .tag.pending{background:var(--card-3); color:var(--ink-2);}
/* Barres de progression */
body:not(.in-live) .bar-track{background:var(--card-3); height:7px;}
body:not(.in-live) .bar-fill{background:linear-gradient(90deg,#1f4fc7,var(--blue)); box-shadow:none;}
body:not(.in-live) .bar-fill.def{background:linear-gradient(90deg,#169454,var(--green));}
body:not(.in-live) .bar-fill.form{background:linear-gradient(90deg,#c77a00,var(--amber));}
body:not(.in-live) .bar-label{color:var(--ink-3);}
/* Boutons */
body:not(.in-live) .btn{border-radius:14px; font-family:'Barlow Condensed'; font-weight:700; font-style:italic; letter-spacing:.04em; font-size:16px; padding:13px 16px;}
body:not(.in-live) .btn-primary{background:var(--blue) !important; color:#fff !important; box-shadow:0 8px 22px rgba(61,123,255,0.35) !important;}
body:not(.in-live) .btn-primary::after{display:none;}
body:not(.in-live) .btn-primary:disabled{background:var(--card-3) !important; color:var(--ink-3) !important; box-shadow:none !important;}
body:not(.in-live) .btn-ghost{background:var(--card); border:1px solid var(--line); color:var(--ink);}
body:not(.in-live) .btn-ghost:active{background:var(--card-2);}
body:not(.in-live) .btn-soin{background:var(--card-2); border:1px solid var(--line); color:var(--ink); border-radius:14px; box-shadow:none;
  font-family:'Barlow Condensed'; font-style:italic;}
body:not(.in-live) .btn-soin:disabled{opacity:.45;}
body:not(.in-live) .tactic-label{color:var(--blue-2);}
body:not(.in-live) .slot-pick.filled{border-color:rgba(43,212,125,0.45) !important; background:linear-gradient(90deg, rgba(43,212,125,0.10), var(--card) 60%) !important;}
body:not(.in-live) .slot-group h3, body:not(.in-live) .set-title{color:var(--blue-2);}
/* Sous-navigation */
body:not(.in-live) .subnav{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:4px;}
body:not(.in-live) .subnav-btn{color:var(--ink-2); font-family:'Barlow Condensed'; font-style:italic; border-radius:12px;}
body:not(.in-live) .subnav-btn.active{background:var(--blue); color:#fff; box-shadow:0 6px 16px rgba(61,123,255,0.35);}
/* Champs */
body:not(.in-live) input[type="text"], body:not(.in-live) input[type="search"], body:not(.in-live) input:not([type]), body:not(.in-live) select{background:var(--card) !important; border:1px solid var(--line) !important;
  border-radius:14px !important; color:var(--ink) !important;}
body:not(.in-live) input[type="checkbox"]{accent-color:var(--blue);}
/* Fiches */
body:not(.in-live) .overlay{background:rgba(5,7,12,0.7);}
body:not(.in-live) .sheet{background:var(--bg-2); border-top:none; border-radius:28px 28px 0 0; box-shadow:0 -20px 60px rgba(0,0,0,0.6);}
body:not(.in-live) .sheet::before{background:var(--card-3);}
body:not(.in-live) .sheet-head{border-bottom-color:var(--line);}
body:not(.in-live) .sheet-head .close-x{background:var(--card); border-color:var(--line);}
body:not(.in-live) .seg{background:var(--card-2); border-color:var(--line);}
body:not(.in-live) .seg-btn{color:var(--ink-2); font-style:italic;}
body:not(.in-live) .seg-btn.on{background:var(--blue); color:#fff; box-shadow:0 4px 12px rgba(61,123,255,0.35);}
body:not(.in-live) .switch.on{background:var(--blue);}
body:not(.in-live) .set-ic{background:var(--card-3);}
/* Barre d'onglets */
body:not(.in-live) .tabbar{background:rgba(15,18,26,0.96); border:1px solid var(--line); border-radius:24px; box-shadow:0 14px 34px rgba(0,0,0,0.6);}
body:not(.in-live) .tab-btn{color:var(--ink-3); font-family:'Barlow',sans-serif; font-weight:600; font-size:9.5px; text-transform:none; letter-spacing:0;}
body:not(.in-live) .tab-btn .ic{filter:grayscale(1) brightness(1.2); opacity:.7;}
body:not(.in-live) .tab-btn.active{background:rgba(61,123,255,0.14); color:#fff; box-shadow:none;}
body:not(.in-live) .tab-btn.active .ic{filter:none; opacity:1; transform:translateY(-1px) scale(1.08);}
body:not(.in-live) .tab-btn.active::after{background:var(--blue); box-shadow:0 0 10px var(--blue); left:38%; right:38%;}
/* Avant-match */
body:not(.in-live) .s3d-hero{border:none; border-radius:20px; box-shadow:0 14px 30px rgba(0,0,0,0.5);}
body:not(.in-live) .opp-lineup-head b{color:var(--ink);} body:not(.in-live) .opp-pos{color:var(--red);}
body:not(.in-live) .action-btn{background:var(--card-2); border:1px solid var(--line); border-radius:14px; color:var(--ink);}
body:not(.in-live) .action-btn:active{background:var(--card-3); border-color:rgba(61,123,255,0.5);}
body:not(.in-live) .info-chip .ic-val{color:var(--ink);} body:not(.in-live) .info-chip .ic-lab{color:var(--ink-3);}

/* ---- v47 : cartes joueurs façon "Ultimate Team" (futCardHTML) ---- */
.fut-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px 8px; margin-top:4px;}
.fut-card{--c1:#f7e08a; --c2:#c99a2e; --ink:#2b2104; --line:rgba(43,33,4,0.25);
  position:relative; aspect-ratio:0.7; border-radius:10px; overflow:hidden; cursor:pointer; color:var(--ink);
  background:radial-gradient(ellipse 90% 60% at 50% 30%, rgba(255,255,255,0.45), transparent 60%), linear-gradient(160deg, var(--c1), var(--c2));
  clip-path:polygon(50% 0%, 88% 4%, 100% 12%, 100% 86%, 50% 100%, 0% 86%, 0% 12%, 12% 4%);
  box-shadow:0 10px 22px rgba(0,0,0,0.45); transition:transform .15s ease; font-family:'Barlow Condensed',sans-serif;
  display:flex; flex-direction:column; align-items:center; padding:9% 6% 12%;}
.fut-card:active{transform:scale(0.96);}
.fut-card::before{content:''; position:absolute; inset:4px; clip-path:inherit; border:1.5px solid var(--line); border-radius:8px; pointer-events:none;
  background:repeating-linear-gradient(125deg, rgba(255,255,255,0.06) 0 6px, transparent 6px 14px);}
.fut-shine{position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.55) 45%, transparent 58%);
  background-size:260% 100%; animation:futShine 5s ease-in-out infinite; mix-blend-mode:overlay;}
@keyframes futShine{0%,65%{background-position:130% 0;} 100%{background-position:-130% 0;}}
.fut-top{position:absolute; left:9%; top:12%; display:flex; flex-direction:column; align-items:center; line-height:1; z-index:2;}
.fut-ovr{font-family:'Bebas Neue',sans-serif; font-size:clamp(20px, 7vw, 30px);}
.fut-pos{font-weight:700; font-size:clamp(9px, 2.8vw, 12px); letter-spacing:.04em;}
.fut-flag{font-size:clamp(10px, 3vw, 14px); margin-top:3px;}
.fut-fav{font-size:10px; margin-top:2px;}
.fut-face{width:62%; margin-left:18%; margin-top:2%; z-index:1;}
.fut-avatar{width:100%; height:auto; display:block; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.25));}
.fut-name{z-index:2; width:100%; text-align:center; font-weight:700; font-size:clamp(10px, 3.3vw, 14px); text-transform:uppercase; letter-spacing:.02em;
  border-bottom:1px solid var(--line); padding-bottom:2px; margin-top:-2%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fut-stats{z-index:2; display:grid; grid-template-columns:1fr 1fr; gap:0 10%; width:84%; margin-top:3%; font-size:clamp(8.5px, 2.6vw, 11.5px);}
.fut-stats div{display:flex; gap:4px; align-items:baseline; justify-content:flex-start;}
.fut-stats b{font-weight:700; min-width:1.6em; text-align:right;}
.fut-stats span{opacity:.75; font-weight:600;}
.fut-tier{position:absolute; bottom:5%; left:0; right:0; text-align:center; font-size:clamp(6.5px, 2vw, 9px); letter-spacing:.2em; font-weight:700; opacity:.65; z-index:2;}
.fut-status{position:absolute; top:44%; left:-10%; right:-10%; transform:rotate(-14deg); text-align:center; z-index:3; font-weight:700;
  letter-spacing:.2em; font-size:clamp(9px, 2.8vw, 12px); padding:2px 0; color:#fff;}
.fut-status.ban{background:rgba(200,16,46,0.88);} .fut-status.inj{background:rgba(255,140,0,0.88);}
.fut-bronze{--c1:#e0aa76; --c2:#8a5a2e; --ink:#2a1606; --line:rgba(42,22,6,0.3);}
.fut-argent{--c1:#f2f4f7; --c2:#9aa3ad; --ink:#1e2329; --line:rgba(30,35,41,0.25);}
.fut-or{--c1:#fbe9a0; --c2:#c99a2e; --ink:#2b2104;}

// ---- Tactiques de match : matrice d'avantages gradués entre formations et entre styles ----
// Pas de cycle imposé (chaque système ne "bat" pas forcément un système précis et n'est pas
// forcément "battu" par un autre) : chaque duel listé ci-dessous a un mod signé (du point de vue
// de "a" ; positif = a favorisé face à b, négatif = b favorisé face à a) dont la magnitude (1 à 3)
// reflète à quel point le duel est tranché. Un duel absent de la liste (ex: possession vs
// offensif) est neutre : ça reste un choix tactique qui peut aider un peu, pas une règle rigide.
// Utilisé par matchupReport()/formationMatchupMod()/styleMatchupMod() pour donner une vraie
// raison de choisir sa composition en fonction du plan de jeu adverse (cf. ensureOppTactique()).
const FORMATION_MATCHUPS = [
  {a:"433", b:"532", mod:3,  raison:"les largeurs prises par les ailiers et le surnombre offensif débordent un bloc bas à 5 défenseurs, plus lent à ressortir le ballon."},
  {a:"433", b:"352", mod:1,  raison:"le double couloir occupé par les ailiers étire un 3-5-2 qui manque d'un vrai second attaquant pour peser en profondeur."},
  {a:"433", b:"442", mod:-1, raison:"la couverture latérale à quatre derrière neutralise en grande partie les largeurs offertes par un milieu à trois, plus court en soutien défensif."},
  {a:"532", b:"352", mod:-2, raison:"le surnombre au milieu d'un 3-5-2 dicte le tempo et prive un bloc bas de ballon pour ressortir proprement."},
  {a:"532", b:"442", mod:2,  raison:"le surnombre défensif à cinq absorbe bien un duo d'attaquants classique, qui manque de soutien pour créer le décalage."},
  {a:"352", b:"442", mod:3,  raison:"le surnombre au milieu (5 contre 4) permet de dicter le tempo et d'étouffer la relance d'un 4-4-2 plus classique."},
];
const STYLE_MATCHUPS = [
  {a:"contre",     b:"possession", mod:3,  raison:"une équipe qui monopolise le ballon est idéale à punir en transition rapide, elle laisse des espaces dans son dos."},
  {a:"possession", b:"defensif",   mod:2,  raison:"la patience et la circulation du ballon finissent par ouvrir un bloc reculé, qui manque de munitions pour repartir vite."},
  {a:"defensif",   b:"offensif",  mod:2,  raison:"un bloc compact absorbe bien les assauts d'une équipe tout entière tournée vers l'attaque, qui laisse des espaces derrière elle."},
  {a:"offensif",   b:"contre",     mod:1,  raison:"en prenant le jeu à son compte, on prive l'adversaire des espaces dont il a besoin pour contre-attaquer."},
  {a:"contre",     b:"defensif",   mod:-1, raison:"un bloc bas laisse peu d'espaces à exploiter en transition, ce qui limite l'efficacité d'un jeu tout en contres."},
  // possession vs offensif volontairement absent : duel neutre, aucun ascendant particulier.
];
function findMatchup(list, k1, k2){
  return list.find(e => (e.a===k1 && e.b===k2) || (e.a===k2 && e.b===k1)) || null;
}
function formationMatchupMod(formationKey, oppFormationKey){
  const e = findMatchup(FORMATION_MATCHUPS, formationKey, oppFormationKey);
  if(!e) return 0;
  return e.a===formationKey ? e.mod : -e.mod;
}
function styleMatchupMod(styleKey, oppStyleKey){
  const e = findMatchup(STYLE_MATCHUPS, styleKey, oppStyleKey);
  if(!e) return 0;
  return e.a===styleKey ? e.mod : -e.mod;
}
// Verbes nuancés selon la magnitude de l'avantage (1 = léger, 2 = net, 3+ = net ascendant).
function matchupVerb(absMod, favorable){
  if(absMod>=3) return favorable ? "prend un net ascendant sur" : "pose un sérieux problème à";
  if(absMod===2) return favorable ? "possède un vrai avantage sur" : "gêne";
  return favorable ? "a un léger avantage sur" : "complique un peu la tâche de";
}
// Rapport tactique complet (mod total en points de force + lignes explicatives pour l'UI).
function matchupReport(ourFormation, ourStyle, oppFormation, oppStyle){
  const fMod = formationMatchupMod(ourFormation, oppFormation);
  const sMod = styleMatchupMod(ourStyle, oppStyle);
  const fEntry = findMatchup(FORMATION_MATCHUPS, ourFormation, oppFormation);
  const sEntry = findMatchup(STYLE_MATCHUPS, ourStyle, oppStyle);
  const lines = [];
  if(fMod>0) lines.push({sign:1, text:`✅ ${FORMATIONS[ourFormation].label} ${matchupVerb(fMod,true)} ${FORMATIONS[oppFormation].label} : ${fEntry.raison}`});
  else if(fMod<0) lines.push({sign:-1, text:`⚠️ ${FORMATIONS[oppFormation].label} ${matchupVerb(-fMod,true)} votre ${FORMATIONS[ourFormation].label} : ${fEntry.raison}`});
  else lines.push({sign:0, text:`➖ ${FORMATIONS[ourFormation].label} contre ${FORMATIONS[oppFormation].label} : duel de systèmes équilibré.`});
  if(sMod>0) lines.push({sign:1, text:`✅ Style ${STYLES[ourStyle].label} ${matchupVerb(sMod,true)} au style ${STYLES[oppStyle].label} : ${sEntry.raison}`});
  else if(sMod<0) lines.push({sign:-1, text:`⚠️ Style ${STYLES[oppStyle].label} adverse ${matchupVerb(-sMod,false)} votre ${STYLES[ourStyle].label} : ${sEntry.raison}`});
  else lines.push({sign:0, text:`➖ Styles ${STYLES[ourStyle].label} / ${STYLES[oppStyle].label} : aucun ascendant particulier.`});
  return {mod: fMod+sMod, lines};
}
// Cherche, parmi toutes les formations/styles possibles, celui qui a le plus d'avantage face à
// une formation/un style donné. Renvoie null si aucun n'a un avantage réel (mod>0) : contrairement
// à l'ancien mapping "beats", il n'y a plus de garantie qu'une contre-tactique existe toujours.
function bestFormationAgainst(oppFormationKey){
  let bestKey = null, bestMod = 0;
  for(const k of Object.keys(FORMATIONS)){
    const mod = formationMatchupMod(k, oppFormationKey);
    if(mod > bestMod){ bestMod = mod; bestKey = k; }
  }
  return bestKey;
}
function bestStyleAgainst(oppStyleKey){
  let bestKey = null, bestMod = 0;
  for(const k of Object.keys(STYLES)){
    const mod = styleMatchupMod(k, oppStyleKey);
    if(mod > bestMod){ bestMod = mod; bestKey = k; }
  }
  return bestKey;
}

function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function shuffleArr(arr){ return [...arr].sort(()=>Math.random()-0.5); }

// Niveau propre à chaque nation adverse, qui évolue d'une saison à l'autre
// (certaines équipes progressent, d'autres régressent), au lieu d'un niveau
// purement aléatoire à chaque match.
function initTeamStrengths(){
  const s = {};
  WORLD_TEAMS.forEach(t=> s[t] = rand(45, 82));
  return s;
}
function evolveTeamStrengths(){
  if(!state.teamStrengths) state.teamStrengths = initTeamStrengths();
  WORLD_TEAMS.forEach(t=>{
    if(typeof state.teamStrengths[t] !== "number") state.teamStrengths[t] = rand(45,82);
    let delta = rand(-4, 4);
    if(Math.random() < 0.18) delta += (Math.random() < 0.5 ? -7 : 7); // essor ou déclin marqué d'une génération
    const before = state.teamStrengths[t];
    state.teamStrengths[t] = clamp(before + delta, 25, 97);
    if(state.teamStrengths[t] - before >= 8){
      addNews("Monde", `📈 ${t} traverse une génération dorée et grimpe nettement au classement.`);
    } else if(before - state.teamStrengths[t] >= 8){
      addNews("Monde", `📉 ${t} traverse une passe difficile et régresse nettement.`);
    }
  });
}

function randomOpponents(n, exclude){
  exclude = exclude || [];
  const pool = WORLD_TEAMS.filter(t=>!exclude.includes(t));
  const chosen = [];
  while(chosen.length < n && pool.length){

function makePlayer(pos, opts){
  opts = opts || {};
  const isSpecial = opts.special || Math.random() < (opts.rookie ? 0.02 : 0.13);
  const isDud = !isSpecial && Math.random() < 0.18;
  let potentiel, attaque, defense;
  if(isSpecial){
    potentiel = rand(90,99);
    attaque = pos==="GB" ? rand(50,60) : rand(65,78);
    defense = pos==="GB" ? rand(75,88) : rand(55,72);
  } else if(isDud){
    potentiel = rand(35,52);
    attaque = rand(25,42);
    defense = rand(25,42);
  } else {
    potentiel = rand(55,88);
    attaque = rand(35,60);
    defense = rand(35,60);
  }
  if(pos==="GB"){ defense = Math.min(99, defense+15); attaque = Math.max(15, attaque-25); }
  if(pos==="ATT"){ attaque = Math.min(99, attaque+10); }
  if(pos==="DEF"){ defense = Math.min(99, defense+10); }
  // opts.rookie (utilisé uniquement pour l'effectif de départ, cf. makeSquad()) : le groupe
  // récupéré en prenant le poste est volontairement moins abouti, avec de la marge de
  // progression vers le potentiel plutôt que d'être déjà proche du plafond dès le 1er match.
  if(opts.rookie){
    attaque = Math.max(pos==="GB"?12:16, Math.round(attaque*0.62));
    defense = Math.max(pos==="GB"?22:16, Math.round(defense*0.62));
  }
  const isLegend = isSpecial && Math.random() < 0.22;
  return {
    id: uid(), nom: `${pick(PRENOMS)} ${pick(NOMS)}`, pos,
    attaque: Math.min(attaque, potentiel), defense: Math.min(defense, potentiel),
    potentiel, forme: rand(70,95), endurance: rand(45,85),
    special: isSpecial, legend: isLegend,
    surnom: isLegend ? pick(LEGEND_SURNOMS) : null, dud: isDud, seances:0, buts:0,
    indispo:0, cartons:{jaune:0, rouge:0}, blessuresNb:0, matchsJoues:0, motm:0, historique:[],
    favorite:false, note:"", age: opts.age || (pos==="GB" ? rand(23,30) : rand(19,29))
  };
}

// 11. Un prospect d'académie : jeune joueur brut, stats actuelles faibles mais fort potentiel, à faire progresser sur le long terme.
function generateAcademyProspect(){
  const pos = pick(POS);
  const p = makePlayer(pos, {age: rand(16,18)});
  p.potentiel = clamp(p.potentiel + rand(2,10), 55, 99);
  p.attaque = Math.max(pos==="GB"?18:14, Math.round(p.attaque * 0.42));
  p.defense = Math.max(pos==="GB"?30:14, Math.round(p.defense * 0.42));
  p.forme = rand(65,85);
  p.special = p.potentiel >= 88;
  p.dud = false;
  p.academy = true;
  return p;
}

function makeRealPlayer(def, opts){
  opts = opts || {};
  const potentiel = def.potentiel || 90;
  const isLegend = !!def.legend;
  let attaque = def.attaque, defense = def.defense;
  // opts.rookie (utilisé uniquement pour l'effectif de départ, cf. makeSquad()) : ces
  // internationaux démarrent la campagne en dessous de leur registre habituel — ils gardent
  // leur potentiel (donc leur plafond) mais doivent être entraînés pour s'en approcher, plutôt
  // que d'être déjà quasi au maximum dès le premier match.
  if(opts.rookie){
    attaque = Math.max(pos_min(def.pos), Math.round(attaque*0.55) - rand(0,5));
    defense = Math.max(pos_min(def.pos), Math.round(defense*0.55) - rand(0,5));
  }
  return {
    id: uid(), nom: def.nom, pos: def.pos,
    attaque, defense,
    potentiel, forme: rand(80,95), endurance: rand(60,90),
    special: true, legend: isLegend,
    surnom: isLegend ? (def.surnom || pick(LEGEND_SURNOMS)) : null,
    dud:false, seances:0, buts:0, real:true,
    indispo:0, cartons:{jaune:0, rouge:0}, blessuresNb:0, matchsJoues:0, motm:0, historique:[],
    favorite:false, note:"", age: def.age || rand(21,32)
  };
}
function pos_min(pos){ return pos==="GB" ? 30 : 25; }

/* ---------------- PALIERS DE RARETÉ "ÉLITE" / "ICÔNE" ----------------
   Élite (★★★) : débloqué dès la 1ère Coupe du Monde remportée. Très cher, plafond de génération
   100-110, volontairement long à faire progresser, mais dopé son plafond peut grimper à 170.
   Icône (★★★★) : palier au-dessus, débloqué à la 5e Coupe du Monde. Encore plus cher, encore
   plus long à progresser, plafond dopé à 190. */
function eliteUnlocked(){ return ((state.trophies && state.trophies.cdm) || 0) >= 1; }
function iconeUnlocked(){ return ((state.trophies && state.trophies.cdm) || 0) >= 5; }
function dopeCapFor(p){ return p.icone ? 190 : p.elite ? 170 : 140; }
function makeTierPlayer(pos, tier){
  const isIcone = tier === "icone";
  const potentiel = isIcone ? rand(112,125) : rand(100,110);
  let attaque, defense;
  if(pos==="GB"){
    attaque = rand(48,60);
    defense = isIcone ? rand(96,108) : rand(88,98);
  } else if(pos==="ATT"){
    attaque = isIcone ? rand(96,108) : rand(86,96);
    defense = rand(38,56);
  } else if(pos==="DEF"){
    attaque = rand(42,60);
    defense = isIcone ? rand(94,106) : rand(84,94);
  } else {
    attaque = isIcone ? rand(85,98) : rand(76,88);
    defense = isIcone ? rand(78,92) : rand(68,80);
  }
  attaque = Math.min(attaque, potentiel);
  defense = Math.min(defense, potentiel);
  return {
    id: uid(), nom: `${pick(PRENOMS)} ${pick(NOMS)}`, pos,
    attaque, defense, potentiel, forme: rand(75,93), endurance: rand(55,85),
    special: true, legend: false, elite: !isIcone, icone: isIcone, tier,
    surnom: null, dud: false, seances:0, buts:0,
    indispo:0, cartons:{jaune:0, rouge:0}, blessuresNb:0, matchsJoues:0, motm:0, historique:[],
    favorite:false, note:"", age: pos==="GB" ? rand(24,31) : rand(20,29)
  };
}

/* On ne met QU'UNE PARTIE des vrais joueurs dans l'effectif de départ (pas toute l'équipe de France
   au complet) pour garder un groupe crédible mais pas surpuissant. Le reste de l'effectif est généré
   aléatoirement (mélange de joueurs fictifs prometteurs et de joueurs plus faibles).
   v31 — Demande de Julien : effectif de départ avec trop de rares (♦ special). Chaque joueur réel
   injecté ici est TOUJOURS special:true (cf. makeRealPlayer ci-dessous) — les valeurs ci-dessous
   ont donc été réduites (7→5 joueurs réels injectés au total) pour limiter mécaniquement le nombre
   de rares garantis au coup d'envoi, tout en gardant un noyau de stars reconnaissables (Mbappé
   toujours inclus, cf. pickRealForPos). Voir aussi le taux réduit pour opts.rookie dans
   makePlayer() juste en dessous, qui limite le nombre de rares générés aléatoirement pour
   compléter l'effectif de départ. */
const REAL_INJECT_CAP = {GB:0, DEF:1, MIL:1, ATT:1};
function pickRealForPos(pos, cap){
  let pool = REAL_FR_PLAYERS.filter(r=>r.pos===pos);
  const chosen = [];
  if(pos==="ATT"){
    const star = pool.find(r=>r.nom==="Kylian Mbappé");
    if(star){ chosen.push(star); pool = pool.filter(r=>r!==star); }
  }
  pool = shuffleArr(pool);
  while(chosen.length < cap && pool.length) chosen.push(pool.shift());
  return chosen;
}
function makeSquad(){
  const squad = [];
  const realPool = {};
  POS.forEach(pos=> realPool[pos] = pickRealForPos(pos, REAL_INJECT_CAP[pos]||0));
  SQUAD_POOL.forEach(([pos,count])=>{
    const avail = [...(realPool[pos]||[])];
    for(let i=0;i<count;i++){
      if(avail.length){
        squad.push(makeRealPlayer(avail.shift(), {rookie:true}));
      } else {
        squad.push(makePlayer(pos, {rookie:true}));
      }
    }
  });
  return squad;
}

function computePrice(p){
  let base = Math.round((p.attaque + p.defense) / 2 * 0.9 + p.potentiel * 0.55);
  if(p.special) base += 32;
  if(p.icone) base = Math.round(base * 3.4) + 280;
  else if(p.elite) base = Math.round(base * 2.3) + 150;
  if(p.dud) base = Math.max(4, Math.round(base * 0.4));
  return Math.max(4, base);
}
function availableRealMarketPlayers(){
  const used = new Set([...state.squad.map(p=>p.nom), ...(state.market||[]).map(p=>p.nom)]);
  return REAL_FR_MARKET_POOL.filter(r=>!used.has(r.nom));
}
function generateMarket(n){
  n = n || 5;
  const list = [];
  const scoutLvl = (state.staff && state.staff.recruteur) || 0;
  const realAvail = shuffleArr(availableRealMarketPlayers());
  for(let i=0;i<n;i++){
    let p;
    if(iconeUnlocked() && Math.random() < 0.035){
      p = makeTierPlayer(pick(POS), "icone");
    } else if(eliteUnlocked() && Math.random() < 0.09){
      p = makeTierPlayer(pick(POS), "elite");
    } else if(realAvail.length && Math.random() < 0.25){
      p = makeRealPlayer(realAvail.shift());
    } else {
      const opts = {};
      if(scoutLvl>0 && Math.random() < 0.1*scoutLvl) opts.special = true;
      // v33 : bonus de rareté propre au marché (indépendant du taux de base 13% de makePlayer()
      // et du bonus recruteur ci-dessus), pour ne pas toucher aux autres usages de makePlayer()
      // (effectif de départ, club, académie...).
      if(!opts.special && Math.random() < 0.08) opts.special = true;
      p = makePlayer(pick(POS), opts);
    }
    p.price = computePrice(p);
    list.push(p);
  }
  return list;
}

let _saveTimer = null;
let _saveDirty = false;
// Quand une fiche (joueur, club, dopage...) est ouverte, elle est affichée dans un
// calque plein écran (.overlay) qui masque totalement l'onglet en dessous.
// Beaucoup d'actions dans ces fiches (entraîner, soigner, doper, protéger...)
// appellent render() alors que la fiche reste ouverte : cela reconstruisait à
// chaque clic tout le HTML de l'onglet (parfois des dizaines de cartes joueurs)
// pour rien, puisque c'est invisible derrière le calque. C'est la principale
// cause de ralentissement/à-coups en cliquant dans les fiches joueurs.
// On mémorise juste qu'un rafraîchissement est nécessaire, et on le fait une
// seule fois, quand la fiche se ferme réellement.
let pendingBgRender = false;
let dlcPanelOpen = false; // état UI (non persisté) de la bulle latérale des onglets DLC, voir renderDlcBubble()
let dlcBubbleTopPx = null; // position verticale (en px) de la bulle DLC une fois déplacée par l'utilisateur ; null = position par défaut (CSS top:50%)
async function persistNow(){
  try{ localStorage.setItem("selectionneur-save", JSON.stringify(state)); }catch(e){}
}
async function saveGame(){
  // Debounced : plusieurs appels rapprochés (clics répétés sur Entraîner, etc.)
  // ne déclenchent plus une sauvegarde réseau par clic — une seule est envoyée
  // une fois que les clics se calment, ce qui évite l'accumulation de requêtes
  // et le ralentissement/consommation mémoire observés en cliquant vite.
  _saveDirty = true;
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    _saveTimer = null;
    if(typeof requestIdleCallback === "function") requestIdleCallback(()=> flushSaveNow(), {timeout:1000});
    else flushSaveNow();
  }, 400);
}
// Écrit immédiatement, sans attendre le debounce ni requestIdleCallback : utilisé quand
// l'app quitte le premier plan (changement d'onglet, fermeture) pour ne jamais perdre
// la dernière action jouée juste avant que tout se ferme.
function flushSaveNow(){
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
  if(!_saveDirty) return;
  _saveDirty = false;
  persistNow();
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flushSaveNow(); });
window.addEventListener("pagehide", flushSaveNow);
window.addEventListener("beforeunload", flushSaveNow);

// 1. Composition automatique : remplit le onze avec les meilleurs joueurs disponibles par poste.
function autoFillLineup(){
  const slots = slotsSpec();
  const used = new Set();
  const newLineup = {};
  slots.forEach(slot=>{
    const pos = slot.split("_")[0];
    const candidates = state.squad
      .filter(p=> p.pos===pos && !used.has(p.id) && !(p.indispo>0) && !p.banned)
      .sort((a,b)=> (overall(b) + b.forme*0.15) - (overall(a) + a.forme*0.15));
    if(candidates.length){
      newLineup[slot] = candidates[0].id;
      used.add(candidates[0].id);
    }
  });
  state.lineup = newLineup;
  addNews("Tactique", "📋 Composition idéale générée automatiquement par le staff.");
  render();
}

// 5. Prime de sponsor versée en fin de saison, basée sur la popularité et les trophées (et le contrat pluriannuel en cours, voir plus bas).
function collectSponsorBonus(){
  const avgPop = state.squad.length ? Math.round(state.squad.reduce((s,p)=> s + popularite(p), 0) / state.squad.length) : 1;
  const trophyCount = Object.values(state.trophies||{}).reduce((a,b)=> a + (b||0), 0);
  let bonus = 15 + avgPop*6 + trophyCount*10;
  if(state.facilities && state.facilities.sponsoring) bonus = Math.round(bonus * 1.4);
  if(state.sponsorContract && state.sponsorContract.yearsLeft > 0){
    bonus = Math.round(bonus * state.sponsorContract.mult);
    state.sponsorContract.yearsLeft--;
    state.budget += bonus;
    addNews("Sponsor", `💼 ${state.sponsorContract.name} verse ${bonus} M€ (contrat, ${state.sponsorContract.yearsLeft} saison(s) restante(s)).`);
    if(state.sponsorContract.yearsLeft <= 0) addNews("Sponsor", `📋 Le contrat avec ${state.sponsorContract.name} arrive à échéance : une renégociation est possible depuis l'onglet Saison.`);
  } else {
    state.budget += bonus;
    addNews("Sponsor", `💼 Un sponsor ponctuel verse une prime de fin de saison de ${bonus} M€ à la fédération.`);
  }
  return bonus;
}

// 6. Objectif hebdomadaire avec récompense, résolu automatiquement après chaque match.
const WEEKLY_CHALLENGE_DEFS = [
  {key:"victoire",   label:"Remporter le prochain match",        reward:20, check:(m,status)=> status==="W"},
  {key:"invaincu",   label:"Ne pas perdre le prochain match",     reward:12, check:(m,status)=> status!=="L"},
  {key:"cleansheet", label:"Garder sa cage inviolée",             reward:18, check:(m)=> m.them===0},
  {key:"buteur",     label:"Marquer au moins 2 buts",             reward:15, check:(m)=> m.us>=2},
];
function generateWeeklyChallenge(){
  if(state.weeklyChallenge && !state.weeklyChallenge.resolved) return;
  const def = pick(WEEKLY_CHALLENGE_DEFS);
  state.weeklyChallenge = {key:def.key, label:def.label, reward:def.reward, resolved:false, success:null};
}
function resolveWeeklyChallenge(matchObj, statusBase){
  if(!state.weeklyChallenge || state.weeklyChallenge.resolved) return;
  const def = WEEKLY_CHALLENGE_DEFS.find(d=> d.key===state.weeklyChallenge.key);
  if(!def) return;
  const success = !!def.check(matchObj, statusBase);
  state.weeklyChallenge.resolved = true;
  state.weeklyChallenge.success = success;
  if(success){
    state.budget += state.weeklyChallenge.reward;
    addNews("Objectif", `✅ Objectif rempli : ${state.weeklyChallenge.label} (+${state.weeklyChallenge.reward} M€)`);
  } else {
    addNews("Objectif", `❌ Objectif manqué : ${state.weeklyChallenge.label}`);
  }
}

// 7. Export d'une feuille d'effectif lisible (.txt), en complément de la sauvegarde .json.
function exportRosterTXT(){
  try{
    const lines = [];
    lines.push(`SÉLECTION FRANCE — Feuille d'effectif (saison ${state.year})`);
    lines.push("");
    ["GB","DEF","MIL","ATT"].forEach(pos=>{
      const label = {GB:"Gardiens", DEF:"Défenseurs", MIL:"Milieux", ATT:"Attaquants"}[pos];
      const players = state.squad.filter(p=> p.pos===pos).sort((a,b)=> overall(b)-overall(a));
      if(!players.length) return;
      lines.push(`${label} :`);
      players.forEach(p=> lines.push(`  - ${p.nom}${state.captainId===p.id?" (C)":""} — Att ${p.attaque} / Déf ${p.defense} / Forme ${p.forme} / Cote ${cote(p)}`));
      lines.push("");
    });
    lines.push(`Bilan carrière : ${state.career.w}V ${state.career.d}N ${state.career.l}D`);
    const blob = new Blob([lines.join("\n")], {type:"text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    a.href = url;
    a.download = `feuille-effectif-${stamp}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }catch(e){}
}
