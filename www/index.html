GUIDE DE PRISE EN MAIN — À LIRE EN PREMIER SI VOUS REPRENEZ CE PROJET (ajouté juillet 2026)
========================================================================================
Vous êtes une IA (Claude) qui reprend ce fichier SANS RIEN CONNAÎTRE DU PROJET. Julien (le
développeur/joueur) va vous demander des fonctionnalités une par une, en langage courant, souvent
courtes et informelles. Ce guide existe pour que vous puissiez être productif tout de suite au
lieu de redécouvrir l'architecture à chaque session. Lisez-le AVANT de toucher au code.

## C'est quoi, ce fichier ?
Un mini-jeu de manager de foot ("sélectionneur de l'équipe de France" + un module "Club de ville"
séparé), en UN SEUL fichier HTML autonome : une balise "style" pour tout le CSS, une balise
"script" pour tout le JS
(vanilla, pas de framework, pas de build, pas de dépendance externe hormis les polices Google
Fonts en <link>). Ça tourne tel quel dans un navigateur (généralement testé sur mobile Android via
Chrome/l'app Claude). Pas de backend : tout l'état du jeu est en mémoire dans une variable globale
`state` (voir plus bas), persisté en local (voir saveGame()/loadGame()).

## Depuis la v42 : ce n'est plus UN seul fichier, c'est un dépôt GitHub (julienots/selectionneur)
- `www/index.html` (CE fichier) = tout le jeu (CSS + logique), comme avant.
- `www/js/stade3d.js` = moteur 3D du match en direct (three.js) : stade, foule, joueurs articulés,
  caméras TV. Il ne fait que LIRE l'objet match (`m.pos`, `m.us`, `m.minute`...) : la logique de
  match reste 100% ici. Points d'entrée côté jeu : `mountStade3D()` (fin de `buildLiveMatch`),
  `mountMatchHero()` (vue d'avant-match), `Stade3D.onGoal()` dans `flashResult()`.
- `www/vendor/three.min.js`, `www/fonts/` : copiés depuis node_modules par `npm run vendor`.
- `android/` + `capacitor.config.json` : appli Android (Capacitor). L'APK est compilé par GitHub
  Actions (`.github/workflows/android.yml`) à chaque push et publié dans les Releases du dépôt.
- `npm run check` = vérification de syntaxe (remplace l'extraction manuelle + `node --check`).
- `npm run standalone` = régénère `dist/selectionneur_vNN.html`, l'ancien format "un seul fichier"
  (three.js, module 3D et polices intégrés dedans) si Julien veut encore un HTML autonome.
- Livraison : on ne renomme plus le fichier à chaque version ; on incrémente `version` dans
  package.json, `versionCode`/`versionName` dans android/app/build.gradle et `CACHE_NAME` dans
  www/sw.js, puis commit + push (le workflow fabrique l'APK).

## Comment travailler dessus efficacement
- Le fichier fait plusieurs milliers de lignes. NE PAS le lire en entier d'un coup : `grep -n` pour
  localiser les fonctions/mots-clés pertinents à la demande, puis `view` avec un `view_range` ciblé.
- Après CHAQUE modification, vérifiez la syntaxe JS avant de livrer : extrayez le contenu de la
  balise script (tout le JS est dans une seule balise, en plein milieu du fichier) dans un fichier
  .js à part, puis lancez `node --check` dessus. Attention si vous écrivez vous-même ce script
  d'extraction : ne mettez jamais les balises script littérales dans un commentaire ou une chaîne
  de ce fichier HTML (comme ce guide le fait exprès d'éviter juste ici) — une regex naïve qui
  cherche "la balise script ouvrante" jusqu'à "la balise script fermante" s'arrêterait alors sur la
  MAUVAISE occurrence. C'est rapide et ça attrape la quasi-totalité des erreurs bêtes (accolade
  oubliée, virgule en trop) avant que Julien ne les découvre en jouant.
- Julien parle un français informel, parfois avec des fautes/tournures ambiguës ("sa" pour "ça",
  phrases elliptiques). Si une demande est vraiment ambiguë sur le COMPORTEMENT voulu, mieux vaut
  choisir l'interprétation la plus cohérente avec l'existant et l'expliquer brièvement dans la
  réponse plutôt que de multiplier les questions — mais n'hésitez pas à poser UNE question ciblée
  si deux interprétations mèneraient à des features vraiment différentes.
- Julien envoie souvent des captures d'écran de conversations précédentes (avec un autre modèle,
  ou une session interrompue par une limite d'usage) pour donner du contexte sur une demande en
  cours. Si un fichier fourni ne contient PAS encore ce que la capture décrit comme "en train
  d'être fait", c'est probablement que la session précédente a été coupée avant la fin (ex :
  message "Limit reached" visible sur la capture) — vérifiez toujours l'état RÉEL du fichier
  fourni plutôt que de supposer que la feature décrite dans la capture existe déjà.
- Continuez la convention de changelog ci-dessous (un unique bloc de commentaire HTML en tête de
  fichier) :
  chaque nouvelle demande de Julien devient une entrée "vNN — Demande de Julien : ... [FAIT] :"
  qui résume CE QUI A CHANGÉ et OÙ (noms de fonctions/variables), pas juste "j'ai fait X". Une
  future IA (vous, dans 6 mois) doit pouvoir lire une entrée et savoir exactement quoi grep sans
  relire tout le diff. Ajoutez aussi une ligne "ATTENTION si vous reprenez ce chantier :" quand
  votre changement laisse une limitation ou un piège pour la suite (ça arrive souvent).
- Livrez toujours un fichier complet renommé en incrémentant la version (ex: selectionneur_v29.html
  si vous receviez v28.html), jamais un diff ou un patch à appliquer à la main.

## Architecture générale
- `let state = {...}` (vers la ligne 1231) : LA source de vérité pour la sélection nationale
  (squad, lineup, tactique, calendar, budget, staff, hallOfFame, transferArchive, youthAcademy,
  achievements, teamStats, career, h2h, etc.). `state.club = {...}` est une sous-structure
  largement parallèle mais INDÉPENDANTE pour le module "Club de ville" (squad/lineup/tactique/
  market/budget/calendar propres, cf. v15/v16 dans l'historique plus bas) — ATTENTION : les deux
  effectifs (state.squad vs state.club.squad) ne se mélangent JAMAIS, ce sont deux pools de
  joueurs différents avec des IDs différents.
- `render()` (vers la ligne 2813) est LE point d'entrée de rendu : il reconstruit toute la barre
  du haut + la tabbar, PUIS délègue le contenu de l'onglet actif (`state.tab`) à une fonction
  `renderXxx(screen)` dédiée (renderEffectif, renderMatchTab, renderMarche, renderClassement,
  renderClub, renderMonde, renderActu). Chaque `renderXxx` réécrit `el.innerHTML` en entier puis
  rebranche ses propres `onclick`/`oninput` (pas de framework réactif, tout est du template string
  + réécriture complète à chaque appel de render()).
- Les écrans secondaires (fiche joueur, dopage, scouting, records...) sont des "sheets" : un
  `<div class="overlay">` injecté dans `document.body` par des fonctions `openXxxSheet()`/
  `showXxx()`, fermées par `closeSheet()`. IMPORTANT : si une sheet est ouverte, `render()` NE
  RECONSTRUIT PAS l'écran en dessous (il pose juste `pendingBgRender=true` et sauvegarde) — le
  vrai rendu de fond est différé à la fermeture de la sheet. Gardez ce pattern pour toute nouvelle
  sheet plutôt que d'appeler render() en boucle pendant qu'une sheet est ouverte.
- Le moteur de match live (`startMatch`/`startClubLiveMatch` → `tickMatch` → `playSequence`/
  `playFoul`/`playInjury`/`playMidfield`) est PARTAGÉ entre sélection et club via un flag
  `matchObj.ctx === "club" | undefined` et un helper `ctxPlayerById(m,id)` qui résout sur
  `state.club.squad` ou `state.squad` selon ce flag. `tickMatch` avance `matchObj.minute` par pas
  de 5 avec un `setTimeout` récursif (rythme visuel du match) et gère mi-temps/prolongation/fin de
  match. Si vous ajoutez un nouveau type d'événement de match, suivez le pattern `pushEntry(m,
  {min, goal, text})` (qui alimente à la fois le log ET l'affichage live si l'écran est actif) et
  `await delay(ms)` pour cadencer visuellement (voir `function delay(ms)`).
- Persistance : `saveGame()`/`loadGame()` (stockage local du `state` complet en JSON). Toute
  nouvelle clé ajoutée à `state` (ou `state.club`) doit être initialisée à TROIS endroits pour ne
  rien casser : (1) l'objet `state = {...}` par défaut au tout début du fichier, (2) le bloc de
  migration dans `loadGame()` (des `if(typeof state.xxx !== ...) state.xxx = ...` pour les
  sauvegardes existantes qui n'ont pas encore ce champ), (3) la factory de reset complet
  ("Nouvelle Ère" / bouton reset, cherchez `hallOfFame:[]` ou `teamStats:{golMarques:0`). Oublier
  l'un des trois est le bug le plus fréquent et le plus sournois de ce projet (ça marche en
  partie via un `||` de secours mais peut planter ailleurs sur un `undefined`).
- Rareté des joueurs : normal → `special` (rare) → `elite` (★★★, débloqué à 1 CDM) → `icone`
  (★★★★, débloqué à 5 CDM). Helpers à réutiliser plutôt que dupliquer un ternaire : `tierStars(p)`,
  `tierAuraClass(p)`, `tierMiniBadge(p)`, `dopeCapFor(p)`.
- Tout le texte visible est en FRANÇAIS (variables/fonctions en franglais technique, mais tout
  libellé UI, message, commentaire de code est en français). Gardez ce standard.

## Pièges connus / limitations actuelles (pour éviter de re-découvrir ces bugs)
- `state.club` n'a PAS de système de vieillissement des joueurs (contrairement à `state.squad`,
  cf. `ageSquadAndRetire()`/`checkYearlyAgingTick()`) : les joueurs du club ne prennent jamais
  l'âge et ne partent jamais à la retraite. Non demandé à ce jour, mais à garder en tête si Julien
  s'en étonne un jour.
- Beaucoup de logique est dupliquée entre sélection et club plutôt que factorisée (entraînement :
  `trainPlayer`/`trainPlayerSilent` vs `trainClubPlayer`/`trainClubPlayerSheet` ; dopage :
  `executeDoping` vs `executeClubDoping` ; etc.). Une demande touchant l'un des deux côtés a
  PRESQUE TOUJOURS un équivalent quasi identique de l'autre côté à corriger aussi — vérifiez
  systématiquement avec `grep` avant de considérer une fonctionnalité "terminée".
- Les numéros de ligne cités dans l'historique ci-dessous bougent à chaque édition : ne vous y
  fiez jamais, ils ne sont indicatifs qu'au moment où ils ont été écrits. Cherchez toujours par nom
  de fonction/variable.

v25 — Retour de Julien : la logique v24 imposait un cycle strict "pierre-papier-ciseaux" (chaque
formation/style bat exactement l'autre et perd exactement contre un 3e) ; il voulait que ça
"aide" sans être une règle rigide obligatoire. [FAIT] :
- FORMATION_COUNTERS/STYLE_COUNTERS (mapping "beats" à sens unique, bonus fixe ±5/±4) remplacés
  par FORMATION_MATCHUPS/STYLE_MATCHUPS : liste de duels {a,b,mod,raison} avec un avantage gradué
  (magnitude 1 à 3 selon la pertinence du duel) et pas de couverture systématique de toutes les
  paires (ex : possession vs offensif reste neutre, aucun ascendant). formationMatchupMod()/
  styleMatchupMod() cherchent la paire dans un sens ou l'autre et renvoient le mod signé (0 si
  aucune entrée = duel équilibré).
- matchupReport() nuance désormais le texte affiché selon la magnitude du mod (léger avantage /
  avantage net / net ascendant) plutôt qu'un seul et même verbe "prend l'ascendant" quel que soit
  l'écart.
- suggestBestTactics() : la contre-tactique ne fait plus un lookup direct dans un mapping "beats"
  (qui garantissait toujours une réponse) ; bestFormationAgainst()/bestStyleAgainst() testent
  toutes les formations/styles contre celui de l'adversaire attendu et ne proposent une
  contre-tactique que si un vrai avantage existe (mod>0), sinon aucun bouton "contre-tactique"
  n'est affiché (ce qui peut désormais arriver, contrairement à v24).

v28 — Demande de Julien : ça lag dans l'onglet Effectif. [FAIT] :
- Cause identifiée : les cartes joueur "spéciales/légende/élite/icône" (classes aura-*) animaient
  en continu leur box-shadow (0%→50%→100%, infinite) tant que l'écran Effectif restait affiché.
  Animer un box-shadow flouté force un repaint de la carte à CHAQUE frame, multiplié par le nombre
  de cartes avec aura visibles à l'écran — c'est le classique tueur de perf mobile, d'autant plus
  visible que l'effectif contient des joueurs real/special/elite/icône (assez fréquent).
- Remplacé par : box-shadow statique (posé une seule fois, plus de recalcul par frame) + un
  pseudo-élément ::after en position absolute avec sa propre box-shadow statique, dont seule
  l'opacité pulse (0→1→0, @keyframes auraPulse unique et partagée par les 4 paliers, seule la durée
  change). Animer l'opacité (+ will-change:opacity) est traité par le compositeur GPU et ne
  déclenche plus de repaint répété — rendu visuel identique, coût quasi nul même avec beaucoup de
  cartes à l'écran.

  envoie des actions via s3dAction(m,{kind,...}) -> Stade3D.onAction ; elles sont jouées dans
  l'ordre par stepAction() : gain / intercept (course au ballon, tacle au contact), pass (le passeur
  va au ballon, arme, le ballon part de son pied vers le POINT DE RENCONTRE atteignable par le
  receveur, qui le contrôle), dribble (crochet, passement, petit pont, roulette : défenseur qui sort,
  feinte, ballon emmené sur le côté, défenseur déséquilibré), shot (élan, frappe, issue réelle : filet,

  Conduite de balle : touches synchronisées avec la course (BS.ahead/BS.bs), pied alterné. Le
  porteur avance avec le ballon, le défenseur le plus proche vient presser (syncTargets).
  La célébration démarre quand le ballon touche le filet (pendingGoal). Si la file d'actions

  calculée sur la distance réelle et la vitesse de la passe (même table PASS_SPEED qu'en 3D).

.bar-label{width:78px; font-size:12px; color:var(--chalk); font-family:'Barlow Condensed'; text-transform:uppercase; letter-spacing:.06em;}
.bar-track{flex:1; height:8px; background:rgba(255,255,255,0.08); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,#2f7a4f,#5fb87a); box-shadow:0 0 6px rgba(95,184,122,0.35);}
.bar-fill.def{background:linear-gradient(90deg,#25507e,#4c86c4); box-shadow:0 0 6px rgba(76,134,196,0.35);}
.bar-fill.form{background:linear-gradient(90deg,#a68a1f,var(--gold)); box-shadow:0 0 6px rgba(212,175,55,0.4);}
.bar-val{width:26px; text-align:right; font-family:'Barlow Condensed'; font-weight:700; font-size:13px;}
.potential-note{font-size:12px; color:var(--chalk); opacity:.75; margin-top:10px; line-height:1.4;}
.btn{border:none; border-radius:11px; padding:12px 16px; font-weight:700; font-size:15px;
  font-family:'Barlow Condensed'; letter-spacing:.03em; cursor:pointer; text-transform:uppercase;
  transition:transform .1s, box-shadow .15s, filter .15s;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:linear-gradient(135deg,#e8c65a,var(--gold)); color:#221a00; width:100%; margin-top:14px;
  box-shadow:0 3px 12px rgba(212,175,55,0.3);}
.btn-primary:active:not(:disabled){filter:brightness(0.96);}
.btn-primary:disabled{background:#4a4a4a; color:#999; box-shadow:none;}
.btn-ghost{background:rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--white); width:100%; margin-top:8px;}
.btn-ghost:active{background:rgba(255,255,255,0.08);}
.train-msg{margin-top:10px; font-size:13px; padding:9px 10px; border-radius:8px; background:rgba(255,255,255,0.06); border:1px solid var(--line);}

/* Match setup */
.formation-note{font-size:13px; color:var(--chalk); margin-bottom:12px;}
.slot-group{margin-bottom:14px;}
.slot-group h3{font-size:15px; margin:0 0 8px; font-family:'Barlow Condensed'; text-transform:uppercase; letter-spacing:.06em; color:var(--gold);}
.slot-list{display:flex; flex-direction:column; gap:6px;}
.slot-pick{display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.04);
  border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; cursor:pointer;}
.slot-pick.filled{border-color:rgba(95,184,122,0.5);}
.slot-pick .chevron{color:var(--chalk); font-size:13px; flex-shrink:0; margin-left:8px;}
.picker-list{max-height:50vh; overflow-y:auto; margin-top:6px;}

/* Tactique */
.tactic-bar{display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  background:linear-gradient(90deg, rgba(212,175,55,0.14), rgba(255,255,255,0.03));
  border:1px solid rgba(212,175,55,0.4); border-radius:12px; padding:10px 12px; margin-bottom:12px;}
.tactic-label{font-family:'Barlow Condensed'; text-transform:uppercase; font-size:11px; color:var(--gold); letter-spacing:.06em;}
.tactic-value{font-size:14px; font-weight:600; margin-top:2px;}

/* Live match */
.pitch-wrap{background:var(--pitch); border-radius:16px; position:relative; overflow:hidden;
  height:280px; margin-bottom:14px; border:2px solid rgba(255,255,255,0.15);
  background-image:repeating-linear-gradient(90deg, var(--pitch) 0 10%, var(--pitch-dark) 10% 20%);}
.pitch-wrap::before{content:''; position:absolute; left:50%; top:0; bottom:0; width:1px; background:rgba(255,255,255,0.25);}
.pitch-wrap::after{content:''; position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;
  border:1px solid rgba(255,255,255,0.3); border-radius:50%;}
.goal-l,.goal-r{position:absolute; top:36%; width:6px; height:28%; background:rgba(255,255,255,0.4); border-radius:2px; z-index:2;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.5) 0 3px, transparent 3px 6px);}
.goal-l{left:0;} .goal-r{right:0;}
.ball-shadow{position:absolute; width:13px; height:5px; border-radius:50%; background:rgba(0,0,0,0.45); filter:blur(1px);
  top:50%; left:50%; transform:translate(-50%,4px); transition:left .48s cubic-bezier(.3,.68,.4,1), top .48s cubic-bezier(.3,.68,.4,1); z-index:4;}
.ball{position:absolute; width:12px; height:12px; border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #fff, #dcdcdc 55%, #b8b8b8);
  background-size:100% 100%, 6px 6px; box-shadow:0 0 6px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.15);
  top:50%; left:50%; transform:translate(-50%,-50%); transition:left .48s cubic-bezier(.3,.68,.4,1), top .48s cubic-bezier(.3,.68,.4,1);
  z-index:5; animation:ballRoll .55s linear infinite;}
@keyframes ballRoll{0%{filter:brightness(1);} 50%{filter:brightness(1.18);} 100%{filter:brightness(1);}}
.dot{position:absolute; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Barlow Condensed'; font-weight:700; font-size:9px; color:#fff;
  transform:translate(-50%,-50%); transition:left .48s cubic-bezier(.3,.68,.4,1), top .48s cubic-bezier(.3,.68,.4,1), box-shadow .3s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.45), 0 7px 3px -2px rgba(0,0,0,.35); z-index:3;}
.dot span{display:inline-block; animation:dotBob 1.1s ease-in-out infinite;}
@keyframes dotBob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-1.5px);}}
.dot-us{background:#1f4fa3; border:2px solid #fff;}
.dot-us.gk{background:#8a6a12; border-color:var(--gold);}
.dot-them{background:var(--red); border:2px solid #ffd9d9;}
.dot-them.gk{background:#6b0d16; border-color:#ffb3b3;}
.dot.has-ball{box-shadow:0 0 0 3px rgba(212,175,55,0.65), 0 1px 3px rgba(0,0,0,.45), 0 7px 3px -2px rgba(0,0,0,.35);
  animation:hasBallPulse 1s ease-in-out infinite;}
@keyframes hasBallPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(212,175,55,0.55), 0 1px 3px rgba(0,0,0,.45), 0 7px 3px -2px rgba(0,0,0,.35);}
  50%{box-shadow:0 0 0 4px rgba(212,175,55,0.85), 0 1px 3px rgba(0,0,0,.45), 0 7px 3px -2px rgba(0,0,0,.35);}
}
.dot.scored{animation:pulseScore .8s ease;}
@keyframes pulseScore{
  0%{transform:translate(-50%,-50%) scale(1);}
  40%{transform:translate(-50%,-50%) scale(2); box-shadow:0 0 14px 5px var(--gold);}
  100%{transform:translate(-50%,-50%) scale(1);}
}
.goal-flash{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue'; font-size:44px; color:var(--gold); text-shadow:0 2px 10px rgba(0,0,0,.7);
  opacity:0; pointer-events:none; transition:opacity .25s ease; letter-spacing:.08em; z-index:10;}
.goal-flash.show{opacity:1;}
.scoreboard{display:flex; align-items:center; justify-content:space-between; background:#000;
  border-radius:12px; padding:12px 16px; margin-bottom:12px; border:1px solid var(--line);}
.sb-team{font-family:'Barlow Condensed'; font-weight:700; font-size:14px; text-transform:uppercase; flex:1;}
.sb-score{font-family:'Bebas Neue'; font-size:34px; letter-spacing:.05em; padding:0 10px;}
.commentary{background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  height:150px; overflow-y:auto; font-size:13px; line-height:1.6; display:flex; flex-direction:column;}
.commentary .ev{padding:3px 0; border-bottom:1px dashed rgba(255,255,255,0.06);}
.commentary .ev.goal{color:var(--gold); font-weight:700;}
.commentary .ev .min{color:var(--chalk); margin-right:6px; font-family:'Barlow Condensed';}

/* Standings */
.standing-row{display:flex; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13px; flex-wrap:wrap;}
.standing-row .opp{flex:1; min-width:100px;}
.standing-row.fr-row{background:rgba(212,175,55,0.08); border-radius:8px;}
.tag{font-family:'Barlow Condensed'; font-weight:700; font-size:11px; padding:3px 8px; border-radius:20px; text-transform:uppercase; white-space:nowrap;}
.tag.W{background:rgba(95,184,122,0.2); color:#8fe0a5;}
.tag.D{background:rgba(212,175,55,0.2); color:var(--gold);}
.tag.L{background:rgba(193,18,31,0.2); color:#f19aa0;}
.tag.pending{background:rgba(255,255,255,0.08); color:var(--chalk);}
.tag.type-amical{background:rgba(255,255,255,0.08); color:var(--chalk);}
.tag.type-nations{background:rgba(95,184,122,0.2); color:#8fe0a5;}
.tag.type-qualif{background:rgba(37,80,126,0.35); color:#9cc4ee;}
.tag.type-cdm{background:rgba(212,175,55,0.22); color:var(--gold);}
.tag.type-fs{background:linear-gradient(90deg, rgba(212,175,55,0.35), rgba(193,18,31,0.28), rgba(76,134,196,0.3)); background-size:200% auto;
  color:#fff2c4; animation:fsTagShine 3s linear infinite; text-shadow:0 0 6px rgba(0,0,0,.4);}
@keyframes fsTagShine{0%{background-position:0% center;} 100%{background-position:200% center;}}
.tag.type-fifat{background:linear-gradient(90deg, rgba(193,18,31,0.4), rgba(212,175,55,0.4), rgba(165,87,224,0.35)); background-size:220% auto;
  color:#fff2c4; animation:fifatTagShine 2.6s linear infinite; text-shadow:0 0 6px rgba(0,0,0,.4);}
@keyframes fifatTagShine{0%{background-position:0% center;} 100%{background-position:220% center;}}
.stat-strip{display:flex; gap:8px; margin:14px 0;}
.stat-box{flex:1; background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:12px;
  text-align:center; padding:12px 4px;}
.stat-box .num{font-family:'Bebas Neue'; font-size:24px; color:var(--gold);}
.stat-box .lab{font-size:11px; color:var(--chalk); text-transform:uppercase; font-family:'Barlow Condensed';}
.stat-box-clickable{cursor:pointer; transition:background .15s, border-color .15s;}
.stat-box-clickable:active{background:rgba(212,175,55,0.12); border-color:rgba(212,175,55,0.5);}

/* Notice banner */
.notice-banner{background:linear-gradient(90deg, rgba(212,175,55,0.22), rgba(255,255,255,0.03));
  border:1px solid rgba(212,175,55,0.5); border-radius:12px; padding:10px 12px; font-size:13px;
  margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px;}

/* Scout event */
.scout-card{background:linear-gradient(160deg, rgba(212,175,55,0.16), rgba(255,255,255,0.02));
  border:1px solid rgba(212,175,55,0.5); border-radius:14px; padding:16px; text-align:center; margin-bottom:16px;}

/* Bottom nav */
.tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:rgba(11,18,38,0.95); backdrop-filter:blur(10px); border-top:1px solid rgba(212,175,55,0.18);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); gap:2px; box-shadow:0 -6px 18px rgba(0,0,0,0.3);}
.tab-btn{flex:1; background:none; border:none; color:var(--chalk); display:flex; flex-direction:column;
  align-items:center; gap:2px; padding:7px 0; font-family:'Barlow Condensed'; font-size:10px; text-transform:uppercase;
  letter-spacing:.03em; border-radius:12px; transition:background .15s, color .15s;}
.tab-btn.active{color:var(--gold); background:rgba(212,175,55,0.14); box-shadow:inset 0 0 0 1px rgba(212,175,55,0.25);}
.tab-btn .ic{font-size:18px;}
.empty-note{text-align:center; color:var(--chalk); font-size:13px; padding:30px 10px; opacity:.8;}

/* Bulle latérale des onglets DLC (v40, revue v41 : plus petite, déplaçable, moins intrusive) */
.dlc-bubble-wrap{position:fixed; top:50%; transform:translateY(-50%);
  right:max(0px, calc((100vw - 480px)/2 + 4px)); z-index:45;
  display:flex; align-items:stretch; max-width:calc(100vw - 10px);}
.dlc-bubble-btn{flex:0 0 auto; width:38px; height:38px; border-radius:50% 0 0 50%; border:none;
  background:linear-gradient(135deg,#e8c65a,var(--gold)); color:#221a00; font-size:16px;
  box-shadow:-2px 2px 10px rgba(0,0,0,0.4); cursor:grab; position:relative; opacity:.78;
  touch-action:none; user-select:none; transition:opacity .15s ease;
  display:flex; align-items:center; justify-content:center;}
.dlc-bubble-btn:active{opacity:1; cursor:grabbing;}
.dlc-bubble-badge{position:absolute; top:-4px; left:-4px; width:15px; height:15px; border-radius:50%;
  background:var(--red); color:#fff; font-size:9px; font-weight:700; font-family:'Barlow Condensed';
  display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--night);}
.dlc-panel{width:0; opacity:0; overflow:hidden; white-space:nowrap;
  background:rgba(11,18,38,0.97); backdrop-filter:blur(10px);
  border:1px solid rgba(212,175,55,0.28); border-right:none; border-radius:14px 0 0 14px;
  transition:width .28s cubic-bezier(.3,.7,.3,1), opacity .2s ease, padding .28s ease;
  max-height:50vh; overflow-y:auto;}
.dlc-panel.open{width:180px; opacity:1; padding:8px 0;}
.dlc-panel-title{font-family:'Barlow Condensed'; text-transform:uppercase; font-size:10px;
  color:var(--gold); letter-spacing:.06em; padding:2px 12px 6px;}
.dlc-panel-item{display:flex; align-items:center; gap:7px; width:100%; background:none; border:none;
  color:var(--chalk); padding:9px 12px; font-size:12px; text-align:left; cursor:pointer;
  white-space:nowrap;}
.dlc-panel-item .ic{font-size:15px;}
.dlc-panel-item.active{color:var(--gold); background:rgba(212,175,55,0.14);}
.dlc-panel-item:active{background:rgba(212,175,55,0.2);}
.dlc-panel-item.disabled{opacity:.45; cursor:default;}
.dlc-panel-note{margin-left:auto; font-size:9px; opacity:.8; white-space:nowrap;}

/* Capitaine */
.armband{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%;
  background:var(--gold); color:#221a00; font-size:9px; font-weight:700; font-family:'Barlow Condensed'; margin-left:2px;}
.btn-captain{background:rgba(212,175,55,0.16); border:1px solid rgba(212,175,55,0.5); color:var(--gold);
  width:100%; margin-top:8px; border-radius:10px; padding:12px 16px; font-weight:700; font-size:14px;
  font-family:'Barlow Condensed'; letter-spacing:.03em; cursor:pointer; text-transform:uppercase;}

/* Actu / news feed */
.news-item{background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; margin-bottom:8px;}
.news-tag{font-family:'Barlow Condensed'; font-weight:700; font-size:10px; text-transform:uppercase;
  letter-spacing:.08em; color:var(--gold); display:block; margin-bottom:3px;}
.news-title{font-size:14px; line-height:1.4;}
.news-time{font-size:11px; color:var(--chalk); opacity:.7; margin-top:4px; display:block;}

/* Amical rapide */
.friendly-box{background:rgba(255,255,255,0.03); border:1px dashed var(--line); border-radius:12px;
  padding:12px; margin:14px 0; text-align:center;}
.friendly-box p{font-size:12px; color:var(--chalk); margin:0 0 8px;}

/* Célébration de but */
.pitch-wrap.shake{animation:shake .5s ease;}
@keyframes shake{
  0%,100%{transform:translateX(0);} 20%{transform:translateX(-4px);} 40%{transform:translateX(4px);}
  60%{transform:translateX(-3px);} 80%{transform:translateX(3px);}
}
.confetti{position:absolute; width:6px; height:6px; top:50%; left:50%; border-radius:1px; opacity:0;
  z-index:9; pointer-events:none;}
.confetti.burst{animation:confetti-burst .9s ease-out forwards;}
@keyframes confetti-burst{
  0%{opacity:1; transform:translate(-50%,-50%) translate(0,0) rotate(0deg);}
  100%{opacity:0; transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--rot));}
}
.goal-flash.show{animation:flashPulse .9s ease;}
@keyframes flashPulse{
  0%{opacity:0; transform:scale(.7);} 25%{opacity:1; transform:scale(1.12);}
  45%{transform:scale(1);} 80%{opacity:1;} 100%{opacity:0;}
}

/* Toast de succès */
.toast-wrap{position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  width:calc(100% - 32px); max-width:448px; z-index:80; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
.ach-toast{background:linear-gradient(90deg, rgba(212,175,55,0.95), rgba(180,140,20,0.95)); color:#221a00;
  border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:10px; box-shadow:0 6px 18px rgba(0,0,0,.4);
  opacity:0; transform:translateY(-14px); transition:opacity .3s ease, transform .3s ease;}
.ach-toast.show{opacity:1; transform:translateY(0);}
.ach-toast .ic{font-size:22px;}
.ach-toast .txt{line-height:1.25;}
.ach-toast .lab{font-family:'Barlow Condensed'; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.06em; opacity:.75;}
.ach-toast .nm{font-size:14px; font-weight:700;}

/* Terrain en relief léger (uniquement en match) */
.pitch-wrap{transform-style:preserve-3d; perspective:900px;}
.pitch-wrap .pitch-tilt{position:absolute; inset:0; transform:rotateX(8deg) scale(1.02); transform-origin:50% 60%;
  background-image:repeating-linear-gradient(90deg, var(--pitch) 0 10%, var(--pitch-dark) 10% 20%);
  box-shadow:inset 0 30px 40px -20px rgba(0,0,0,0.55), inset 0 -14px 26px -10px rgba(0,0,0,0.5);}
.pitch-wrap .floodlight{position:absolute; top:-6px; width:10px; height:16px; background:linear-gradient(180deg,#fff,#d4af37);
  border-radius:2px 2px 0 0; box-shadow:0 0 14px 4px rgba(255,241,181,0.55); z-index:1; animation:floodFlicker 4s ease-in-out infinite;}
@keyframes floodFlicker{0%,100%{box-shadow:0 0 14px 4px rgba(255,241,181,0.55);} 50%{box-shadow:0 0 18px 6px rgba(255,241,181,0.75);}}
.pitch-wrap .floodlight.l{left:6px;} .pitch-wrap .floodlight.r{right:6px;}
.pitch-wrap .stand{position:absolute; left:0; right:0; height:14px; top:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0 4px, rgba(0,0,0,0.15) 4px 8px);
  background-size:220% 100%; z-index:1; opacity:.7; animation:standWave 6s linear infinite;}
@keyframes standWave{0%{background-position:0 0;} 100%{background-position:-120% 0;}}
.pitch-wrap .crowd-glow{position:absolute; inset:0; pointer-events:none; z-index:1;
  box-shadow:inset 0 0 40px 8px rgba(0,0,0,0.35);}
.weather-fx{position:absolute; inset:0; pointer-events:none; z-index:4; overflow:hidden;}
.weather-fx .drop{position:absolute; top:-10%; width:2px; height:14px; background:rgba(210,230,255,0.55);
  animation:rainfall linear infinite;}
@keyframes rainfall{0%{transform:translateY(0);} 100%{transform:translateY(320px);}}
.weather-fx.wind::before{content:''; position:absolute; inset:0; background:repeating-linear-gradient(100deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 40px); animation:windmove 2.4s linear infinite;}
@keyframes windmove{0%{transform:translateX(0);} 100%{transform:translateX(60px);}}
.weather-fx.canicule{background:radial-gradient(ellipse at 50% 30%, rgba(255,150,40,0.14), transparent 70%);}
.weather-fx.froid{background:radial-gradient(ellipse at 50% 20%, rgba(150,210,255,0.14), transparent 70%);}
.crowd-meter{margin:0 0 10px; background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:10px; padding:6px 10px;}
.crowd-meter .lab{font-family:'Barlow Condensed'; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--chalk); display:flex; justify-content:space-between;}
.crowd-track{height:5px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; margin-top:4px;}
.crowd-fill{height:100%; background:linear-gradient(90deg,#8a6a12,var(--gold)); transition:width .5s ease;}

/* Mi-temps */
.talk-option{background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:12px;
  padding:12px; margin-bottom:8px; cursor:pointer;}
.talk-option:active{background:rgba(255,255,255,0.09);}
.talk-option h4{margin:0 0 4px; font-size:14px; font-family:'Barlow Condensed'; text-transform:uppercase;
  letter-spacing:.04em; color:var(--gold);}
.talk-option p{margin:0; font-size:12px; color:var(--chalk); line-height:1.4;}

/* Interview */
.interview-q{font-size:12px; color:var(--chalk); text-transform:uppercase; letter-spacing:.05em;
  font-family:'Barlow Condensed'; margin:14px 0 4px;}
.interview-a{background:rgba(255,255,255,0.04); border-left:3px solid var(--gold); border-radius:0 10px 10px 0;
  padding:10px 12px; font-size:14px; line-height:1.5; font-style:italic;}

/* Sous-navigation marché */
.subnav{display:flex; gap:6px; margin:12px 0;}
.subnav-btn{flex:1; background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--chalk);
  border-radius:10px; padding:9px 6px; font-family:'Barlow Condensed'; font-weight:700; font-size:12px;
  text-transform:uppercase; letter-spacing:.04em; cursor:pointer; transition:background .15s, color .15s, border-color .15s;}
.subnav-btn.active{background:linear-gradient(135deg, rgba(212,175,55,0.24), rgba(212,175,55,0.1)); border-color:rgba(212,175,55,0.65); color:var(--gold);
  box-shadow:0 2px 8px rgba(212,175,55,0.15);}

/* Filtres marché */
.filter-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.filter-chip{background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--chalk);
  border-radius:20px; padding:6px 12px; font-family:'Barlow Condensed'; font-weight:700; font-size:11px;
  text-transform:uppercase; letter-spacing:.04em; cursor:pointer;}
.filter-chip.active{background:rgba(212,175,55,0.2); border-color:rgba(212,175,55,0.6); color:var(--gold);}
.filter-chip.sort-chip{margin-left:auto;}

/* Staff technique */
.staff-card{background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:14px;
  padding:12px; margin-bottom:10px;}
.staff-head{display:flex; align-items:flex-start; gap:10px;}
.staff-ic{font-size:22px; line-height:1;}
.staff-name{font-weight:700; font-size:14px;}
.staff-lvl{font-family:'Barlow Condensed'; font-size:11px; color:var(--gold); margin-left:4px;}
.staff-desc{font-size:12px; color:var(--chalk); opacity:.85; margin-top:2px; line-height:1.4;}

/* Soin / repos / tendance */
.btn-soin{background:rgba(76,134,196,0.16); border:1px solid rgba(76,134,196,0.5); color:#9cc4ee;
  width:100%; margin-top:8px; border-radius:10px; padding:12px 16px; font-weight:700; font-size:14px;
  font-family:'Barlow Condensed'; letter-spacing:.03em; cursor:pointer; text-transform:uppercase;}
.trend{font-size:11px; margin-left:4px;}
.trend.up{color:#8fe0a5;} .trend.down{color:#f19aa0;} .trend.flat{color:var(--chalk);}

/* Remplacements */
.sub-row{display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.04);
  border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:6px; font-size:13px;}
.sub-row .out{color:#f19aa0; font-size:11px;}
.subs-counter{font-family:'Barlow Condensed'; font-size:12px; color:var(--chalk); text-align:center; margin-top:8px;}

/* Recherche / actions effectif */
.search-input{width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; color:var(--white); font-size:14px; font-family:'Barlow'; margin-bottom:10px;}
.search-input::placeholder{color:var(--chalk); opacity:.7;}
.effectif-actions{display:flex; gap:8px; margin-bottom:10px;}
.effectif-actions button{flex:1; margin:0;}
.btn-sell{background:rgba(193,18,31,0.14); border:1px solid rgba(193,18,31,0.45); color:#f19aa0;
  border-radius:10px; padding:12px 16px; font-weight:700; font-size:14px; font-family:'Barlow Condensed';
  letter-spacing:.03em; cursor:pointer; text-transform:uppercase; width:100%; margin-top:8px;}
.btn-compare{background:rgba(95,184,122,0.14); border:1px solid rgba(95,184,122,0.45); color:#8fe0a5;
  border-radius:10px; padding:12px 16px; font-weight:700; font-size:14px; font-family:'Barlow Condensed';
  letter-spacing:.03em; cursor:pointer; text-transform:uppercase; width:100%; margin-top:8px;}
.compare-row{display:flex; align-items:center; gap:8px; margin:8px 0;}
.compare-col{flex:1; text-align:center;}
.compare-col .cname{font-size:13px; font-weight:600; margin-bottom:6px; min-height:32px;}
.compare-mid{width:76px; text-align:center; font-family:'Barlow Condensed'; font-size:12px; color:var(--chalk); text-transform:uppercase;}
.record-line{display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13px;}
.record-line .rl-label{color:var(--chalk);}
.record-line .rl-val{font-weight:700; color:var(--gold); font-family:'Barlow Condensed'; font-size:15px;}
.real-tag{color:#8fc4ff; font-size:11px;}

/* Grille d'actions secondaires — fiche joueur rangée */
.action-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.action-btn{background:rgba(255,255,255,0.045); border:1px solid var(--line); color:var(--white);
  border-radius:11px; padding:11px 8px; font-weight:600; font-size:12.5px; font-family:'Barlow Condensed';
  letter-spacing:.02em; cursor:pointer; text-transform:uppercase; text-align:center; line-height:1.3;
  transition:background .15s, border-color .15s, transform .1s;}
.action-btn:active{background:rgba(255,255,255,0.1); border-color:rgba(212,175,55,0.35); transform:scale(0.97);}
.action-btn.full{grid-column:1 / -1;}
.primary-row{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
.primary-row .btn{margin-top:0; width:100%;}

/* Mini-jeu Séance de tirs au but */
.shootout-goal{position:relative; margin:14px 0 6px; height:160px; border-radius:10px;
  background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
  border:2px solid rgba(244,247,245,0.35); overflow:hidden;
  display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr;}
.shootout-net{position:absolute; inset:0; pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, rgba(244,247,245,0.14) 0 1px, transparent 1px 13px),
    repeating-linear-gradient(90deg, rgba(244,247,245,0.14) 0 1px, transparent 1px 13px);}
.shootout-zone{border:1px dashed rgba(244,247,245,0.18); background:transparent;
  color:rgba(244,247,245,0.5); font-size:9.5px; font-family:'Barlow Condensed'; font-weight:600;
  text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; justify-content:center;
  cursor:pointer; padding:0; transition:background .15s;}
.shootout-zone:active{background:rgba(212,175,55,0.16);}
.shootout-zone.chosen{background:rgba(212,175,55,0.22); border-color:rgba(212,175,55,0.55); color:var(--gold);}
.shootout-zone:disabled{cursor:default;}
.shootout-keeper{position:absolute; left:50%; top:25%; transform:translate(-50%,-50%);
  font-size:26px; transition:left .55s ease, top .55s ease; z-index:2;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));}
.shootout-ball{position:absolute; left:50%; top:92%; transform:translate(-50%,-50%);
  font-size:20px; transition:left .55s ease, top .55s ease; z-index:3;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));}
.shootout-result{margin-top:8px;}
.shootout-picker-list{display:flex; flex-direction:column; gap:8px; margin-top:6px;}

/* Dopage / filière parallèle */
.btn-dope{background:linear-gradient(90deg, rgba(165,87,224,0.22), rgba(92,42,134,0.18));
  border:1px solid rgba(165,87,224,0.55); color:#dcb4ff;
  border-radius:10px; padding:12px 16px; font-weight:700; font-size:14px; font-family:'Barlow Condensed';
  letter-spacing:.03em; cursor:pointer; text-transform:uppercase; width:100%; margin-top:8px;}
.btn-dope:disabled{opacity:.45;}
.badge-doped{display:inline-flex; align-items:center; gap:2px; background:linear-gradient(90deg,var(--purple-dark),var(--purple));
  color:#fff; font-family:'Barlow Condensed'; font-weight:700; font-size:10px; letter-spacing:.04em;
  padding:2px 6px; border-radius:20px; box-shadow:0 0 8px rgba(165,87,224,0.5);}
.badge-banned{display:inline-flex; align-items:center; gap:2px; background:rgba(193,18,31,0.85);
  color:#fff; font-family:'Barlow Condensed'; font-weight:700; font-size:10px; letter-spacing:.04em;
  padding:2px 6px; border-radius:20px;}
.bar-fill.doped{background:linear-gradient(90deg,var(--purple-dark),var(--purple));}
.dope-warning{background:rgba(165,87,224,0.1); border:1px solid rgba(165,87,224,0.4); border-radius:12px;
  padding:12px 14px; font-size:13px; line-height:1.5; margin-bottom:4px;}
.dope-warning p{margin:0 0 8px;}
.dope-warning ul{margin:0; padding-left:18px;}
.dope-warning li{margin-bottom:4px;}

/* Corruption — pot-de-vin pour lever une suspension en cours (thème doré, distinct du dopage) */
.btn-corrupt{background:linear-gradient(90deg, rgba(224,181,87,0.25), rgba(90,68,10,0.2));
  border:1px solid rgba(224,181,87,0.6); color:#f0d28a;
  border-radius:10px; padding:12px 16px; font-weight:700; font-size:14px; font-family:'Barlow Condensed';
  letter-spacing:.03em; cursor:pointer; text-transform:uppercase; width:100%; margin-top:8px;}
.btn-corrupt:disabled{opacity:.45;}
.badge-corrupted{display:inline-flex; align-items:center; gap:2px; background:linear-gradient(90deg,#7a5c10,#e0b557);
  color:#241a02; font-family:'Barlow Condensed'; font-weight:700; font-size:10px; letter-spacing:.04em;
  padding:2px 6px; border-radius:20px; box-shadow:0 0 8px rgba(224,181,87,0.5);}
.corrupt-warning{background:rgba(224,181,87,0.1); border:1px solid rgba(224,181,87,0.4); border-radius:12px;
  padding:12px 14px; font-size:13px; line-height:1.5; margin-bottom:4px;}
.corrupt-warning p{margin:0 0 8px;}
.corrupt-warning ul{margin:0; padding-left:18px;}
.corrupt-warning li{margin-bottom:4px;}

/* État désactivé — cohérent sur tous les boutons custom (pas que btn-primary) */
.btn-soin:disabled, .btn-captain:disabled, .btn-compare:disabled, .btn-sell:disabled,
.action-btn:disabled, .btn-dope:disabled, .btn-corrupt:disabled, .btn-ghost:disabled{
  opacity:.38; filter:grayscale(.4); cursor:not-allowed; pointer-events:none;
}

/* Ligne de badges sous le nom du joueur — évite qu'un badge isolé retombe seul à la ligne */
.badge-row{display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:5px;}

/* ---------------- Fiche joueur v35 : nouveau design + mini menu ---------------- */
.ps-sheet{padding-top:18px;}
.ps-header{display:flex; gap:13px; align-items:flex-start; flex:1; min-width:0;}
.ps-avatar{width:60px; height:60px; border-radius:16px; flex-shrink:0; position:relative;
  display:flex; align-items:center; justify-content:center; font-size:26px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18), 0 4px 10px rgba(0,0,0,0.3);}
.ps-avatar .ps-num{position:absolute; bottom:-6px; right:-7px; background:var(--night); border:1px solid var(--gold);
  color:var(--gold); font-family:'Barlow Condensed'; font-weight:700; font-size:11px; border-radius:8px; padding:1px 5px;
  line-height:1.3;}
.ps-name-block{flex:1; min-width:0;}
.ps-name-block h2{margin:2px 0 1px; font-size:22px; line-height:1.15;}
.ps-sub{font-size:12px; color:var(--chalk); opacity:.85; margin-top:1px;}
.ps-tabs{display:flex; gap:4px; margin:14px 0 12px; background:rgba(255,255,255,0.03); border:1px solid var(--line);
  border-radius:12px; padding:4px;}
.ps-tab{flex:1; background:none; border:none; color:var(--chalk); font-family:'Barlow Condensed'; font-weight:700;
  font-size:11.5px; text-transform:uppercase; letter-spacing:.02em; padding:8px 2px; border-radius:9px; cursor:pointer;}
.ps-tab:active{background:rgba(255,255,255,0.06);}
.ps-tab.active{background:linear-gradient(135deg, rgba(212,175,55,0.28), rgba(212,175,55,0.12)); color:var(--gold);
  box-shadow:inset 0 0 0 1px rgba(212,175,55,0.3);}
.ps-body{animation:fade .2s ease;}
.info-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0 10px;}
.info-chip{background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
.info-chip .ic-lab{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--chalk);
  font-family:'Barlow Condensed'; opacity:.8;}
.info-chip .ic-val{font-size:14px; font-weight:600; margin-top:2px;}
.ps-section-lab{font-family:'Barlow Condensed'; text-transform:uppercase; letter-spacing:.06em; font-size:11.5px;
  color:var(--gold); margin:14px 0 6px;}
.mini-hist-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:6px 2px;
  border-bottom:1px solid rgba(255,255,255,0.06); gap:8px;}
.mini-hist-row:last-child{border-bottom:none;}
.mh-res{width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; flex-shrink:0;}
.mh-res.W{background:rgba(95,184,122,0.25); color:#8fe0a5;}
.mh-res.L{background:rgba(193,18,31,0.25); color:#f19aa0;}
.mh-res.D{background:rgba(255,255,255,0.1); color:var(--chalk);}
.mh-opp{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mh-score{color:var(--chalk); font-family:'Barlow Condensed'; flex-shrink:0;}

/* Auras joueurs spéciaux / légendes */
.player-card.aura-special{position:relative; box-shadow:0 0 0 1px rgba(212,175,55,0.5), 0 0 10px rgba(212,175,55,0.18);}
.player-card.aura-legend{position:relative; box-shadow:0 0 0 1px rgba(212,175,55,0.7), 0 0 16px rgba(212,175,55,0.35);}
.player-card.aura-special::after, .player-card.aura-legend::after, .player-card.aura-elite::after, .player-card.aura-icone::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; will-change:opacity;}
.player-card.aura-special::after{box-shadow:0 0 0 1px rgba(212,175,55,0.7), 0 0 18px rgba(212,175,55,0.4); animation:auraPulse 2.6s ease-in-out infinite;}
.player-card.aura-legend::after{box-shadow:0 0 0 2px rgba(255,223,120,0.9), 0 0 28px rgba(255,223,120,0.6); animation:auraPulse 2.2s ease-in-out infinite;}
@keyframes auraPulse{0%,100%{opacity:0;} 50%{opacity:1;}}

/* Badge MAX potentiel atteint */
.max-badge{display:inline-flex; align-items:center; gap:2px; background:linear-gradient(90deg,#7a5c00,var(--gold));
  color:#221a00; font-family:'Barlow Condensed'; font-weight:700; font-size:10px; letter-spacing:.04em;
  padding:2px 6px; border-radius:20px; box-shadow:0 0 8px rgba(212,175,55,0.5);}
.stat-pill.maxed{box-shadow:0 0 0 1px var(--gold), 0 0 6px rgba(212,175,55,0.5); color:var(--gold);}
.bar-fill.potential{background:linear-gradient(90deg,#7a5c00,var(--gold));}

/* Paliers de rareté "Élite" (★★★, débloqué à 1 CDM) et "Icône" (★★★★, débloqué à 5 CDM) */
.star.tier-elite{color:#7ad8ff;}
.star.tier-icone{color:#ffd166; text-shadow:0 0 6px rgba(255,209,102,0.6);}
.badge-elite{display:inline-flex; align-items:center; gap:2px; background:linear-gradient(90deg,#0b5b78,#2fb6e0);
  color:#04222e; font-family:'Barlow Condensed'; font-weight:700; font-size:10px; letter-spacing:.04em;
  padding:2px 6px; border-radius:20px; box-shadow:0 0 8px rgba(47,182,224,0.55);}
.badge-icone{display:inline-flex; align-items:center; gap:2px; background:linear-gradient(90deg,#7a5c00,#ffd166,#7a5c00);
  color:#221a00; font-family:'Barlow Condensed'; font-weight:700; font-size:10px; letter-spacing:.04em;
  padding:2px 6px; border-radius:20px; box-shadow:0 0 10px rgba(255,209,102,0.6);}
.player-card.aura-elite{position:relative; box-shadow:0 0 0 1px rgba(47,182,224,0.55), 0 0 12px rgba(47,182,224,0.22);}
.player-card.aura-icone{position:relative; box-shadow:0 0 0 2px rgba(255,209,102,0.8), 0 0 18px rgba(255,209,102,0.4);}
.player-card.aura-elite::after{box-shadow:0 0 0 1px rgba(122,216,255,0.85), 0 0 22px rgba(122,216,255,0.5); animation:auraPulse 2.4s ease-in-out infinite;}
.player-card.aura-icone::after{box-shadow:0 0 0 2px rgba(255,236,179,1), 0 0 32px rgba(255,236,179,0.7); animation:auraPulse 2s ease-in-out infinite;}

/* Filtre / bascule */
.toggle-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--chalk); margin:10px 0; user-select:none; cursor:pointer;}
.toggle-row input{width:16px; height:16px; accent-color:var(--gold);}

/* ---------------- CÉLÉBRATION CHAMPION DU MONDE ---------------- */
.champion-overlay{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 35%, rgba(60,45,0,0.55), rgba(4,8,18,0.94));
  animation:fadeInChamp .4s ease; overflow:hidden;}
@keyframes fadeInChamp{from{opacity:0;} to{opacity:1;}}
.champion-box{position:relative; width:100%; max-width:440px; padding:26px 22px 30px; text-align:center; z-index:3;}
.aura-ring{position:absolute; left:50%; top:120px; width:120px; height:120px; margin:-60px 0 0 -60px;
  border-radius:50%; border:2px solid rgba(212,175,55,0.55); pointer-events:none;
  animation:auraRingExpand 2.4s ease-out infinite;}
.aura-ring.r2{animation-delay:.8s;}
.aura-ring.r3{animation-delay:1.6s;}
@keyframes auraRingExpand{
  0%{transform:scale(0.4); opacity:.9; border-color:rgba(255,235,160,0.9);}
  100%{transform:scale(3.2); opacity:0; border-color:rgba(212,175,55,0);}
}
.champion-trophy{font-size:78px; line-height:1; margin:6px 0 4px; display:inline-block;
  filter:drop-shadow(0 0 22px rgba(212,175,55,0.85)); animation:trophyPop .8s cubic-bezier(.2,1.4,.4,1), trophyFloat 2.6s ease-in-out .8s infinite;}
@keyframes trophyPop{
  0%{transform:scale(0) rotate(-25deg); opacity:0;}
  70%{transform:scale(1.15) rotate(6deg); opacity:1;}
  100%{transform:scale(1) rotate(0deg);}
}
@keyframes trophyFloat{
  0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}
}
.champion-title{font-family:'Bebas Neue'; font-size:34px; letter-spacing:.05em; margin:8px 0 2px;
  background:linear-gradient(90deg,#fff2c4,var(--gold),#fff2c4); -webkit-background-clip:text; background-clip:text; color:transparent;
  background-size:200% auto; animation:titleShine 2.4s linear infinite; text-shadow:0 0 24px rgba(212,175,55,0.4);}
@keyframes titleShine{0%{background-position:0% center;} 100%{background-position:200% center;}}
.champion-sub{font-size:14px; color:var(--chalk); margin-bottom:18px;}
.champion-fs .champion-trophy{filter:drop-shadow(0 0 28px rgba(76,134,196,0.7)) drop-shadow(0 0 20px rgba(193,18,31,0.5));}
.champion-fs .aura-ring{border-color:rgba(76,134,196,0.55);}
.champion-fs .champion-title{background:linear-gradient(90deg,#fff2c4,var(--gold),#4c86c4,#c1121f,#fff2c4); background-size:300% auto;}
.champion-fifat .champion-trophy{filter:drop-shadow(0 0 28px rgba(165,87,224,0.75)) drop-shadow(0 0 22px rgba(193,18,31,0.55));}
.champion-fifat .aura-ring{border-color:rgba(165,87,224,0.6);}
.champion-fifat .champion-title{background:linear-gradient(90deg,#fff2c4,#c1121f,var(--gold),#a557e0,#fff2c4); background-size:320% auto;}
.champion-club .champion-trophy{filter:drop-shadow(0 0 28px rgba(76,134,196,0.8)) drop-shadow(0 0 18px rgba(212,175,55,0.5));}
.champion-club .aura-ring{border-color:rgba(76,134,196,0.55);}
.champion-club .champion-title{background:linear-gradient(90deg,#cfe6ff,#4c86c4,var(--gold),#cfe6ff); background-size:280% auto;}

/* --- Animations additionnelles (navigation, boutons, actus, score, séries) --- */
.tab-btn{transition:transform .18s cubic-bezier(.3,1.6,.4,1), color .18s ease;}
.tab-btn:active{transform:scale(0.88);}
.tab-btn.active .ic{display:inline-block; animation:tabPop .35s cubic-bezier(.3,1.6,.4,1);}
@keyframes tabPop{0%{transform:scale(0.6) translateY(3px);} 60%{transform:scale(1.25) translateY(-2px);} 100%{transform:scale(1) translateY(0);}}
button, .btn, .slot-pick, .talk-option, .record{transition:transform .14s ease;}
button:active, .btn:active, .slot-pick:active, .talk-option:active{transform:scale(0.96);}
.news-item{animation:newsSlideIn .35s cubic-bezier(.2,.8,.3,1) both;}
@keyframes newsSlideIn{from{opacity:0; transform:translateX(-10px);} to{opacity:1; transform:translateX(0);}}
.score-num{display:inline-block;}
.score-num.bump{animation:scoreBump .5s cubic-bezier(.3,1.7,.4,1);}
@keyframes scoreBump{0%{transform:scale(1);} 35%{transform:scale(1.5); color:var(--gold);} 100%{transform:scale(1);}}
.stat-box{animation:statPop .4s cubic-bezier(.25,.9,.3,1) both;}
.stat-box:nth-child(1){animation-delay:.02s;} .stat-box:nth-child(2){animation-delay:.08s;}
.stat-box:nth-child(3){animation-delay:.14s;} .stat-box:nth-child(4){animation-delay:.2s;}
.stat-box:nth-child(5){animation-delay:.26s;}
@keyframes statPop{from{opacity:0; transform:translateY(8px) scale(.94);} to{opacity:1; transform:translateY(0) scale(1);}}
.series-track{display:flex; gap:6px; align-items:center; margin:6px 0 2px;}
.series-pip{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,0.08); border:1px solid var(--line); transition:all .3s ease;}
.series-pip.win{background:#5fb87a; box-shadow:0 0 10px rgba(95,184,122,0.6); animation:pipFill .4s cubic-bezier(.3,1.6,.4,1);}
.series-pip.loss{background:#c1121f; box-shadow:0 0 10px rgba(193,18,31,0.55); animation:pipFill .4s cubic-bezier(.3,1.6,.4,1);}
@keyframes pipFill{from{transform:scale(0.3); opacity:0;} to{transform:scale(1); opacity:1;}}
.extratime-banner{background:linear-gradient(90deg, rgba(165,87,224,0.28), rgba(212,175,55,0.14)); border:1px solid rgba(165,87,224,0.5);
  border-radius:12px; padding:9px 12px; font-size:12.5px; margin:8px 0; text-align:center; font-family:'Barlow Condensed'; font-weight:700;
  letter-spacing:.02em; animation:etPulse 1.6s ease-in-out infinite;}
@keyframes etPulse{0%,100%{box-shadow:0 0 0 rgba(165,87,224,0.0);} 50%{box-shadow:0 0 14px rgba(165,87,224,0.35);}}
.intro-story .sheet{animation:fadeInChamp .4s ease, slideup .3s cubic-bezier(.2,.7,.3,1);}
.fw-particle{position:absolute; width:5px; height:5px; border-radius:50%; top:0; left:0; z-index:2; pointer-events:none;
  box-shadow:0 0 6px 1px currentColor;}
.fw-particle.burst{animation:fwBurst 1.05s ease-out forwards;}
@keyframes fwBurst{
  0%{opacity:1; transform:translate(0,0) scale(1);}
  100%{opacity:0; transform:translate(var(--fx),var(--fy)) scale(.3);}
}

/* =====================================================================================
   v42 — STADE 3D (js/stade3d.js) : canvas WebGL + surimpressions façon retransmission TV
   ===================================================================================== */
.pitch-wrap.mode3d{height:clamp(250px, 66vw, 340px); background:#03050b; border:1px solid rgba(212,175,55,0.35);
  box-shadow:0 14px 34px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.04); perspective:none;}
.pitch-wrap.mode3d::before, .pitch-wrap.mode3d::after{display:none;}
.pitch-wrap.mode3d > :not(.s3d-layer):not(.s3d-hud):not(.goal-flash):not(.goal-card-pop){display:none !important;}
.s3d-layer{position:absolute; inset:0; z-index:1;}
.s3d-canvas{width:100% !important; height:100% !important; display:block; touch-action:pan-y;}
.s3d-hud{position:absolute; inset:0; z-index:6; pointer-events:none; font-family:'Barlow Condensed',sans-serif;}
.s3d-bug{position:absolute; top:8px; left:8px; display:flex; align-items:center; gap:5px;
  background:linear-gradient(180deg,rgba(16,24,50,0.94),rgba(4,8,18,0.94)); border:1px solid rgba(255,255,255,0.14);
  border-radius:6px; padding:3px 8px; font-weight:700; font-size:13px; color:#fff; box-shadow:0 3px 10px rgba(0,0,0,0.5);}
.s3d-chip{width:4px; height:15px; border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,0.25);}
.s3d-sc{background:linear-gradient(180deg,#fff,#dfe4ee); color:#0b1226; padding:0 7px; border-radius:3px;
  font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:.05em; line-height:19px;}
.s3d-min{color:var(--gold); margin-left:3px; min-width:30px;}
.s3d-live{position:absolute; top:36px; left:9px; color:#ff4d5e; font-weight:700; font-size:10.5px; letter-spacing:.12em;
  text-shadow:0 1px 3px rgba(0,0,0,0.8); animation:s3dBlink 1.6s ease-in-out infinite;}
.s3d-live.s3d-pre{top:auto; bottom:10px; left:10px; color:#fff; background:rgba(6,10,22,0.7); border-left:3px solid var(--gold);
  padding:3px 9px; animation:none; letter-spacing:.08em;}
@keyframes s3dBlink{0%,100%{opacity:1;} 50%{opacity:.45;}}
.s3d-tools{position:absolute; top:8px; right:8px; display:flex; gap:5px; pointer-events:auto;}
.s3d-btn, .s3d-enable{background:rgba(6,10,22,0.72); color:#fff; border:1px solid rgba(255,255,255,0.2); border-radius:8px;
  padding:5px 9px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; letter-spacing:.03em;
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); cursor:pointer;}
.s3d-btn:active, .s3d-enable:active{transform:scale(0.94); background:rgba(212,175,55,0.35);}
.s3d-enable{position:absolute; top:8px; right:8px; z-index:11;}
.s3d-carrier{position:absolute; left:8px; bottom:8px; background:linear-gradient(90deg,rgba(6,10,22,0.88),rgba(6,10,22,0.55));
  border-left:3px solid var(--gold); padding:3px 10px 3px 8px; font-weight:700; font-size:13.5px; color:#fff;
  transition:opacity .3s ease; border-radius:0 4px 4px 0; opacity:0;}
.s3d-carrier b{color:var(--gold); margin-right:5px; font-family:'Bebas Neue',sans-serif; font-size:16px;}
.pitch-wrap.s3d-fullscreen{position:fixed !important; inset:0; height:100% !important; width:100% !important;
  z-index:70; border-radius:0; margin:0; border:none;}
.pitch-wrap.s3d-fullscreen .s3d-bug{top:calc(10px + env(safe-area-inset-top)); left:12px; font-size:15px;}
.pitch-wrap.s3d-fullscreen .s3d-live{top:calc(42px + env(safe-area-inset-top)); left:13px;}
.pitch-wrap.s3d-fullscreen .s3d-tools{top:calc(10px + env(safe-area-inset-top)); right:12px;}
.pitch-wrap.s3d-fullscreen .s3d-carrier{bottom:calc(14px + env(safe-area-inset-bottom)); left:12px;}
body.s3d-fs-open{overflow:hidden;}
body.s3d-fs-open .overlay, body.s3d-fs-open .toast-wrap{z-index:90;}
.s3d-hero{height:clamp(170px, 48vw, 235px); border-radius:16px; overflow:hidden; position:relative; margin:4px 0 14px;
  border:1px solid rgba(212,175,55,0.3); box-shadow:0 12px 30px rgba(0,0,0,0.5); background:#05080f;}
.s3d-hero.mode3d{height:clamp(170px, 48vw, 235px);}

/* =====================================================================================
   v42 — REFONTE VISUELLE 2D : ambiance "soir de match" (halos de projecteurs, verre dépoli,
   habillage TV). Uniquement de la mise en forme : aucun sélecteur JS ne dépend de ces règles.

.topbar{background:linear-gradient(180deg, rgba(20,30,64,0.9), rgba(8,12,28,0.4));

.brand h1{background:linear-gradient(180deg,#ffffff 20%,#d9c27a 120%); -webkit-background-clip:text; background-clip:text; color:transparent;}
.player-card, .news-item, .standing-row, .slot-pick, .tactic-bar, .friendly-box{

.section-title{letter-spacing:.05em; text-shadow:0 2px 12px rgba(96,130,255,0.25), 0 1px 3px rgba(0,0,0,0.5);}
.btn-primary{background:linear-gradient(135deg,#f6dd86 0%,#d4af37 45%,#b48b1c 100%); position:relative; overflow:hidden;

.btn-primary:not(:disabled)::after{content:''; position:absolute; top:0; bottom:0; width:40%; left:-60%;

@keyframes btnSheen{0%,60%{left:-60%;} 100%{left:130%;}}
.scoreboard{background:linear-gradient(180deg,#121b3a 0%,#05080f 100%); border:1px solid rgba(212,175,55,0.35);

.scoreboard::before{content:''; position:absolute; left:0; right:0; top:0; height:2px;

.sb-score{color:#fff; text-shadow:0 0 18px rgba(212,175,55,0.45);}
.tabbar{bottom:calc(8px + env(safe-area-inset-bottom)); width:calc(100% - 16px); max-width:464px; border-radius:22px;
  padding:6px 6px; background:linear-gradient(180deg, rgba(18,26,54,0.86), rgba(8,12,28,0.92));

/* =====================================================================================
   v43 — ÉCRANS DE DÉMARRAGE (portrait) : logo studio SuperEssence puis chargement du jeu.
   Le HTML est tout en haut du body (#boot) pour s'afficher AVANT l'exécution du gros script ;
   la séquence est pilotée par runBootSequence() en fin de script.
   ===================================================================================== */
#boot{position:fixed; inset:0; z-index:9999; background:#000; overflow:hidden; touch-action:none;
  font-family:'Barlow Condensed',system-ui,sans-serif;}
#boot.boot-out{opacity:0; transition:opacity .6s ease; pointer-events:none;}
.boot-studio{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#000; transition:opacity .7s ease;}
.boot-studio.hide{opacity:0; pointer-events:none;}
.boot-studio-logo{width:min(78vw, 420px); height:auto; opacity:0; transform:scale(.82); filter:blur(10px);
  animation:studioIn 1.1s cubic-bezier(.2,.9,.25,1.15) .25s forwards;
  -webkit-mask-image:linear-gradient(100deg,#000 40%,rgba(0,0,0,.55) 50%,#000 60%); -webkit-mask-size:300% 100%;
  mask-image:linear-gradient(100deg,#000 40%,rgba(0,0,0,.55) 50%,#000 60%); mask-size:300% 100%;}
.boot-studio-logo.shine{animation:studioIn 1.1s cubic-bezier(.2,.9,.25,1.15) .25s forwards, studioShine 1.1s ease-in-out 1.4s 1;}
@keyframes studioIn{to{opacity:1; transform:scale(1); filter:blur(0);}}
@keyframes studioShine{from{-webkit-mask-position:100% 0; mask-position:100% 0;} to{-webkit-mask-position:0 0; mask-position:0 0;}}
.boot-studio-sub{margin-top:14px; color:#8a8a8a; letter-spacing:.5em; text-transform:uppercase; font-size:12px; font-weight:600;
  opacity:0; animation:fadeUp .7s ease 1.3s forwards; padding-left:.5em;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

.boot-load{position:absolute; inset:0; opacity:0; transition:opacity .7s ease; display:flex; flex-direction:column;
  background:radial-gradient(ellipse 90% 45% at 50% 0%, #1d2d63 0%, #0a1129 45%, #04070f 100%);}
.boot-load.show{opacity:1;}
.boot-beams{position:absolute; inset:0; pointer-events:none;}
.boot-beams i{position:absolute; top:-10%; width:34vw; height:85%; transform-origin:50% 0;
  background:linear-gradient(180deg, rgba(255,246,210,.30), rgba(255,246,210,0) 85%); filter:blur(6px);
  animation:beam 5s ease-in-out infinite;}
.boot-beams i:nth-child(1){left:-12%; --r:-28deg; animation-delay:0s;}
.boot-beams i:nth-child(2){left:14%;  --r:-12deg; animation-delay:-1.2s; opacity:.7;}
.boot-beams i:nth-child(3){right:14%; --r:12deg;  animation-delay:-2.4s; opacity:.7;}
.boot-beams i:nth-child(4){right:-12%;--r:28deg;  animation-delay:-3.6s;}
@keyframes beam{0%,100%{transform:rotate(var(--r));} 50%{transform:rotate(calc(var(--r) * .6));}}
.boot-crowd{position:absolute; left:0; right:0; top:30%; height:16%; opacity:.5;
  background:radial-gradient(circle at 3px 3px, rgba(255,255,255,.55) 1.2px, transparent 1.6px) 0 0/9px 9px,
             radial-gradient(circle at 3px 3px, rgba(239,65,53,.6) 1.2px, transparent 1.6px) 4px 4px/13px 11px,
             radial-gradient(circle at 3px 3px, rgba(60,110,230,.7) 1.2px, transparent 1.6px) 2px 6px/11px 9px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 70%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 40%,#000 70%,transparent);
  animation:crowdFlash 1.4s steps(2) infinite;}
@keyframes crowdFlash{50%{opacity:.62;}}
.boot-pitch{position:absolute; left:-30%; right:-30%; bottom:-4%; height:30%; transform:perspective(700px) rotateX(38deg);
  transform-origin:50% 100%;
  background:repeating-linear-gradient(90deg,#1f5a2a 0 7%, #276b33 7% 14%);
  box-shadow:inset 0 40px 60px -20px rgba(0,0,0,.8);}
.boot-pitch::before{content:''; position:absolute; left:50%; top:8%; width:26%; height:60%; transform:translateX(-50%);
  border:3px solid rgba(255,255,255,.55); border-radius:50%;}
.boot-pitch::after{content:''; position:absolute; left:50%; top:0; bottom:0; width:3px; background:rgba(255,255,255,.55);}
.boot-center{position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding-top:4vh;}
.boot-ball{width:96px; height:96px; border-radius:24px; overflow:hidden; box-shadow:0 0 0 1px rgba(212,175,55,.5), 0 0 40px rgba(212,175,55,.35), 0 18px 40px rgba(0,0,0,.6);
  animation:ballDrop .9s cubic-bezier(.3,1.5,.5,1) both;}
.boot-ball img{width:100%; height:100%; display:block;}
@keyframes ballDrop{from{transform:translateY(-60px) scale(.6); opacity:0;} to{transform:none; opacity:1;}}
.boot-eyebrow{margin-top:22px; color:#d4af37; letter-spacing:.32em; text-transform:uppercase; font-size:12.5px; font-weight:700;
  animation:fadeUp .6s ease .3s both; padding-left:.32em;}
.boot-title{margin:4px 0 0; font-family:'Bebas Neue',system-ui,sans-serif; font-weight:400; font-size:clamp(46px, 14vw, 66px);
  letter-spacing:.06em; line-height:1; background:linear-gradient(180deg,#ffffff 30%,#e8d38a 70%,#b48b1c);
  -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 14px rgba(0,0,0,.7));
  animation:titleIn .8s cubic-bezier(.2,.9,.25,1.1) .4s both;}
@keyframes titleIn{from{opacity:0; letter-spacing:.4em;} to{opacity:1; letter-spacing:.06em;}}
.boot-flag{margin-top:12px; width:84px; height:4px; border-radius:2px; background:linear-gradient(90deg,#0055a4 33%,#fff 33% 66%,#ef4135 66%);
  animation:fadeUp .6s ease .7s both;}
.boot-bottom{position:relative; z-index:3; padding:0 28px calc(24vh + env(safe-area-inset-bottom)); text-align:center;}
.boot-step{color:#e9edf6; font-size:14px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px;
  text-shadow:0 2px 6px rgba(0,0,0,.8);}
.boot-bar{height:8px; border-radius:6px; background:rgba(0,0,0,.55); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); overflow:hidden;}
.boot-fill{height:100%; width:0%; border-radius:6px; transition:width .35s ease;
  background:linear-gradient(90deg,#b48b1c,#f6dd86,#d4af37); box-shadow:0 0 14px rgba(246,221,134,.7); position:relative; overflow:hidden;}
.boot-fill::after{content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);
  background-size:200% 100%; animation:fillSheen 1.2s linear infinite;}
@keyframes fillSheen{from{background-position:150% 0;} to{background-position:-50% 0;}}
.boot-tip{min-height:36px; margin-top:12px; color:#c9d1e3; font-family:'Barlow',system-ui,sans-serif; font-size:13px; line-height:1.4;
  text-shadow:0 2px 6px rgba(0,0,0,.9); transition:opacity .3s ease;}
.boot-credit{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom)); white-space:nowrap;
  color:rgba(255,255,255,.75); font-size:11px; letter-spacing:.2em; text-transform:uppercase; background:rgba(0,0,0,.6);
  padding:6px 14px; border-radius:20px; box-shadow:0 0 0 1px rgba(255,255,255,.1);}
.boot-credit b{color:#fff; letter-spacing:.04em; text-transform:none; font-size:13px;}
.boot-credit b span{color:#fcca1e;}
@media (prefers-reduced-motion: reduce){ #boot *{animation-duration:.01s !important; animation-delay:0s !important;} }
.live-actions{display:flex; gap:8px; margin-top:10px;}
.live-actions .btn{margin-top:0;}
.live-actions #subsBtn{flex:1.6;} .live-actions #paceBtn{flex:1;}
.s3d-ticker{position:absolute; left:8px; right:8px; bottom:40px; display:flex; align-items:center; gap:8px;
  background:linear-gradient(90deg, rgba(8,14,34,0.92), rgba(8,14,34,0.72)); border-left:3px solid #4c86c4;
  border-radius:0 6px 6px 0; padding:5px 10px; color:#eef2fa; font-family:'Barlow',sans-serif; font-size:12.5px; line-height:1.25;
  opacity:0; transform:translateY(6px); transition:opacity .25s ease, transform .25s ease; max-height:3.2em; overflow:hidden;}
.s3d-ticker.in{opacity:1; transform:none;}
.s3d-ticker.goal{border-left-color:var(--gold); background:linear-gradient(90deg, rgba(60,46,6,0.95), rgba(20,16,4,0.8)); font-weight:700;}
.s3d-tmin{font-family:'Bebas Neue',sans-serif; font-size:16px; color:var(--gold); flex-shrink:0;}
.pitch-wrap.s3d-fullscreen .s3d-ticker{bottom:calc(52px + env(safe-area-inset-bottom)); left:12px; right:12px; font-size:14px;}

/* ---- v44 : feuille de match adverse ---- */
.opp-lineup{background:linear-gradient(135deg, rgba(193,18,31,0.14), rgba(255,255,255,0.03) 60%); border:1px solid rgba(255,255,255,0.1);
  border-radius:14px; padding:10px 12px; margin:0 0 14px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 18px rgba(0,0,0,0.3);}
