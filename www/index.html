    showClubMatchSummary(m, statusBase);
  };
}

function showMatchSummary(m, statusBase){
  closeSheet();
  const st = m.stats || {possUs:50,possThem:50,tirsUs:0,tirsThem:0,cadresUs:0,cadresThem:0,corUs:0,corThem:0,fautesUs:0,fautesThem:0,cartons:[]};
  const motmPlayer = m.motm ? playerById(m.motm) : null;
  const cardsList = st.cartons.length ? st.cartons.map(c=>`<div class="standing-row"><span style="width:34px;">${c.min}'</span><span class="opp">${c.color==='rouge'?'🟥':'🟨'} ${c.who}</span></div>`).join("") : `<div class="empty-note" style="padding:10px;">Match propre, aucun carton.</div>`;
  const overlay = document.createElement("div");
  overlay.className="overlay"; overlay.id="overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="eyebrow">${m.weather ? m.weather.label : ''} · Résumé</div>
          <h2 style="margin:2px 0;font-size:22px;">France ${m.us} - ${m.them} ${m.opp}</h2>
        </div>
        <button class="close-x" id="closeSheet">✕</button>
      </div>
      ${motmPlayer ? `<div class="scout-card" style="padding:12px;margin-bottom:14px;"><div style="font-size:11px;color:var(--gold);text-transform:uppercase;font-family:'Barlow Condensed';">Homme du match</div><div style="font-size:19px;font-family:'Bebas Neue';">${motmPlayer.nom}</div></div>` : ""}
      <div class="bar-row"><div class="bar-label">Possession</div><div class="bar-track"><div class="bar-fill" style="width:${st.possUs}%"></div></div><div class="bar-val">${st.possUs}%</div></div>
      <div class="bar-row"><div class="bar-label">Tirs</div><div class="bar-track"><div class="bar-fill" style="width:${st.tirsUs+st.tirsThem? Math.round(100*st.tirsUs/(st.tirsUs+st.tirsThem)):50}%"></div></div><div class="bar-val">${st.tirsUs}-${st.tirsThem}</div></div>
      <div class="bar-row"><div class="bar-label">Cadrés</div><div class="bar-track"><div class="bar-fill def" style="width:${st.cadresUs+st.cadresThem? Math.round(100*st.cadresUs/(st.cadresUs+st.cadresThem)):50}%"></div></div><div class="bar-val">${st.cadresUs}-${st.cadresThem}</div></div>
      <div class="bar-row"><div class="bar-label">Corners</div><div class="bar-track"><div class="bar-fill def" style="width:${st.corUs+st.corThem? Math.round(100*st.corUs/(st.corUs+st.corThem)):50}%"></div></div><div class="bar-val">${st.corUs}-${st.corThem}</div></div>
      <div class="bar-row"><div class="bar-label">Fautes</div><div class="bar-track"><div class="bar-fill form" style="width:${st.fautesUs+st.fautesThem? Math.round(100*st.fautesUs/(st.fautesUs+st.fautesThem)):50}%"></div></div><div class="bar-val">${st.fautesUs}-${st.fautesThem}</div></div>
      <div class="eyebrow" style="margin-top:14px;">Cartons</div>
      ${cardsList}
      ${typeof m.bonus === "number" ? `<div class="formation-note" style="margin-top:10px;">Prime perçue : <b style="color:var(--gold);">${m.bonus} M€</b></div>` : ""}
      <button class="btn btn-primary" id="toInterview">Voir la conférence de presse</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("closeSheet").onclick = closeSheet;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
  document.getElementById("toInterview").onclick = ()=> showInterview(m, statusBase);
}

function showInterview(m, statusBase){
  closeSheet();
  const lineupIds = (m.usOrder||[]).filter(p=>p && p.id);
  let speaker = lineupIds.find(p=> p.id===state.captainId);
  if(!speaker) speaker = [...lineupIds].sort((a,b)=>(b.buts||0)-(a.buts||0))[0];
  if(!speaker) speaker = {nom:"Le sélectionneur", id:null};
  const isCaptain = speaker.id && speaker.id===state.captainId;
  const qPool = statusBase==="W"?INTERVIEW_QUESTIONS_WIN: statusBase==="D"?INTERVIEW_QUESTIONS_DRAW:INTERVIEW_QUESTIONS_LOSS;
  const aPool = statusBase==="W"?INTERVIEW_ANSWERS_WIN: statusBase==="D"?INTERVIEW_ANSWERS_DRAW:INTERVIEW_ANSWERS_LOSS;
  const shuffledA = [...aPool].sort(()=>Math.random()-0.5);
  const overlay = document.createElement("div");
  overlay.className="overlay"; overlay.id="overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="eyebrow">Zone mixte</div>
          <h2 style="margin:2px 0;font-size:22px;">${speaker.nom}${isCaptain?' <span class="armband">C</span>':''} face à la presse</h2>
        </div>
        <button class="close-x" id="closeSheet">✕</button>
      </div>
      ${qPool.map((q,i)=>`
        <div class="interview-q">${q}</div>
        <div class="interview-a">« ${shuffledA[i % shuffledA.length]} »</div>
      `).join("")}
      <button class="btn btn-primary" id="cancelSheet" style="margin-top:16px;">Terminer la conférence</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("closeSheet").onclick = closeSheet;
  document.getElementById("cancelSheet").onclick = closeSheet;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
}

/* ---------------- MI-TEMPS ---------------- */
// Change réellement le style de jeu pour la 2e période (contrairement au discours d'avant-match,
// figé pour tout le match) : retire l'ancien strengthMod/matchup et applique le nouveau, en
// gardant la formation inchangée (les 11 titulaires ne bougent pas à la mi-temps).
function applyHalftimeStyle(m, newKey){
  if(!STYLES[newKey] || newKey === m.styleKey) return;
  const oppTac = ensureOppTactique(m);
  const ourFormation = m.ctx==="club" ? state.club.tactique.formation : state.tactique.formation;
  const oldStyle = STYLES[m.styleKey] || STYLES.equilibre;
  const newStyle = STYLES[newKey];
  m.ourStrength += (newStyle.strengthMod||0) - (oldStyle.strengthMod||0);
  m.ourStrength += styleMatchupMod(newKey, oppTac.style) - styleMatchupMod(m.styleKey, oppTac.style);
  m.styleKey = newKey;
  m.tacticMod = formationMatchupMod(ourFormation, oppTac.formation) + styleMatchupMod(newKey, oppTac.style);
}
function showHalftimeOverlay(m){
  closeSheet();
  const capName = m.ctx!=="club" ? (m.usOrder||[]).find(p=>p && p.id===state.captainId)?.nom : null;
  const oppTac = ensureOppTactique(m);
  const overlay = document.createElement("div");
  overlay.className="overlay"; overlay.id="overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="eyebrow">Vestiaires — mi-temps</div>
          <h2 style="margin:2px 0;font-size:22px;">${m.us} - ${m.them} contre ${m.opp}</h2>
        </div>
      </div>
      <div class="formation-note">${capName ? `${capName} attend vos consignes avant de retourner sur le terrain.` : "Le groupe attend vos consignes avant de retourner sur le terrain."}</div>
      <div class="potential-note">👁️ Vous avez observé leur système en 1ère période : <b style="color:var(--gold);">${FORMATIONS[oppTac.formation].label}</b> · <b style="color:var(--gold);">${STYLES[oppTac.style].label}</b>.</div>
      <h3 style="font-size:14px;font-family:'Barlow Condensed';text-transform:uppercase;color:var(--gold);margin:12px 0 6px;">Style pour la 2e période</h3>
      <div id="halftimeStyleOptions"></div>
      <h3 style="font-size:14px;font-family:'Barlow Condensed';text-transform:uppercase;color:var(--gold);margin:14px 0 6px;">Consignes au groupe</h3>
      <div id="talkOptions"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  const styleOpts = overlay.querySelector("#halftimeStyleOptions");
  styleOpts.innerHTML = Object.entries(STYLES).map(([key,s])=>`
    <div class="slot-pick ${m.styleKey===key?'filled':''}" data-htstyle="${key}" style="margin-bottom:6px;">
      <span>${s.label} ${m.styleKey===key?'':''}<span style="opacity:.6;font-size:11px;"> — ${s.desc}</span></span>
      <span class="chevron">${m.styleKey===key?'✓':'▾'}</span>
    </div>
  `).join("");
  styleOpts.querySelectorAll("[data-htstyle]").forEach(o=> o.onclick = ()=>{
    applyHalftimeStyle(m, o.dataset.htstyle);
    showHalftimeOverlay(m);
  });
  const opts = overlay.querySelector("#talkOptions");
  opts.innerHTML = TALK_OPTIONS.map(t=>`
    <div class="talk-option" data-talk="${t.key}">
      <h4>${t.label}</h4>
      <p>${t.desc}</p>
    </div>
  `).join("");
  opts.querySelectorAll("[data-talk]").forEach(o=> o.onclick = ()=>{
    const t = TALK_OPTIONS.find(x=>x.key===o.dataset.talk);
    m.halftimeMod = {strengthMod:t.strengthMod, concedeMod:t.concedeMod};
    m.ourStrength += t.strengthMod;
    (m.usOrder||[]).filter(Boolean).forEach(p=> p.forme = clamp(p.forme + Math.round(t.moraleMod/2), 30, 99));
    closeSheet();
    startAmbientMotion(m);
    setTimeout(()=> tickMatch(m), 400);
  });
}

/* ---------------- PROLOGUE — micro-histoire de contexte (légère, juste pour poser le décor) ---------------- */
const INTRO_STORY_BEATS = [
  {title:"Un coup de fil un mardi soir", text:"Le téléphone vibre alors que vous rangez vos crampons. À l'autre bout du fil, la Fédération : le sélectionneur historique vient de démissionner après une soirée compliquée. Il faut quelqu'un, vite."},
  {title:"Le grand oral", text:"Costume repassé à la hâte, vous voilà devant le comité fédéral. On ne vous demande qu'une chose, simple sur le papier : redonner une âme et des couleurs à cette équipe de France."},
  {title:"Premier jour au centre technique", text:"Les affaires de votre prédécesseur ont à peine quitté le bureau que le staff est déjà là, dans l'attente. À vous de composer le onze, de gérer les egos du vestiaire... et de faire rêver un pays entier, un match après l'autre."}
];
function showIntroStory(){
  let step = 0;
  const overlay = document.createElement("div");
  overlay.className = "overlay intro-story"; overlay.id = "overlay";
  document.body.appendChild(overlay);
  function renderStep(){
    const b = INTRO_STORY_BEATS[step];
    const last = step === INTRO_STORY_BEATS.length-1;
    overlay.innerHTML = `
      <div class="sheet">
        <div class="eyebrow">Prologue · ${step+1}/${INTRO_STORY_BEATS.length}</div>
        <h2 style="margin:6px 0 12px;font-size:24px;">${b.title}</h2>
        <p style="color:var(--chalk); line-height:1.55; font-size:14.5px;">${b.text}</p>
        <button class="btn btn-primary" id="introNext" style="margin-top:18px;width:100%;">${last ? "Prendre le poste ▶" : "Continuer"}</button>
      </div>
    `;
    document.getElementById("introNext").onclick = ()=>{
      if(!last){ step++; renderStep(); }
      else{
        overlay.remove();
        state.introShown = true;
        saveGame();
      }
    };
  }
  renderStep();
}

loadGame();

// v43 : séquence de démarrage — logo du studio SuperEssence, puis écran de chargement du jeu
// (barre de progression réelle : polices, sauvegarde, préchauffage du stade 3D). Un tap sur le
// logo du studio passe directement au chargement. #boot est retiré du DOM à la fin.
const BOOT_TIPS = [
  "Astuce : le bouton 🎥 pendant le match change de caméra (TV, Proche, Tribune, Drone).",
  "Astuce : ⛶ met le match en plein écran — tournez le téléphone pour le grand angle.",
  "Astuce : le scouting adverse révèle la tactique de l'adversaire avant le coup d'envoi.",
  "Astuce : à la mi-temps, changez de style de jeu pour contrer le système adverse.",
  "Astuce : une Coupe du Monde gagnée débloque les joueurs Élite ★★★.",
  "Astuce : ménagez vos cadres, la fatigue fait chuter la forme et grimper les blessures.",
];
async function runBootSequence(){
  const boot = document.getElementById("boot");
  if(!boot) return;
  const studio = document.getElementById("bootStudio"), load = document.getElementById("bootLoad");
  const fill = document.getElementById("bootFill"), step = document.getElementById("bootStep"), tip = document.getElementById("bootTip");
  const logo = studio.querySelector(".boot-studio-logo");
  if(logo) logo.classList.add("shine");
  let skip = false;
  studio.onclick = ()=>{ skip = true; };
  const wait = async (ms)=>{ const t0 = Date.now(); while(!skip && Date.now()-t0 < ms) await delay(50); };
  await wait(2900);
  skip = false;
  studio.classList.add("hide");
  load.classList.add("show");
  let tipIdx = Math.floor(Math.random()*BOOT_TIPS.length);
  tip.textContent = BOOT_TIPS[tipIdx];
  const tipTimer = setInterval(()=>{ tip.style.opacity = 0; setTimeout(()=>{ tipIdx=(tipIdx+1)%BOOT_TIPS.length; tip.textContent = BOOT_TIPS[tipIdx]; tip.style.opacity = 1; }, 300); }, 2600);
  const setP = (p, label)=>{ fill.style.width = p+"%"; if(label) step.textContent = label; };
  await delay(500);
  setP(18, "Chargement des polices…");
  try{ if(document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, delay(1500)]); }catch(e){}
  await delay(350);
  setP(40, "Lecture de votre carrière…");
  await delay(450);
  setP(62, "Construction du stade 3D…");
  await delay(60);
  try{ if(window.Stade3D) Stade3D.warmup(); }catch(e){}
  setP(84, "Allumage des projecteurs…");
  await delay(650);
  setP(100, "Entrée des joueurs !");
  await delay(700);
  clearInterval(tipTimer);
  boot.classList.add("boot-out");
  setTimeout(()=> boot.remove(), 650);
}
runBootSequence();
</script>
<script>
// v42 : dans l'APK Android (Capacitor), PAS de service worker : les fichiers sont déjà embarqués
// dans l'appli, et un cache "cache d'abord" resservirait l'ancienne version après une mise à jour.
const IS_NATIVE_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if(IS_NATIVE_APP){
  // Bouton retour Android : ferme d'abord la fiche ouverte / le plein écran 3D, sinon met l'appli
  // en arrière-plan (au lieu de la quitter brutalement en perdant le match en cours à l'écran).
  const AppPlugin = window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(AppPlugin) AppPlugin.addListener("backButton", ()=>{
    const fs = document.querySelector(".s3d-fullscreen .s3d-btn#s3dFs");
    if(fs){ fs.click(); return; }
    if(document.getElementById("overlay")){ closeSheet(); return; }
    AppPlugin.minimizeApp();
  });
  document.addEventListener("pause", ()=>{ try{ flushSaveNow(); }catch(e){} });
}
if(!IS_NATIVE_APP && "serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("Enregistrement du service worker impossible :", err));
  });
}
</script>
