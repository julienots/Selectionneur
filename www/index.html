// 9. Récompense du meilleur joueur de la saison, calculée en fin de saison.
function computeSeasonAwards(){
  if(!state.squad.length) return;
  const scored = state.squad.map(p=> ({p, score:(p.buts||0)*3 + (p.motm||0)*2 + cote(p)*0.5 + (p.matchsJoues||0)}));
  scored.sort((a,b)=> b.score-a.score);
  const winner = scored[0].p;
  state.seasonAwards = state.seasonAwards || [];
  state.seasonAwards.unshift({year:state.year, playerName:winner.nom, playerId:winner.id});
  if(state.seasonAwards.length>10) state.seasonAwards.length = 10;
  addNews("Distinction", `🏅 ${winner.nom} est élu meilleur joueur de la saison ${state.year}.`);
}

// 10. Progression vers les succès encore verrouillés.
function achievementProgress(key){
  const s = state.squad;
  if(!s.length) return null;
  switch(key){
    case "buteurMaison": return clamp(Math.round((Math.max(0, ...s.map(p=>p.buts||0)) / 10) * 100), 0, 100);
    case "centenaire": return clamp(Math.round((Math.max(0, ...s.map(p=>p.matchsJoues||0)) / 20) * 100), 0, 100);
    case "clean5": return clamp(Math.round(((state.teamStats.cleanSheets||0) / 5) * 100), 0, 100);
    case "recruteur10": return clamp(Math.round(((state.transfersCount||0) / 10) * 100), 0, 100);
    case "plafondGeneration": return clamp(Math.round((s.filter(isMaxed).length / 5) * 100), 0, 100);
    case "hallOfFame5": return clamp(Math.round(((state.hallOfFame||[]).length / 5) * 100), 0, 100);
    case "top3Mondial": return clamp(Math.round((1 - ((state.worldRanking||18)-3) / 40) * 100), 0, 100);
    case "academieDiplomee": return clamp(Math.round(((state.academyGraduates||0) / 3) * 100), 0, 100);
    default: return null;
  }
}

/* ---------------- HELPERS ---------------- */
function playerById(id){ return state.squad.find(p=>p.id===id); }
function overall(p){ return Math.round(p.attaque*0.5 + p.defense*0.5); }
function isMaxed(p){ return p.attaque >= p.potentiel && p.defense >= p.potentiel; }
function potentialPct(p){ return clamp(Math.round((Math.max(p.attaque,p.defense) / p.potentiel) * 100), 0, 100); }
function checkMaxAchievements(){
  const n = state.squad.filter(isMaxed).length;
  if(n >= 5) unlockAchievement("plafondGeneration");
}
function slotsSpec(){
  const spec = FORMATIONS[state.tactique.formation].spec;
  let slots = [];
  spec.forEach(([pos,count])=>{
    for(let i=0;i<count;i++) slots.push(pos+"_"+i);
  });
  return slots;
}
function lineupPlayers(){
  return Object.values(state.lineup).map(id=>playerById(id)).filter(Boolean);
}
function teamStrength(){
  const lp = lineupPlayers();
  if(lp.length===0) return 45;
  const avg = lp.reduce((s,p)=> s + overall(p)*(p.forme/100), 0) / lp.length;
  const specialBonus = lp.filter(p=>p.special).length * 1.5;
  const legendBonus = lp.filter(p=>p.legend).length * 2;
  const eliteBonus = lp.filter(p=>p.elite).length * 3;
  const iconeBonus = lp.filter(p=>p.icone).length * 4.5;
  const captainBonus = (state.captainId && lp.some(p=>p.id===state.captainId)) ? 2.5 : 0;
  return avg + specialBonus + legendBonus + eliteBonus + iconeBonus + captainBonus;
}
function cote(p){
  let c = overall(p)*0.6 + p.forme*0.2 + p.potentiel*0.1 + (p.buts||0)*1.5 + (p.buzz||0);
  if(p.special) c += 8;
  if(p.legend) c += 6;
  if(p.elite) c += 14;
  if(p.icone) c += 22;
  if(state.captainId===p.id) c += 3;
  return clamp(Math.round(c), 20, 180);
}
function popularite(p){
  const score = cote(p) + (p.buts||0)*3 + (p.special?10:0) + (p.legend?12:0) + (state.captainId===p.id?8:0);
  return clamp(Math.round(score/20), 1, 5);
}
function starString(n){
  n = clamp(n,1,5);
  return "★".repeat(n) + "☆".repeat(5-n);
}
function addNews(tag, title){
  state.newsFeed.unshift({tag, title, year:state.year});
  if(state.newsFeed.length>40) state.newsFeed.length = 40;
}

/* ================= SYSTÈME DE DLC ================= */
// Un DLC est un fichier .html autonome contenant deux balises <script> spéciales,
// avec des "type" volontairement non-standards pour que le navigateur ne les exécute
// jamais tout seul (même si on ouvre le fichier DLC directement) :
//
//   <script type="application/dlc-manifest"> ... {"id":"mon-dlc","name":"Mon DLC", ...} ... [fin de balise script]
//   <script type="application/dlc-code"> ... code JS qui utilise l'objet DLC fourni ... [fin de balise script]
//
// Ce fichier n'a aucun effet tant qu'il n'est pas inséré via Réglages > DLC & Extensions.
// Une fois inséré, son code est mémorisé dans state.dlcs (donc réexécuté à chaque
// chargement de la partie, via runAllDLCs()) et exécuté immédiatement.
const DLC_HOOKS = {matchEnd:{}};
const CUSTOM_TABS = {}; // key -> {key, label, icon, dlcId, render(container, DLC)}

function parseDLCFile(text){
  const doc = new DOMParser().parseFromString(text, "text/html");
  const manifestNode = doc.querySelector('script[type="application/dlc-manifest"]');
  const codeNode = doc.querySelector('script[type="application/dlc-code"]');
  if(!manifestNode || !codeNode) throw new Error("Fichier DLC invalide : ce n'est pas un DLC reconnu par le jeu.");
  let manifest;
  try{ manifest = JSON.parse(manifestNode.textContent); }
  catch(e){ throw new Error("Fichier DLC invalide : manifeste illisible."); }
  if(!manifest.id || !manifest.name) throw new Error("Fichier DLC invalide : id ou nom manquant.");
  return {
    id: String(manifest.id),
    name: String(manifest.name),
    version: String(manifest.version||"1.0"),
    author: String(manifest.author||"Inconnu"),
    description: String(manifest.description||""),
    code: codeNode.textContent
  };
}

function installDLCFromText(text){
  const dlc = parseDLCFile(text);
  if(!state.dlcs) state.dlcs = [];
  const idx = state.dlcs.findIndex(d=>d.id===dlc.id);
  const isUpdate = idx>=0;
  if(isUpdate) state.dlcs[idx] = dlc; else state.dlcs.push(dlc);
  runDLC(dlc);
  saveGame();
  return {dlc, isUpdate};
}

function removeDLC(id){
  if(!state.dlcs) return;
  delete DLC_HOOKS.matchEnd[id];
  Object.keys(CUSTOM_TABS).forEach(k=>{ if(CUSTOM_TABS[k].dlcId===id) delete CUSTOM_TABS[k]; });
  if(state.dlcData) delete state.dlcData[id];
  if(state.tab && state.tab.startsWith(id+":")) state.tab = "effectif";
  state.dlcs = state.dlcs.filter(d=>d.id!==id);
  saveGame();
}

// Simule un vrai téléchargement (barre de progression, %, "Ko / Ko") avant
// d'activer le DLC pour de bon. rawText est déjà lu et dlc déjà parsé/validé
// (voir parseDLCFile) à ce stade — seule l'installation effective (runDLC +
// sauvegarde, via installDLCFromText) est repoussée jusqu'à la fin du
// téléchargement simulé, pour donner l'impression d'un vrai téléchargement
// réseau qui doit se terminer avant que le contenu ne soit disponible.
function startDlcDownloadAnim(dlc, rawText, msgEl){
  const duration = rand(60000, 90000); // entre 1min et 1min30, comme demandé
  const startTime = Date.now();
  const fakeSizeKB = rand(180, 640); // taille fictive, juste pour le réalisme visuel
  if(msgEl){
    msgEl.innerHTML = `
      <div class="formation-note" style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;">
          <span>🧩 Téléchargement de "${dlc.name}"...</span>
          <span id="dlcPct">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill form" id="dlcProgressFill" style="width:0%"></div></div>
        <div style="font-size:11px;opacity:.6;margin-top:6px;" id="dlcSpeedInfo">0 Ko / ${fakeSizeKB} Ko</div>
      </div>
    `;
  }
  const insertBtn = document.getElementById("insertDlcBtn");
  if(insertBtn) insertBtn.disabled = true;
  let displayedPct = 0;
  const timer = setInterval(()=>{
    const elapsed = Date.now() - startTime;
    const target = Math.min(100, Math.round((elapsed/duration)*100));
    // La progression avance par petits à-coups irréguliers plutôt que de façon
    // parfaitement linéaire, pour ressembler à un vrai débit réseau.
    if(target > displayedPct) displayedPct = Math.min(target, displayedPct + rand(1,4));
    const fill = document.getElementById("dlcProgressFill");
    const pctEl = document.getElementById("dlcPct");
    const speedEl = document.getElementById("dlcSpeedInfo");
    if(fill) fill.style.width = displayedPct + "%";
    if(pctEl) pctEl.textContent = displayedPct + "%";
    if(speedEl) speedEl.textContent = `${Math.round(fakeSizeKB*displayedPct/100)} Ko / ${fakeSizeKB} Ko`;
    if(displayedPct>=100 && elapsed>=duration){
      clearInterval(timer);
      finalizeDlcInstall(dlc, rawText, msgEl);
    }
  }, 220);
}

// Appelée une seule fois, à la toute fin du téléchargement simulé : c'est
// seulement ici que le DLC est réellement inséré dans le jeu (state.dlcs,
// exécution de son code, sauvegarde). Si l'utilisateur a entre-temps fermé
// les Réglages, le DLC s'installe quand même en tâche de fond (comme un
// vrai téléchargement qui continue), mais sans rouvrir la fenêtre — une
// actu est ajoutée à la place pour l'informer.
function finalizeDlcInstall(dlc, rawText, msgEl){
  let installed, isUpdate, err = null;
  try{
    const res = installDLCFromText(rawText);
    installed = res.dlc; isUpdate = res.isUpdate;
  }catch(e){ err = e; }
  const stillOpen = msgEl && document.body.contains(msgEl);
  if(err){
    if(stillOpen) msgEl.innerHTML = `<div class="train-msg" style="background:rgba(193,18,31,0.18);color:#f19aa0;">${err.message||"Fichier DLC invalide."}</div>`;
    return;
  }
  if(stillOpen){
    msgEl.innerHTML = `<div class="train-msg" style="background:rgba(46,160,67,0.18);color:#8ef0a4;">🧩 DLC "${installed.name}" ${isUpdate?"mis à jour":"installé"} avec succès !</div>`;
    openSettingsSheet();
  } else {
    addNews("DLC", `🧩 Téléchargement terminé : "${installed.name}" est maintenant installé.`);
  }
}

// API "sandbox" fournie à chaque DLC : uniquement des actions qui passent par les
// fonctions déjà éprouvées du jeu, pour qu'un DLC ne puisse pas casser l'appli.
function buildDLCApi(dlc){
  if(!state.dlcData) state.dlcData = {};
  if(!state.dlcData[dlc.id]) state.dlcData[dlc.id] = {};
  return {
    id: dlc.id,
    name: dlc.name,
    state: state,
    data: state.dlcData[dlc.id], // stockage persistant propre à ce DLC (sauvegardé avec la partie)
    utils: { rand, pick, uid, makePlayer, computePrice, shuffleArr },
    addNews: (tag, title)=> addNews(tag||dlc.name, title),
    toast: (msg, icon)=> showAchievementToast({ic:icon||"🧩", label:msg}),
    defineAchievement: (key, def)=>{ ACHIEVEMENTS_DEFS[key] = def; },
    unlockAchievement: (key)=> unlockAchievement(key),
    hasAchievement: (key)=> (state.achievements||[]).includes(key),
    addWorldStar: (player)=>{
      if(!state.worldStars) state.worldStars = [];
      if(!state.worldStars.some(w=>w.nom===player.nom && w.pays===player.pays)) state.worldStars.push(player);
    },
    addMarketPlayer: (player)=>{
      if(!state.market) state.market = [];
      if(typeof player.price !== "number") player.price = computePrice(player);
      state.market.push(player);
    },
    getSquad: ()=> state.squad,
    recruitToSquad: (player)=>{
      // Ajoute directement un joueur à l'effectif national (comme une recrue validée).
      if(typeof player.indispo !== "number") player.indispo = 0;
      if(!player.cartons) player.cartons = {jaune:0, rouge:0};
      if(typeof player.blessuresNb !== "number") player.blessuresNb = 0;
      if(typeof player.matchsJoues !== "number") player.matchsJoues = 0;
      if(typeof player.motm !== "number") player.motm = 0;
      if(!player.historique) player.historique = [];
      if(typeof player.favorite !== "boolean") player.favorite = false;
      if(typeof player.note !== "string") player.note = "";
      state.squad.push(player);
      recalcMaxTrain();
    },
    // Ajoute un onglet complet dans la barre de navigation, avec son propre écran.
    // opts = {key, label, icon, render(container, DLC)}. render() est rappelé à chaque
    // fois que l'onglet est affiché ou que render() global est déclenché ; il doit
    // remplir "container" (un élément DOM vide) et brancher ses propres onclick.
    registerTab: (opts)=>{
      const key = `${dlc.id}:${opts.key}`;
      CUSTOM_TABS[key] = {key, label: opts.label||dlc.name, icon: opts.icon||"🧩", dlcId: dlc.id, render: opts.render};
    },
    switchToTab: (opts_key)=>{ state.tab = `${dlc.id}:${opts_key}`; render(); },
    // Ouvre un panneau plein écran générique (même style que les fiches du jeu).
    // html = contenu HTML du panneau ; onMount(overlayEl) est appelé juste après
    // l'insertion dans le DOM pour brancher les événements des boutons.
    openSheet: (html, onMount)=>{
      closeSheet();
      const overlay = document.createElement("div");
      overlay.className = "overlay"; overlay.id = "overlay";
      overlay.innerHTML = `<div class="sheet">${html}</div>`;
      document.body.appendChild(overlay);
      overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
      const closeBtn = overlay.querySelector("[data-dlc-close]");
      if(closeBtn) closeBtn.onclick = closeSheet;
      if(typeof onMount === "function") onMount(overlay);
    },
    closeSheet: ()=> closeSheet(),
    onMatchEnd: (fn)=>{ DLC_HOOKS.matchEnd[dlc.id] = fn; },
    save: ()=> saveGame(),
    render: ()=> render(),
  };
}

function runDLC(dlc){
  try{
    Object.keys(CUSTOM_TABS).forEach(k=>{ if(CUSTOM_TABS[k].dlcId===dlc.id) delete CUSTOM_TABS[k]; });
    const api = buildDLCApi(dlc);
    const fn = new Function("DLC", dlc.code);
    fn(api);
  }catch(e){
    console.error("Erreur DLC", dlc.id, e);
    addNews("DLC", `⚠️ Le DLC "${dlc.name}" a rencontré une erreur au chargement.`);
  }
}

function runAllDLCs(){
  (state.dlcs||[]).forEach(runDLC);
}

function runDLCHooks(hookName, ...args){
  const hooks = DLC_HOOKS[hookName] || {};
  Object.keys(hooks).forEach(id=>{
    try{ hooks[id](...args); }catch(e){ console.error("Erreur hook DLC", id, e); }
  });
}
function competitionShort(){ return state.competition === "euro" ? "Euro" : state.competition === "footballstar" ? "FootballStar" : state.competition === "fifatournament" ? "FIFA Tournament" : "CDM"; }
function competitionFull(){ return state.competition === "euro" ? "l'Euro" : state.competition === "footballstar" ? "le FootballStar" : state.competition === "fifatournament" ? "le FIFA Tournament" : "la Coupe du Monde"; }
function competitionChampionLabel(comp){
  const c = comp || state.competition;
  return c === "euro" ? "d'Europe" : c === "footballstar" ? "du FootballStar" : c === "fifatournament" ? "du FIFA Tournament" : "du monde";
}
// Pour le FIFA Tournament, chaque tour de phase finale est une série (jusqu'à 3 matchs contre
// le même pays) : on ajoute donc "Match X/3" pour situer la rencontre en cours dans la série.
function seriesMatchSuffix(matchObj){
  if(!matchObj || state.competition !== "fifatournament") return "";
  const t = matchObj.type;
  if(KO_ORDER_FIFAT.indexOf(t) === -1) return "";
  const cal = (matchObj.ctx==="club" ? (state.club&&state.club.calendar) : state.calendar) || [];
  const sameOpp = cal.filter(m=> m.type===t && m.opp===matchObj.opp);
  const idx = sameOpp.indexOf(matchObj);
  return idx===-1 ? "" : ` · Match ${idx+1}/3`;
}
function typeLabel(t, matchObj){
  const c = competitionShort();
  const base = ({
    amical:"Amical", nations:"Ligue des Nations", qualif:`Qualif. ${c}`,
    "cdm-groupe":`${c} · Groupes`, "cdm-seize":`${c} · 16es`, "cdm-huit":`${c} · 8es`, "cdm-quart":`${c} · Quarts`,
    "cdm-demi":`${c} · Demi-finale`, "cdm-finale":`${c} · Finale`,
    "fifat-16":`${c} · 8es (série)`, "fifat-8":`${c} · Quarts (série)`, "fifat-4":`${c} · Demi (série)`, "fifat-final":`${c} · Finale (série)`
  })[t] || t;
  return base + seriesMatchSuffix(matchObj);
}
function typeTagClass(t){
  if(t.indexOf("fifat")===0) return "type-fifat";
  if(t.indexOf("cdm")===0) return state.competition==="footballstar" ? "type-fs" : "type-cdm";
  if(t==="qualif") return "type-qualif";
  if(t==="nations") return "type-nations";
  return "type-amical";
}
const OPP_STRENGTH_RANGES = {
  amical:[38,64], nations:[42,70], qualif:[45,72], "cdm-groupe":[55,80], "cdm-seize":[58,82], "cdm-huit":[60,84],
  "cdm-quart":[65,88], "cdm-demi":[70,90], "cdm-finale":[75,94],
  "fifat-16":[62,86], "fifat-8":[66,89], "fifat-4":[72,92], "fifat-final":[78,96]
};
function oppStrengthFor(type, oppName){
  const range = OPP_STRENGTH_RANGES[type] || [48,78];
  const diffKey = (state.settings && state.settings.difficulty) || "normal";
  const mod = (DIFFICULTIES[diffKey]||DIFFICULTIES.normal).oppMod;
  const fsMod = state.competition === "footballstar" ? 5 : state.competition === "fifatournament" ? 7 : 0; // les plus grands tournois attirent les toutes meilleures nations
  let base;
  if(oppName && state.teamStrengths && typeof state.teamStrengths[oppName]==="number"){
    // Mélange le niveau propre à la nation (qui évolue saison après saison)
    // avec l'exigence de l'échéance (amical, qualif, phase finale...).
    const bandMid = (range[0]+range[1])/2;
    base = state.teamStrengths[oppName]*0.6 + bandMid*0.4 + rand(-5,5);
  } else {
    base = rand(range[0], range[1]);
  }
  return clamp(Math.round(base) + mod + fsMod, 20, 99);
}
// Attribue (une seule fois, mémorisé sur le match lui-même) une vraie tactique adverse
// {formation, style}, utilisée à la fois pour le calcul du matchup et pour l'affichage du
// scouting/conseiller tactique. Biaisée par le niveau attendu de l'adversaire : les grosses
// écuries penchent plus offensif/possession, les équipes modestes se recroquevillent davantage
// (juste assez de logique pour que "réfléchir sa tactique" ait un sens narratif).
function ensureOppTactique(m){
  if(!m) return {formation:"442", style:"equilibre"};
  if(m.oppTactique) return m.oppTactique;
  const range = OPP_STRENGTH_RANGES[m.type] || CLUB_OPP_RANGES[m.type] || [48,78];
  const tierMid = (range[0]+range[1])/2;
  const formationPool = tierMid>=70 ? ["433","433","352","442"] : tierMid>=55 ? ["442","352","433","532"] : ["532","532","442","352"];
  const stylePool = tierMid>=70 ? ["offensif","possession","possession","equilibre"] : tierMid>=55 ? ["equilibre","possession","contre","offensif"] : ["defensif","defensif","contre","equilibre"];
  m.oppTactique = { formation: pick(formationPool), style: pick(stylePool) };
  return m.oppTactique;
}
function ourTactiqueFor(m){ return (m && m.ctx==="club") ? state.club.tactique : state.tactique; }
function ourStrengthFor(m){ return (m && m.ctx==="club") ? clubTeamStrength() : teamStrength(); }
function oppTierLabel(type){
  const range = OPP_STRENGTH_RANGES[type] || [48,78];
  const mid = (range[0]+range[1])/2;
  if(mid>=80) return "Adversaire de très haut niveau";
  if(mid>=68) return "Adversaire solide, à respecter";
  if(mid>=55) return "Adversaire de niveau correct";
  return "Adversaire abordable sur le papier";
}

/* ---------------- SAISON / COMPÉTITION ---------------- */
function buildSeasonCalendar(){
  const opps = randomOpponents(6);
  const cal = [];
  cal.push({opp:opps[0], type:"nations", us:null, them:null, status:"pending"});
  cal.push({opp:opps[1], type:"nations", us:null, them:null, status:"pending"});
  for(let i=2;i<6;i++) cal.push({opp:opps[i], type:"qualif", us:null, them:null, status:"pending"});
  state.calendar = cal;
  state.matchIdx = 0;
  state.phase = "qualif";
  setSeasonObjective();
}

function progressSeason(){
  const phase = state.phase;
  const isFS = state.competition === "footballstar";
  if(phase === "qualif"){
    const ms = state.calendar.filter(m=>m.type==="qualif");
    if(ms.every(m=> m.status && m.status!=="pending" && m.status!=="live")){
      const pts = ms.reduce((s,m)=> s+(m.status==="W"?3:m.status==="D"?1:0),0);
      if(ms.every(m=> m.status!=="L")) unlockAchievement("invincible");
      if(pts >= 6){
        const groupSize = isFS ? 4 : 3; // le FootballStar réunit le plus grand nombre de nations, groupes élargis
        randomOpponents(groupSize, state.calendar.map(m=>m.opp)).forEach(o=>
          state.calendar.push({opp:o, type:"cdm-groupe", us:null, them:null, status:"pending"}));
        state.phase = "cdm-groupe";
        state.seasonNotice = "🎉 La France est qualifiée pour " + competitionFull() + " " + state.year + " !";
      } else {
        endSeason("Non qualifiés pour " + competitionFull());
      }
    }
  } else if(phase === "cdm-groupe"){
    const ms = state.calendar.filter(m=>m.type==="cdm-groupe");
    if(ms.every(m=> m.status && m.status!=="pending" && m.status!=="live")){
      const pts = ms.reduce((s,m)=> s+(m.status==="W"?3:m.status==="D"?1:0),0);
      const threshold = isFS ? 6 : 4;
      if(pts >= threshold){
        const firstPhase = koOrder()[0];
        const opp = randomOpponents(1, state.calendar.map(m=>m.opp))[0];
        state.calendar.push({opp, type:firstPhase, us:null, them:null, status:"pending"});
        state.phase = firstPhase;
        state.seasonNotice = "➡️ Les Bleus filent en " + typeLabel(firstPhase) + " !";
      } else {
        endSeason("Éliminés en phase de groupes (" + competitionFull() + ")");
      }
    }
  } else if(isSeriesCompetition() && koOrder().indexOf(phase) !== -1){
    // FIFA Tournament : chaque tour est une série contre le même pays, remportée dès 2 victoires
    // (donc en 2 ou 3 matchs). On ajoute un nouveau match tant que la série n'est pas tranchée.
    const order = koOrder();
    const ms = state.calendar.filter(m=>m.type===phase);
    const finished = ms.filter(m=> m.status && m.status!=="pending" && m.status!=="live");
    const last = finished[finished.length-1];
    if(last){
      const wins = finished.filter(m=>m.status==="W").length;
      const losses = finished.filter(m=>m.status==="L").length;
      if(wins>=2 || losses>=2){
        const scoreTxt = `${wins}-${losses}`;
        if(wins>=2){
          const idx = order.indexOf(phase);
          if(idx === order.length-1){
            state.trophies[state.competition] = (state.trophies[state.competition]||0) + 1;
            unlockAchievement("championFifaT");
            endSeason(`🏆 Champions ${competitionChampionLabel()} ! (série remportée ${scoreTxt})`, true);
          } else {
            const nextPhase = order[idx+1];
            const opp = randomOpponents(1, state.calendar.map(x=>x.opp))[0];
            state.calendar.push({opp, type:nextPhase, us:null, them:null, status:"pending"});
            state.phase = nextPhase;
            state.seasonNotice = `🏁 Série remportée ${scoreTxt} face à ${last.opp} ! Direction : ${typeLabel(nextPhase)}.`;
          }
        } else {
          const roundNames = {"fifat-16":"en 8es (série)","fifat-8":"en quarts (série)","fifat-4":"en demi-finale (série)","fifat-final":"en finale (série)"};
          endSeason(`Éliminés ${roundNames[phase]} du FIFA Tournament — série perdue ${scoreTxt} face à ${last.opp}`);
        }
      } else {
        state.calendar.push({opp:last.opp, type:phase, us:null, them:null, status:"pending"});
        state.seasonNotice = `⚔️ Série ${wins}-${losses} face à ${last.opp} — match décisif à suivre (Match ${finished.length+1}/3) !`;
      }
    }
  } else if(koOrder().indexOf(phase) !== -1){
    const order = koOrder();
    const ms = state.calendar.filter(m=>m.type===phase);
    const m = ms[ms.length-1];
    if(m && m.status && m.status!=="pending" && m.status!=="live"){
      if(m.status === "W"){
        const idx = order.indexOf(phase);
        if(idx === order.length-1){
          state.trophies[state.competition] = (state.trophies[state.competition]||0) + 1;
          unlockAchievement(state.competition==="euro" ? "championEuro" : state.competition==="footballstar" ? "championFS" : "champion");
          if(state.competition === "cdm") checkWorldCupMilestones();
          endSeason(`🏆 Champions ${competitionChampionLabel()} !`, true);
        } else {
          const nextPhase = order[idx+1];
          const opp = randomOpponents(1, state.calendar.map(x=>x.opp))[0];
          state.calendar.push({opp, type:nextPhase, us:null, them:null, status:"pending"});
          state.phase = nextPhase;
          state.seasonNotice = "➡️ Qualifiés pour la suite : " + typeLabel(nextPhase) + " !";
        }
      } else {
        const roundNames = {"cdm-seize":"en 16es de finale","cdm-huit":"en 8es de finale","cdm-quart":"en quarts de finale","cdm-demi":"en demi-finale","cdm-finale":"en finale (finalistes)"};
        endSeason("Éliminés " + roundNames[phase]);
      }
    }
  }
}

function endSeason(resultLabel, champion){
  state.seasonHistory.unshift({year: state.year, result: resultLabel, champion: !!champion, competition: state.competition});
  addNews("Bilan", `Saison ${state.year} : ${resultLabel}`);
  evaluateNationsLeague();
  computeSeasonAwards();
  checkPlayerPersonalGoals();
  collectSponsorBonus();
  evaluateFederationObjective(state.phase, champion);
  refreshYouthAcademy();
  state.competition = nextCompetition(state.competition);
  state.seasonNotice = null;
  state.extraFriendliesUsed = 0;
  state.trainingCampUsed = false;
  state.nemesisFriendlyUsed = false;
  state.extraProspectUsed = false;
  buildSeasonCalendar();
}

function evaluateNationsLeague(){
  const nl = state.calendar.filter(m=>m.type==="nations" && m.status && m.status!=="pending" && m.status!=="live");
  if(!nl.length) return;
  const wins = nl.filter(m=>m.status==="W").length;
  const draws = nl.filter(m=>m.status==="D").length;
  const pts = wins*3 + draws;
  if(!state.nationsHistory) state.nationsHistory = [];
  // Chaque victoire compte : qualification au Final Four dès 4 points (une victoire + un nul, ou deux victoires),
  // et les victoires supplémentaires augmentent nettement les chances de titre.
  if(pts < 4){
    state.nationsHistory.unshift({year:state.year, pts, wins, draws, qualified:false});
    addNews("Ligue des Nations", `La France termine ${pts} pt${pts>1?'s':''} en poule et ne se qualifie pas pour le Final Four.`);
    return;
  }
  // La Ligue des Nations ne peut plus être remportée en mode campagne : elle reste un
  // objectif de qualification (Final Four) mais aucun trophée n'est décerné à ce titre,
  // pour laisser la Coupe du Monde / l'Euro / le FootballStar comme seuls trophées majeurs.
  state.nationsHistory.unshift({year:state.year, pts, wins, draws, qualified:true, champion:false});
  state.worldRanking = clamp(Math.round((state.worldRanking||18) - 1), 1, 60);
  addNews("Ligue des Nations", "La France atteint le Final Four de la Ligue des Nations, mais la compétition ne délivre pas de trophée en campagne — juste un joli prestige de classement.");
}

/* ---------------- CLUB DE VILLE / LIGUE DES CHAMPIONS ----------------
   En plus de la sélection nationale, on gère aussi un club d'une ville de son choix.
   Cet effectif est composé de joueurs "niche" (générés, pas les internationaux de l'équipe
   de France), avec son propre budget, sa propre composition et sa propre compétition :
   la Ligue des Champions (poule à 3 matchs puis demi-finale et finale). */
const CLUB_SQUAD_POOL = [["GB",1],["DEF",4],["MIL",4],["ATT",3]];
const CLUB_OPP_RANGES = {"ldc-poule":[42,72], "ldc-demi":[55,82], "ldc-finale":[62,88]};

function makeClubSquad(){
  const squad = [];
  CLUB_SQUAD_POOL.forEach(([pos,count])=>{
    for(let i=0;i<count;i++) squad.push(makePlayer(pos));
  });
  return squad;
}

function initClub(cityName){
  const city = (cityName||"").trim() || pick(CLUB_CITIES_POOL);
  state.club = {
    city, name: `FC ${city}`,
    squad: makeClubSquad(), lineup:{}, tactique:{formation:"433", style:"equilibre"},
    market: generateClubMarket(),
    budget: 25, trophies: 0, year: state.year, phase:"poule",
    calendar: [], matchIdx: 0, seasonOver:false, history: []
  };
  autoFillClubLineup();
  buildClubCalendar();
  addNews("Club", `🏙️ Vous prenez également les rênes du ${state.club.name}, en plus de la sélection nationale.`);
}

function clubLineupPlayers(){
  return Object.values(state.club.lineup).map(id=> state.club.squad.find(p=>p.id===id)).filter(Boolean);
}
function clubTeamStrength(){
  const lp = clubLineupPlayers();
  if(lp.length===0) return 42;
  const avg = lp.reduce((s,p)=> s + overall(p)*(p.forme/100), 0) / lp.length;
  const specialBonus = lp.filter(p=>p.special).length * 1.5;
  const eliteBonus = lp.filter(p=>p.elite).length * 3;
  const iconeBonus = lp.filter(p=>p.icone).length * 4.5;
  return avg + specialBonus + eliteBonus + iconeBonus;
}
function autoFillClubLineup(){
  const spec = FORMATIONS[state.club.tactique.formation].spec;
  const used = new Set();
  const lineup = {};
  spec.forEach(([pos,count])=>{
    const pool = state.club.squad.filter(p=>p.pos===pos && !used.has(p.id) && !p.banned && !(p.indispo>0))
      .sort((a,b)=> overall(b)-overall(a));
    for(let i=0;i<count;i++){
      const p = pool[i];
      if(p){ lineup[pos+"_"+i] = p.id; used.add(p.id); }
    }
  });
  state.club.lineup = lineup;
}

function buildClubCalendar(){
  const opps = shuffleArr(CLUB_CITIES_POOL.filter(c=>c!==state.club.city)).slice(0,3);
  state.club.calendar = opps.map(opp=>({opp:`FC ${opp}`, type:"ldc-poule", us:null, them:null, status:"pending"}));
  state.club.matchIdx = 0;
  state.club.phase = "poule";
  state.club.seasonOver = false;
}

function clubQuickScore(our, opp, knockout){
  const diff = our - opp;
  const chanceWin = clamp(0.5 + diff/110, 0.1, 0.88);
  const r = Math.random();
  let us, them;
  if(r < chanceWin){ us = rand(1,3) + (diff>25?1:0); them = rand(0,2); if(them>=us) them = Math.max(0,us-1); }
  else if(!knockout && r < chanceWin + 0.2){ us = them = rand(0,2); }
  else { them = rand(1,3) + (diff<-25?1:0); us = rand(0,2); if(us>=them) us = Math.max(0,them-1); }
  let penalties = false;
  if(knockout && us===them){
    penalties = true;
    if(Math.random() < chanceWin) us += 1; else them += 1;
  }
  return {us, them, penalties};
}

/* ---------------- MARCHÉ DES TRANSFERTS DU CLUB ---------------- */
function generateClubMarket(n){
  n = n || 5;
  const list = [];
  for(let i=0;i<n;i++){
    let p;
    if(iconeUnlocked() && Math.random() < 0.035) p = makeTierPlayer(pick(POS), "icone");
    else if(eliteUnlocked() && Math.random() < 0.09) p = makeTierPlayer(pick(POS), "elite");
    else p = makePlayer(pick(POS));
    p.price = computePrice(p);
    list.push(p);
  }
  return list;
}
function buyClubPlayer(idx){
  const c = state.club;
  const p = c.market[idx];
  if(!p || c.budget < p.price) return;
  c.budget -= p.price;
  addNews("Mercato club", `${p.nom} (${p.pos}) rejoint ${c.name} contre ${p.price} M€.`);
  delete p.price;
  c.squad.push(p);
  let fresh;
  if(iconeUnlocked() && Math.random() < 0.035) fresh = makeTierPlayer(pick(POS), "icone");
  else if(eliteUnlocked() && Math.random() < 0.09) fresh = makeTierPlayer(pick(POS), "elite");
  else fresh = makePlayer(pick(POS));
  fresh.price = computePrice(fresh);
  c.market[idx] = fresh;
  render();
}
function sellClubPlayer(id){
  const c = state.club;
  const p = clubPlayerById(id);
  if(!p) return false;
  if(c.squad.length <= 12){
    openClubPlayerSheet(id, `Effectif du ${c.name} trop réduit pour vendre ce joueur (minimum 12).`);
    return false;
  }
  const price = Math.max(2, Math.round(computePrice(p) * 0.7));
  c.squad = c.squad.filter(x=>x.id!==id);
  Object.keys(c.lineup).forEach(slot=>{ if(c.lineup[slot]===id) delete c.lineup[slot]; });
  c.budget += price;
  addNews("Transfert club", `${p.nom} quitte ${c.name} pour ${price} M€.`);
  render();
  return true;
}
function clubPlayerById(id){ return (state.club.squad||[]).find(p=>p.id===id); }
function clubSlotsSpec(){
  const spec = FORMATIONS[state.club.tactique.formation].spec;
  let slots = [];
  spec.forEach(([pos,count])=>{ for(let i=0;i<count;i++) slots.push(pos+"_"+i); });
  return slots;
}
function ctxPlayerById(m, id){ return (m && m.ctx==="club") ? clubPlayerById(id) : playerById(id); }

function simulateClubMatch(){
  const m = state.club.calendar[state.club.matchIdx];
  if(!m || m.status!=="pending") return;
  const range = CLUB_OPP_RANGES[m.type] || [45,75];
  const oppStr = clamp(rand(range[0],range[1]), 20, 99);
  const ourStr = clubTeamStrength();
  const knockout = m.type !== "ldc-poule";
  const res = clubQuickScore(ourStr, oppStr, knockout);
  m.us = res.us; m.them = res.them; m.penalties = res.penalties;
  m.status = res.us>res.them ? "W" : res.us<res.them ? "L" : "D";
  addNews("Club", `⚽ ${state.club.name} ${res.us}-${res.them}${res.penalties?' (tab)':''} vs ${m.opp} (${typeLabelClub(m.type)}).`);
  state.club.budget += m.status==="W" ? 6 : m.status==="D" ? 3 : 1;
  progressClubSeason();
  saveGame();
}

function typeLabelClub(t){
  return ({"ldc-poule":"Ligue des Champions · Poule","ldc-demi":"Ligue des Champions · Demi-finale","ldc-finale":"Ligue des Champions · Finale"})[t] || t;
}

function progressClubSeason(){
  const c = state.club;
  if(c.phase === "poule"){
    const done = c.calendar.filter(m=>m.type==="ldc-poule");
    if(done.every(m=>m.status && m.status!=="pending")){
      const pts = done.reduce((s,m)=> s+(m.status==="W"?3:m.status==="D"?1:0),0);
      if(pts >= 4){
        c.calendar.push({opp:`FC ${pick(CLUB_CITIES_POOL.filter(ci=>ci!==c.city))}`, type:"ldc-demi", us:null, them:null, status:"pending"});
        c.matchIdx = c.calendar.length-1;
        c.phase = "demi";
        addNews("Club", `🎟️ ${c.name} se qualifie pour la demi-finale de la Ligue des Champions.`);
      } else {
        addNews("Club", `${c.name} termine ${pts} pt(s) et est éliminé en poule de la Ligue des Champions.`);
        endClubSeason();
      }
    } else { c.matchIdx++; }
  } else if(c.phase === "demi"){
    const m = c.calendar[c.calendar.length-1];
    if(m.status==="W"){
      c.calendar.push({opp:`FC ${pick(CLUB_CITIES_POOL.filter(ci=>ci!==c.city))}`, type:"ldc-finale", us:null, them:null, status:"pending"});
      c.matchIdx = c.calendar.length-1;
      c.phase = "finale";
      addNews("Club", `🔥 ${c.name} atteint la finale de la Ligue des Champions !`);
    } else {
      addNews("Club", `${c.name} est éliminé en demi-finale de la Ligue des Champions.`);
      endClubSeason();
    }
  } else if(c.phase === "finale"){
    const m = c.calendar[c.calendar.length-1];
    if(m.status==="W"){
      c.trophies = (c.trophies||0) + 1;
      addNews("Trophée", `🏆 ${c.name} remporte la Ligue des Champions !`);
    } else {
      addNews("Club", `${c.name} s'incline en finale de la Ligue des Champions.`);
    }
    endClubSeason();
  }
}

function endClubSeason(){
  const c = state.club;
  c.history.unshift({year:c.year, result: c.phase==="finale" ? "Finaliste/Vainqueur" : c.phase==="demi" ? "Demi-finaliste" : "Éliminé en poule"});
  if(c.history.length>10) c.history.length = 10;
  c.seasonOver = true;
  c.year++;
  c.squad.forEach(p=>{ p.forme = clamp(p.forme + rand(-5,5), 55, 99); });
  setTimeout(()=>{ buildClubCalendar(); render(); }, 10);
}

function trainClubPlayer(id){
  const c = state.club;
  const p = c.squad.find(x=>x.id===id);
  if(!p || isMaxed(p)) return;
  const cost = 2;
  if(c.budget < cost) return;
  c.budget -= cost;
  const gainMax = (p.icone || p.elite) ? 1 : 2;
  if(!(p.icone||p.elite) || Math.random() < 0.55){
    p.attaque = clamp(p.attaque + rand(0,gainMax), 0, p.potentiel);
    p.defense = clamp(p.defense + rand(0,gainMax), 0, p.potentiel);
  }
  saveGame();
  render();
}

function trainClubPlayerSheet(id){
  const c = state.club;
  const p = clubPlayerById(id);
  if(!p || isMaxed(p) || p.banned || c.budget<2) return;
  c.budget -= 2;
  const roomAtt = p.potentiel - p.attaque, roomDef = p.potentiel - p.defense;
  const baseGain = (p.icone || p.elite) ? 1 : 3;
  const gainAtt = roomAtt>0 ? rand(0,baseGain) : 0;
  const gainDef = roomDef>0 ? rand(0,baseGain) : 0;
  p.attaque = Math.min(p.potentiel, p.attaque+gainAtt);
  p.defense = Math.min(p.potentiel, p.defense+gainDef);
  p.forme = Math.min(99, p.forme + rand(0,3));
  const msg = (gainAtt+gainDef>0)
    ? `Bonne séance ! ${p.nom} progresse (+${gainAtt} att / +${gainDef} déf).`
    : `${p.nom} s'entraîne sans gain visible cette fois.`;
  saveGame();
  openClubPlayerSheet(id, msg);
  render();
}

function soinClubPlayer(id){
  const c = state.club;
  const p = clubPlayerById(id);
  if(!p || p.forme>=95 || c.budget<5 || p.banned) return;
  c.budget -= 5;
  const gain = rand(8,15);
  p.forme = Math.min(99, p.forme + gain);

function executeClubDoping(id){
  const c = state.club;

  if(!p || p.doped || p.banned) return;

  if(c.budget < cost) return;
  c.budget -= cost;
  const caught = Math.random() < 0.4;

    p.banned = true;
    p.indispo = 9999;
    p.banUntilYear = (state.year||2026) + 4;
    Object.keys(c.lineup).forEach(slot=>{ if(c.lineup[slot]===p.id) delete c.lineup[slot]; });

    openClubPlayerSheet(id, `💪 Le protocole a fonctionné : plafond porté au maximum (${p.potentiel}), stats en hausse.`);

  render();
}

// 11 (suite). Vieillissement de l'effectif et départs à la retraite en fin de saison.
// v29 : départ garanti repoussé de 38 à 40 ans, et la progression vers ce départ est plus douce
// (démarre à 34 ans plutôt que 33, palier plus faible) pour éviter les vagues de retraite trop
// brutales maintenant que le rythme de vieillissement lui-même a ralenti (cf. checkYearlyAgingTick
// ci-dessous) : un joueur a désormais réellement le temps de vivre ses années de fin de carrière
// au lieu d'enchaîner les paliers de risque en 2-3 "années" de jeu à peine.
function ageSquadAndRetire(){
  const retirees = [];
  state.squad.forEach(p=>{
    p.age = (p.age||24) + 1;
    let retireChance = 0;
    if(p.age >= 40) retireChance = 1;
    else if(p.age >= 34) retireChance = (p.age - 33) * 0.12;
    if(retireChance > 0 && Math.random() < retireChance) retirees.push(p);
  });
  if(!retirees.length) return;
  state.hallOfFame = state.hallOfFame || [];
  retirees.forEach(p=>{
    if(state.squad.length - retirees.length < 13) return; // garde un minimum de joueurs disponibles
    state.squad = state.squad.filter(x=>x.id!==p.id);
    if(state.captainId===p.id) state.captainId = null;
    Object.keys(state.lineup).forEach(slot=>{ if(state.lineup[slot]===p.id) delete state.lineup[slot]; });
    const entry = {nom:p.nom, pos:p.pos, buts:p.buts||0, matchsJoues:p.matchsJoues||0, motm:p.motm||0,
      cote:cote(p), yearRetired: state.year, legend: !!p.legend, surnom: p.surnom||null};
    state.hallOfFame.unshift(entry);
    addNews("Retraite", `👋 ${p.nom} annonce la fin de sa carrière internationale à ${p.age} ans (${p.matchsJoues||0} sélections, ${p.buts||0} buts).`);
    updateClubRecords(entry);
  });
  if(state.hallOfFame.length >= 5) unlockAchievement("hallOfFame5");
}

// v29 : vieillissement basé sur une période fixe de matchs plutôt que sur chaque campagne
// terminée. Avant, endSeason() (appelée à CHAQUE campagne conclue, qu'elle soit un échec en
// qualifs après seulement 6 matchs ou une finale remportée après 15+ matchs) faisait vieillir
// tout l'effectif de +1 an ET avançait state.year — donc enchaîner plusieurs campagnes courtes
// (échecs en qualifs, petites compétitions) vieillissait l'effectif bien plus vite qu'une seule
// vraie "année" de calendrier international ne le justifierait (d'où le ressenti "3 ans en 1 an").
// Désormais, state.seasonMatchCount compte les matchs de sélection joués depuis le dernier passage
// d'année, et MATCHES_PER_SEASON_YEAR (12 — un calendrier international annuel réaliste : ni trop
// long à attendre, ni trop court pour rester lisible) déclenche alors UNE SEULE fois vieillissement
// + retraites + passage d'année (state.year++), quel que soit le nombre de campagnes conclues
// entre-temps. endSeason() continue de faire tourner state.competition (cdm->euro->...) à chaque
// campagne, mais SANS plus faire vieillir personne : les deux logiques sont désormais découplées.
// Appelée depuis finishMatch(), juste avant progressSeason().
const MATCHES_PER_SEASON_YEAR = 8;
function checkYearlyAgingTick(){
  state.seasonMatchCount = (state.seasonMatchCount||0) + 1;
  if(state.seasonMatchCount < MATCHES_PER_SEASON_YEAR) return;
  state.seasonMatchCount -= MATCHES_PER_SEASON_YEAR;
  ageSquadAndRetire();
  state.year++;
  checkDopingBans();
  evolveTeamStrengths();
}

// 12. Records absolus du club (buteur, sélections, hommes du match) : persistent même après une retraite.
function updateClubRecords(candidate){
  if(!candidate) return;
  state.clubRecords = state.clubRecords || {buts:null, caps:null, motm:null};
  const checks = [
    {key:"buts", val:candidate.buts||0, label:"buteur", suffix:"buts"},
    {key:"caps", val:candidate.matchsJoues||0, label:"capé", suffix:"sélections"},
    {key:"motm", val:candidate.motm||0, label:"récompensé en homme du match", suffix:"fois homme du match"},
  ];
  checks.forEach(c=>{
    const cur = state.clubRecords[c.key];
    if(c.val > 0 && (!cur || c.val > cur.val)){
      state.clubRecords[c.key] = {nom:candidate.nom, val:c.val, year:state.year};
      addNews("Record", `📜 ${candidate.nom} devient le/la plus ${c.label} de l'histoire de la sélection (${c.val} ${c.suffix}) !`);
    }
  });
}

// 14. Objectif de la fédération et confiance envers le sélectionneur — enjeu qui se joue sur plusieurs saisons.
const FEDERATION_OBJECTIVES = {
  qualif: {label:"Assurer la qualification", minPhaseRank:1},
  groupe: {label:"Sortir de la phase de groupes", minPhaseRank:2},
  quarts: {label:"Atteindre les quarts de finale", minPhaseRank:4},
  demi:   {label:"Atteindre le dernier carré", minPhaseRank:5},
  titre:  {label:"Remporter le trophée", minPhaseRank:99},
};
function phaseRank(phase){
  const order = ["qualif","cdm-groupe"].concat(koOrder());
  const idx = order.indexOf(phase);
  return idx===-1 ? 0 : idx+1;
}
function setSeasonObjective(){
  state.federation = state.federation || {confidence:62, objective:null};
  const conf = state.federation.confidence;
  let key;
  if(conf < 35) key = "qualif";
  else if(conf < 55) key = "groupe";
  else if(conf < 75) key = "quarts";
  else if(conf < 90) key = "demi";
  else key = "titre";
  state.federation.objective = key;
}
function evaluateFederationObjective(finalPhaseReached, wonTrophy){
  state.federation = state.federation || {confidence:62, objective:null};
  const objDef = FEDERATION_OBJECTIVES[state.federation.objective] || FEDERATION_OBJECTIVES.groupe;
  const reached = phaseRank(finalPhaseReached);
  const success = !!wonTrophy || reached >= objDef.minPhaseRank;
  const delta = success ? rand(6,14) : -rand(8,18);
  state.federation.confidence = clamp((state.federation.confidence||60) + delta, 0, 100);
  addNews("Fédération", success
    ? `✅ Objectif rempli (${objDef.label}) : la confiance de la fédération progresse.`
    : `⚠️ Objectif manqué (${objDef.label}) : la fédération s'impatiente.`);
  if(state.federation.confidence <= 15){
    const penalty = Math.min(state.budget, rand(8,15));
    state.budget -= penalty;
    addNews("Fédération", `🚨 Motion de défiance : le budget est amputé de ${penalty} M€ suite aux mauvais résultats. Redressez la barre !`);
    state.federation.confidence = 30;
  } else if(state.federation.confidence >= 95){
    const bonus = rand(10,18);
    state.budget += bonus;
    addNews("Fédération", `🎉 La fédération, pleinement confiante, débloque une enveloppe exceptionnelle de ${bonus} M€.`);
  }
}

// 16. Classement mondial : évolue selon les résultats et l'adversité rencontrée, à l'image d'un ranking FIFA.
function updateWorldRanking(matchObj, statusBase){
  const diff = (matchObj.oppStrength||50) - (matchObj.ourStrength||50);
  const importance = {amical:0.4, nations:0.7, qualif:0.8, "cdm-groupe":1, "cdm-seize":1.2, "cdm-huit":1.3, "cdm-quart":1.5, "cdm-demi":1.7, "cdm-finale":2}[matchObj.type] || 1;
  let delta = 0;
  if(statusBase==="W") delta = (0.6 + diff/40) * importance;
  else if(statusBase==="D") delta = (diff/60) * importance;
  else delta = (-0.6 + diff/60) * importance;
  state.worldRanking = clamp(Math.round((state.worldRanking||18) - delta), 1, 60);
  if(state.worldRanking <= 3) unlockAchievement("top3Mondial");
}

// 17. Mode Prestige / Nouvelle Ère : réinitialise l'effectif tout en conservant le palmarès, pour rejouer indéfiniment sur le long terme.
function canStartNewEra(){
  const trophyCount = Object.values(state.trophies||{}).reduce((a,b)=> a + (b||0), 0);
  return trophyCount >= 3;
}
function startNewEra(){
  if(!canStartNewEra()) return;
  state.hallOfFame = state.hallOfFame || [];
  state.squad.forEach(p=>{
    if((p.matchsJoues||0) >= 5){
      state.hallOfFame.unshift({nom:p.nom, pos:p.pos, buts:p.buts||0, matchsJoues:p.matchsJoues||0, motm:p.motm||0,
        cote:cote(p), yearRetired: state.year, legend: !!p.legend, surnom: p.surnom||null});
      updateClubRecords(state.hallOfFame[0]);
    }
  });
  state.prestige = (state.prestige||0) + 1;
  state.squad = makeSquad();
  state.market = generateMarket();
  state.captainId = null;
  state.lineup = {};
  state.youthAcademy = [];
  state.federation.confidence = 62;
  recalcMaxTrain();
  addNews("Nouvelle Ère", `🌟 Une nouvelle ère commence pour la sélection (Prestige ${state.prestige}) ! Une génération de légendes rejoint le musée du palmarès, place aux nouveaux talents.`);

// --- Bulle latérale des onglets DLC (v40, revue v41) ---
// La bulle 🧩 apparaît dès qu'AU MOINS UN DLC est installé (state.dlcs.length>0), peu importe
// s'il ajoute un onglet ou non — et disparaît complètement si aucun DLC n'est installé. Elle liste
// TOUS les DLC installés (pas seulement ceux qui ont un onglet à eux) : ceux qui ont un onglet
// (via DLC.registerTab) sont cliquables et y mènent, les autres sont juste affichés en gris pour
// info (ils agissent en fond, ex: onMatchEnd, sans écran dédié). La bulle est draggable
// verticalement (glisser-déposer le long du bord droit, cf. dlcBubbleTopPx) pour qu'on puisse la
// sortir du passage plutôt qu'elle ne gêne l'interface ; un tap simple (sans glisser) ouvre/ferme
// le panneau déroulant, qui reste ouvert tant qu'on ne retape pas sur la bulle. Élément ajouté
// directement à document.body (pas dans #app) pour survivre à la réécriture de app.innerHTML à
// chaque render() sans perdre sa position ni son état d'ouverture.
function renderDlcBubble(){
  const dlcs = state.dlcs || [];
  let wrap = document.getElementById("dlcBubbleWrap");
  if(!dlcs.length){
    if(wrap) wrap.remove();
    dlcPanelOpen = false;
    return;
  }
  if(!wrap){
    wrap = document.createElement("div");
    wrap.id = "dlcBubbleWrap";
    wrap.className = "dlc-bubble-wrap";
    document.body.appendChild(wrap);
  }
  const rows = dlcs.map(dlc=>{
    const tab = Object.values(CUSTOM_TABS).find(t=>t.dlcId===dlc.id);
    if(tab){
      return `<button class="dlc-panel-item ${state.tab===tab.key?"active":""}" data-dlctab="${tab.key}"><span class="ic">${tab.icon}</span>${tab.label}</button>`;
    }
    return `<div class="dlc-panel-item disabled"><span class="ic">🧩</span>${dlc.name}<span class="dlc-panel-note">sans écran</span></div>`;
  }).join("");
  wrap.innerHTML = `
    <div class="dlc-panel ${dlcPanelOpen?"open":""}" id="dlcPanel">
      <div class="dlc-panel-title">🧩 DLC installés</div>
      ${rows}
    </div>
    <button class="dlc-bubble-btn" id="dlcBubbleBtn" aria-label="Onglets DLC">🧩${dlcs.length>1?`<span class="dlc-bubble-badge">${dlcs.length}</span>`:""}</button>
  `;
  if(dlcBubbleTopPx!==null){
    wrap.style.top = dlcBubbleTopPx+"px";
    wrap.style.transform = "none";
  }

  // Glisser-déposer vertical de la bulle : on distingue un tap (ouvre/ferme le panneau) d'un
  // glissement (déplace la bulle) via un seuil de 6px sur le déplacement vertical.
  const btn = wrap.querySelector("#dlcBubbleBtn");
  let dragging = false, moved = false, startY = 0, startTop = 0;
  btn.onpointerdown = (e)=>{
    dragging = true; moved = false;
    startY = e.clientY;
    startTop = wrap.getBoundingClientRect().top;
    try{ btn.setPointerCapture(e.pointerId); }catch(err){}
  };
  btn.onpointermove = (e)=>{
    if(!dragging) return;
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 6) moved = true;
    if(moved){
      const minTop = 78, maxTop = window.innerHeight - 130;
      const newTop = Math.max(minTop, Math.min(maxTop, startTop + dy));
      dlcBubbleTopPx = newTop;
      wrap.style.top = newTop+"px";
      wrap.style.transform = "none";
    }
  };
  const endDrag = ()=>{
    if(dragging && !moved){
      dlcPanelOpen = !dlcPanelOpen;
      renderDlcBubble();
    }
    dragging = false;
  };
  btn.onpointerup = endDrag;
  btn.onpointercancel = ()=>{ dragging = false; };

  wrap.querySelectorAll("[data-dlctab]").forEach(b=>{
    b.onclick = ()=>{
      state.tab = b.dataset.dlctab;
      render();
    };
  });
}

function statPill(val, p){
  const cls = val>=70 ? "hi" : (val<40 ? "lo" : "");
  const maxed = p && val >= p.potentiel ? " maxed" : "";
  return `<div class="stat-pill ${cls}${maxed}">${val}</div>`;
}
function cotePill(p){ return `<div class="stat-pill cote">${cote(p)}</div>`; }
function trendArrow(p){
  if(typeof p.prevCote !== "number") return "";
  const c = cote(p);
  if(c > p.prevCote) return '<span class="trend up">▲</span>';
  if(c < p.prevCote) return '<span class="trend down">▼</span>';
  return '<span class="trend flat">＝</span>';
}

/* ---------------- v47 : CARTES JOUEURS FAÇON "ULTIMATE TEAM" ----------------
   futRatings(p) dérive une NOTE globale et 6 statistiques d'affichage (VIT/TIR/PAS/DRI/DEF/PHY, ou
   PLO/JMA/DÉG/RÉF/VIT/PLA pour un gardien) des vraies valeurs du jeu (attaque, défense, endurance,
   forme) + une petite variation stable propre à chaque joueur (graine = id). Purement visuel :
   aucune influence sur la simulation. futCardHTML(p, opts) rend la carte (rareté selon la note
   et les paliers special/legend/elite/icone). */
function futSeed(p){ let h = 2166136261; const k = String(p.id||p.nom); for(let i=0;i<k.length;i++){ h ^= k.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function futRatings(p){
  const sd = futSeed(p), v = (n)=> (((sd >>> (n*3)) & 15) - 7);      // variation -7..+8, stable
  const A = p.attaque, D = p.defense, E = p.endurance || 65, F = p.forme || 75;
  const c = (x)=> Math.max(15, Math.round(x));
  let ovr;
  if(p.pos==="GB") ovr = D*0.92 + A*0.08;
  else if(p.pos==="DEF") ovr = D*0.78 + A*0.22;
  else if(p.pos==="MIL") ovr = A*0.55 + D*0.45;
  else ovr = A*0.82 + D*0.18;
  ovr = c(ovr + (F-75)*0.06);
  const stats = p.pos==="GB"
    ? [["PLO", c(D*0.98+v(0))], ["JMA", c(D*0.9+v(1))], ["DÉG", c(D*0.72+A*0.2+v(2))], ["RÉF", c(D*1.02+v(3))], ["VIT", c(E*0.5+D*0.2+v(4))], ["PLA", c(D*0.95+v(5))]]
    : [["VIT", c(A*0.55+E*0.4+v(0)+(p.pos==="ATT"?6:0))], ["TIR", c(A*(p.pos==="DEF"?0.7:1)+v(1))], ["PAS", c((A+D)/2 + (p.pos==="MIL"?8:0)+v(2))],
       ["DRI", c(A*0.95+(p.pos==="DEF"?-8:2)+v(3))], ["DEF", c(D*(p.pos==="ATT"?0.75:1)+v(4))], ["PHY", c(D*0.45+E*0.45+8+v(5))]];
  return {ovr, stats};
}
function futTier(p, ovr){
  if(p.icone) return "icone"; if(p.elite) return "elite"; if(p.legend) return "legend"; if(p.special) return "special";
  return ovr >= 75 ? "or" : ovr >= 65 ? "argent" : "bronze";
}
const FUT_TIER_LABEL = {icone:"ICÔNE", elite:"ÉLITE", legend:"LÉGENDE", special:"SPÉCIAL", or:"OR", argent:"ARGENT", bronze:"BRONZE"};
function futAvatarSVG(p){

    <path d="M44 54 Q50 57 56 54" fill="none" stroke="#5a2e22" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
  </svg>`;
}

  opts = opts || {};

/* ---------------- ENTRAÎNEMENT AUTOMATIQUE ---------------- */
function autoTrain(){
  if(state.trainToday >= state.maxTrain) return;
  const candidates = [...state.squad]
    .filter(p=> p.indispo<=0 && (p.potentiel - Math.max(p.attaque,p.defense)) > 1)
    .sort((a,b)=> (b.potentiel-Math.max(b.attaque,b.defense)) - (a.potentiel-Math.max(a.attaque,a.defense)));
  if(!candidates.length){ render(); return; }
  let idx = 0;
  while(state.trainToday < state.maxTrain && candidates.length){
    const p = candidates[idx % candidates.length];
    trainPlayerSilent(p.id);
    idx++;
    if(idx > 500) break;
  }
  checkMaxAchievements();
  render();
}
function trainPlayerSilent(id){
  if(state.trainToday >= state.maxTrain) return;
  const p = playerById(id);
  if(!p) return;
  state.trainToday++;
  p.seances++;
  const prepaLvl = state.staff.prepa||0;
  const cap = p.potentiel;
  const roomAtt = cap - p.attaque, roomDef = cap - p.defense;
  const successChance = (p.icone ? 0.4 : p.elite ? 0.5 : (p.special ? 0.85 : (p.dud ? 0.4 : 0.65))) + prepaLvl*0.04;
  if(Math.random() <= successChance){
    const gardienBonus = p.pos==="GB" ? (state.staff.gardien||0) : 0;
    const baseGain = p.icone ? 2 : p.elite ? 2 : (p.special?4:3);
    const gainAtt = roomAtt>0 ? rand(0, baseGain+prepaLvl+gardienBonus) : 0;
    const gainDef = roomDef>0 ? rand(0, baseGain+prepaLvl+gardienBonus) : 0;
    p.attaque = Math.min(cap, p.attaque+gainAtt);
    p.defense = Math.min(cap, p.defense+gainDef);
    p.forme = Math.min(99, p.forme + rand(0,3));
  }
}

// 20. Scouting adverse : estimation des forces en présence, probabilités et conseil rapide avant le coup d'envoi.
// v26 — Demande de Julien : ce n'était pas payant, alors que d'autres actions (soin, entraînement,
// stage...) coûtent toutes des M€. SCOUT_COST est prélevé sur le budget concerné (state.budget en
// sélection, state.club.budget en club) la 1ère fois qu'on scoute un match donné ; m.scouted
// (mémorisé sur l'objet match, comme m.oppTactique) évite de payer 2 fois pour rouvrir le même
// rapport. Les boutons scoutOppBtn/clubScoutOppBtn (renderMatchTab/renderClubMatchTab) affichent
// le coût, passent en "✅ déjà scouté" une fois payé, et sont désactivés si le budget est insuffisant.
const SCOUT_COST = 3;
function openMatchPreviewSheet(m){
  if(!m) return;
  const isClub = m.ctx==="club";
  const budgetHolder = isClub ? state.club : state;
  if(!m.scouted){
    if(budgetHolder.budget < SCOUT_COST) return; // sécurité : le bouton est censé être désactivé dans ce cas
    budgetHolder.budget -= SCOUT_COST;
    m.scouted = true;
    saveGame();
    render();
  }
  closeSheet();
  const ourTac = ourTactiqueFor(m);
  const ourStrength = Math.round(ourStrengthFor(m));
  const oppEstimate = (!isClub && state.teamStrengths && typeof state.teamStrengths[m.opp]==="number")
    ? Math.round(state.teamStrengths[m.opp])
    : Math.round(((OPP_STRENGTH_RANGES[m.type]||CLUB_OPP_RANGES[m.type]||[48,78])[0] + (OPP_STRENGTH_RANGES[m.type]||CLUB_OPP_RANGES[m.type]||[48,78])[1]) / 2);
  const diff = ourStrength - oppEstimate;
  const winPct = clamp(Math.round(50 + diff*1.1), 8, 92);
  const drawPct = clamp(Math.round(28 - Math.abs(diff)*0.3), 6, 28);
  const lossPct = clamp(100 - winPct - drawPct, 5, 92);
  const h2hRec = !isClub ? (state.h2h||{})[m.opp] : null;
  const oppTac = ensureOppTactique(m);
  const matchup = matchupReport(ourTac.formation, ourTac.style, oppTac.formation, oppTac.style);
  const advice = diff >= 8
    ? "Vous partez favoris : un style équilibré ou offensif peut faire la différence."
    : diff <= -8
      ? "L'adversaire part favori : un bloc plus défensif (5-3-2 ou style Verrou) peut limiter la casse."
      : "Match équilibré sur le papier : la tactique et la forme du groupe feront la différence.";
  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "overlay";
  overlay.innerHTML = `

    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="eyebrow">Scouting</div>
          <h2 style="margin:2px 0;font-size:22px;">${isClub ? state.club.name : "France 🇫🇷"} vs ${m.opp}</h2>
        </div>
        <button class="close-x" id="closeSheet">✕</button>
      </div>
      <div class="formation-note">Force estimée : ${isClub ? state.club.name : "Bleus"} ${ourStrength} · ${m.opp} ≈ ${oppEstimate}.</div>
      <div class="potential-note" style="opacity:.75;">💰 Rapport de scouting (${SCOUT_COST} M€) — déjà payé, consultable librement pour ce match.</div>
      <div class="bar-row"><div class="bar-label">Victoire</div><div class="bar-track"><div class="bar-fill" style="width:${winPct}%"></div></div><div class="bar-val">${winPct}%</div></div>
      <div class="bar-row"><div class="bar-label">Nul</div><div class="bar-track"><div class="bar-fill form" style="width:${drawPct}%"></div></div><div class="bar-val">${drawPct}%</div></div>
      <div class="bar-row"><div class="bar-label">Défaite</div><div class="bar-track"><div class="bar-fill def" style="width:${lossPct}%"></div></div><div class="bar-val">${lossPct}%</div></div>
      ${h2hRec ? `<div class="potential-note">📜 Historique : ${h2hRec.w}V ${h2hRec.d}N ${h2hRec.l}D (${h2hRec.gf}-${h2hRec.ga}).</div>` : (!isClub ? `<div class="potential-note">📜 Première confrontation référencée face à cette nation.</div>` : "")}
      <div class="potential-note">💡 ${advice}</div>
      <h3 style="font-size:14px;font-family:'Barlow Condensed';text-transform:uppercase;color:var(--gold);margin:14px 0 6px;">🎯 Plan de match adverse</h3>
      <div class="formation-note">${m.opp} devrait aligner un <b>${FORMATIONS[oppTac.formation].label}</b> en style <b>${STYLES[oppTac.style].label}</b>.</div>
      ${matchup.lines.map(l=> `<div class="potential-note" style="color:${l.sign>0?'#8fe0a5':l.sign<0?'#f19aa0':'var(--chalk)'};">${l.text}</div>`).join("")}
      <button class="btn btn-ghost" id="cancelSheet">Fermer</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("closeSheet").onclick = closeSheet;
  document.getElementById("cancelSheet").onclick = closeSheet;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
}

// 21. Conseiller tactique : recommande formation + style de jeu adaptés au profil actuel de
// l'effectif, ET, si un adversaire est identifié pour le prochain match (m), une contre-tactique
// dédiée basée sur la matrice d'avantages gradués (FORMATION_MATCHUPS/STYLE_MATCHUPS). Cette
// contre-tactique ne s'affiche que si un vrai avantage existe (bestFormationAgainst/
// bestStyleAgainst peuvent renvoyer null, contrairement à l'ancien mapping "beats" qui donnait
// toujours une réponse).
function suggestBestTactics(m){
  closeSheet();
  const isClub = m && m.ctx==="club";
  const squad = isClub ? state.club.squad : state.squad;
  const tac = isClub ? state.club.tactique : state.tactique;
  const byPos = pos => squad.filter(p=> p.pos===pos && p.indispo<=0 && !p.banned);
  const avgOverall = arr => arr.length ? Math.round(arr.reduce((s,p)=>s+overall(p),0)/arr.length) : 0;
  const defScore = avgOverall(byPos("DEF"));
  const milScore = avgOverall(byPos("MIL"));
  const attScore = avgOverall(byPos("ATT"));
  let formationKey = "442";
  if(milScore >= defScore && milScore >= attScore) formationKey = "352";
  else if(attScore > defScore && attScore > milScore) formationKey = "433";
  else if(defScore > attScore && defScore >= milScore) formationKey = "532";
  const balance = attScore - defScore;
  let styleKey = "equilibre";
  if(balance >= 10) styleKey = "offensif";
  else if(balance <= -10) styleKey = "defensif";
  else if(milScore >= Math.max(attScore, defScore)) styleKey = "possession";
  const formation = FORMATIONS[formationKey], style = STYLES[styleKey];

  // Contre-tactique dédiée si un adversaire est déjà identifié pour ce match.
  let counterFormationKey = null, counterStyleKey = null, oppTac = null, counterBlock = "";
  if(m){
    oppTac = ensureOppTactique(m);
    counterFormationKey = bestFormationAgainst(oppTac.formation);
    counterStyleKey = bestStyleAgainst(oppTac.style);
    const counterFormationRaison = counterFormationKey ? findMatchup(FORMATION_MATCHUPS, counterFormationKey, oppTac.formation).raison : "";
    const counterStyleRaison = counterStyleKey ? findMatchup(STYLE_MATCHUPS, counterStyleKey, oppTac.style).raison : "";
    counterBlock = `
      <h3 style="font-size:14px;font-family:'Barlow Condensed';text-transform:uppercase;color:var(--gold);margin:14px 0 6px;">🎯 Contre l'adversaire attendu</h3>
      <div class="formation-note">${m.opp} devrait jouer en <b>${FORMATIONS[oppTac.formation].label}</b> · <b>${STYLES[oppTac.style].label}</b>.</div>
      ${counterFormationKey ? `<div class="potential-note">Formation à privilégier : <b style="color:var(--gold);">${FORMATIONS[counterFormationKey].label}</b> — ${counterFormationRaison}</div>` : `<div class="potential-note">Aucune formation n'a d'avantage tranché ici : le choix reste ouvert selon votre effectif.</div>`}
      ${counterStyleKey ? `<div class="potential-note">Style à privilégier : <b style="color:var(--gold);">${STYLES[counterStyleKey].label}</b> — ${counterStyleRaison}</div>` : `<div class="potential-note">Aucun style n'a d'avantage tranché ici : le choix reste ouvert selon votre effectif.</div>`}
    `;
  }

  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="eyebrow">Conseiller tactique</div>
          <h2 style="margin:2px 0;font-size:22px;">Recommandation</h2>
        </div>
        <button class="close-x" id="closeSheet">✕</button>
      </div>
      <div class="formation-note">Profil de l'effectif : Défense ${defScore} · Milieu ${milScore} · Attaque ${attScore}.</div>
      <div class="potential-note">Formation conseillée : <b style="color:var(--gold);">${formation.label}</b> — ${formation.desc}</div>
      <div class="potential-note">Style conseillé : <b style="color:var(--gold);">${style.label}</b> — ${style.desc}</div>
      <button class="btn btn-primary" id="applyTacticsBtn">Appliquer le profil effectif</button>
      ${counterBlock}
      ${(counterFormationKey||counterStyleKey) ? `<button class="btn btn-primary" id="applyCounterBtn" style="margin-top:6px;">Appliquer la contre-tactique</button>` : ""}
      <button class="btn btn-ghost" id="cancelSheet">Fermer</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("closeSheet").onclick = closeSheet;
  document.getElementById("cancelSheet").onclick = closeSheet;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
  document.getElementById("applyTacticsBtn").onclick = ()=>{
    if(formationKey !== tac.formation){ tac.formation = formationKey; if(isClub) state.club.lineup = {}; else state.lineup = {}; }
    tac.style = styleKey;
    closeSheet(); render();
  };
  const counterBtn = document.getElementById("applyCounterBtn");
  if(counterBtn) counterBtn.onclick = ()=>{
    if(counterFormationKey && counterFormationKey !== tac.formation){ tac.formation = counterFormationKey; if(isClub) state.club.lineup = {}; else state.lineup = {}; }
    if(counterStyleKey) tac.style = counterStyleKey;
    closeSheet(); render();
  };
}

// 22. Repos individuel gratuit et limité (2/jour) pour un joueur fatigué, alternative légère au soin payant.
function individualRest(id){
  const p = playerById(id);
  if(!p || p.banned) return;
  state.restIndivToday = state.restIndivToday || 0;
  if(state.restIndivToday >= 2){ openPlayerSheet(id, "😴 Repos individuel déjà utilisé 2 fois aujourd'hui."); return; }
  if(p.forme >= 92){ openPlayerSheet(id, `${p.nom} est déjà en pleine forme.`); return; }
  const gain = rand(3,7);
  p.forme = Math.min(99, p.forme + gain);
  state.restIndivToday++;
  openPlayerSheet(id, `😴 ${p.nom} a pris un peu de repos (+${gain} forme).`);
}

// 23. Interview média : petit coup de projecteur qui dope ponctuellement la forme et la cote d'un joueur (1x/saison/joueur).
function playerInterview(id){
  const p = playerById(id);
  if(!p || p.banned) return;
  if(p.lastInterviewYear === state.year){ openPlayerSheet(id, `${p.nom} a déjà accordé une interview cette saison.`); return; }
  p.lastInterviewYear = state.year;
  const good = Math.random() < 0.75;
  if(good){
    const formeGain = rand(2,5);
    p.forme = Math.min(99, p.forme + formeGain);
    p.buzz = (p.buzz||0) + 4;
    addNews("Médias", `🎙️ Interview remarquée de ${p.nom} : le vestiaire est galvanisé.`);
    openPlayerSheet(id, `🎙️ Belle interview ! +${formeGain} forme et un joli coup de projecteur médiatique.`);
  } else {
    p.forme = Math.max(50, p.forme - rand(1,3));
    addNews("Médias", `🎙️ Interview maladroite de ${p.nom}, quelques critiques dans la presse.`);
    openPlayerSheet(id, `🎙️ Interview un peu maladroite... la presse s'en donne à cœur joie.`);
  }
}

// 25. Revanche programmée contre la nemesis (bête noire historique), une fois par saison : prime spéciale à la clé en cas de victoire.
function challengeNemesisFriendly(){
  if(state.nemesisFriendlyUsed) return;
  const h2hAll = Object.entries(state.h2h||{}).filter(([,r])=> (r.w+r.d+r.l) >= 2);
  const nemesis = [...h2hAll].sort((a,b)=> (b[1].l-b[1].w) - (a[1].l-a[1].w))[0];
  if(!nemesis) return;
  const opp = nemesis[0];
  state.calendar.splice(state.matchIdx, 0, {opp, type:"amical", us:null, them:null, status:"pending", grudge:true});
  state.nemesisFriendlyUsed = true;
  addNews("Revanche", `🔥 Une revanche est programmée face à ${opp}, votre bête noire historique. Une prime spéciale attend les Bleus en cas de victoire.`);
  render();
}

// 26. Objectif personnel de saison pour un joueur, avec prime à la clé si l'objectif est rempli en fin de saison.
function setPlayerPersonalGoal(id){
  const p = playerById(id);
  if(!p || p.banned) return;
  if(p.personalGoal && !p.personalGoal.resolved){ openPlayerSheet(id, `${p.nom} a déjà un objectif personnel en cours cette saison.`); return; }
  const isAttacker = p.pos==="ATT" || p.pos==="MIL";
  if(isAttacker){
    const target = rand(2,4);
    p.personalGoal = {statKey:"buts", startValue: p.buts||0, target, label:`Marquer ${target} but(s) cette saison`, reward: 8+target*3, resolved:false};
  } else {
    const target = rand(3,6);
    p.personalGoal = {statKey:"matchsJoues", startValue: p.matchsJoues||0, target, label:`Disputer ${target} match(s) cette saison`, reward: 6+target*2, resolved:false};
  }
  addNews("Objectif perso", `🎯 ${p.nom} se fixe un nouvel objectif : ${p.personalGoal.label}.`);
  openPlayerSheet(id, `🎯 Objectif fixé : ${p.personalGoal.label} (prime de ${p.personalGoal.reward} M€ à la clé).`);
}
function checkPlayerPersonalGoals(){
  state.squad.forEach(p=>{
    const g = p.personalGoal;
    if(!g || g.resolved) return;
    const current = p[g.statKey] || 0;
    const success = (current - g.startValue) >= g.target;
    g.resolved = true;
    g.success = success;
    if(success){
      state.budget += g.reward;
      addNews("Objectif perso", `✅ ${p.nom} a rempli son objectif personnel (${g.label}) — prime de ${g.reward} M€.`);
    } else {
      addNews("Objectif perso", `❌ ${p.nom} n'a pas rempli son objectif personnel (${g.label}).`);
    }
  });
}

// 27. Stage individuel accéléré pour un prospect de l'académie : dépense ponctuelle, gain immédiat de stats/potentiel.
function investAcademyBoost(id){
  const p = (state.youthAcademy||[]).find(x=>x.id===id);
  if(!p || p.boosted) return;
  const cost = 10;
  if(state.budget < cost) return;
  state.budget -= cost;
  p.potentiel = clamp(p.potentiel + rand(2,5), p.potentiel, 99);

}

// 28. Stage de préparation collectif payant : dope la forme et l'endurance de tout l'effectif, une fois par saison.
function organizeTrainingCamp(){
  if(state.trainingCampUsed) return;

  if(state.budget < cost) return;

const SHOOTOUT_ZONES = [

function takeShootoutPenalty(id, zoneKey, overlay){
  if((state.shootoutToday||0) >= 3) return;
  const p = playerById(id);
  if(!p) return;
  const zone = SHOOTOUT_ZONES.find(z=> z.key===zoneKey);
  if(!zone) return;
  state.shootoutToday = (state.shootoutToday||0) + 1;
  overlay.querySelectorAll(".shootout-zone").forEach(b=> b.disabled = true);
  const keeperZone = SHOOTOUT_ZONES[rand(0, SHOOTOUT_ZONES.length-1)];
  const ball = overlay.querySelector("#shootoutBall");
  const keeper = overlay.querySelector("#shootoutKeeper");
  const bc = shootoutZoneCenter(zone), kc = shootoutZoneCenter(keeperZone);
  if(ball){ ball.style.left = bc.left; ball.style.top = bc.top; }
  if(keeper){ keeper.style.left = kc.left; keeper.style.top = kc.top; }
  let chance = zone.corner ? 78 : 60;
  chance += Math.round((p.attaque-75)*0.35);
  chance += Math.round((p.forme-70)*0.15);
  if(p.icone) chance += 4; else if(p.elite) chance += 3; else if(p.special) chance += 2;
  if(keeperZone.key === zone.key) chance -= zone.corner ? 30 : 40;
  chance = clamp(chance, 12, 93);
  const scored = Math.random()*100 < chance;
  const resultEl = overlay.querySelector("#shootoutResult");
  setTimeout(()=>{
    const remaining = 3 - (state.shootoutToday||0);
    if(scored){
      const formeGain = rand(3,6);
      const buzzGain = rand(3,6);
      p.forme = Math.min(99, p.forme + formeGain);
      p.buzz = (p.buzz||0) + buzzGain;
      addNews("Entraînement", `🎯 ${p.nom} enflamme la séance de tirs au but avec un but somptueux.`);
      resultEl.innerHTML = `<div class="train-msg">⚽ BUT ! Frappe magnifique en ${zone.label.toLowerCase()}. +${formeGain} forme, +${buzzGain} popularité.</div>`;
    } else {
      const formeLoss = rand(1,3);
      p.forme = Math.max(50, p.forme - formeLoss);
      resultEl.innerHTML = `<div class="train-msg" style="background:rgba(193,18,31,0.18);color:#f19aa0;">🧤 Arrêté par le gardien ! -${formeLoss} forme, un peu de frustration dans le groupe.</div>`;
    }
    resultEl.innerHTML += `<button class="btn btn-primary" id="shootoutAgain" style="margin-top:10px;">${remaining>0 ? `Un autre tireur (${remaining} restante(s))` : "Séances épuisées pour aujourd'hui"}</button>`;
    const againBtn = resultEl.querySelector("#shootoutAgain");
    if(remaining>0) againBtn.onclick = ()=> openShootoutSheet();
    else againBtn.onclick = closeSheet;
    render();
  }, 600);
}

/* ---------------- Fiche joueur v35 : infos dérivées stables (flavor, non persistées) ----------------
   Ces infos (numéro, pied fort, taille/poids, ville natale, surnom, sous-stats) sont calculées à la
   volée à partir d'un hash du nom du joueur : stables tant que p.nom ne change pas, mais jamais
   stockées dans state (donc AUCUNE migration de sauvegarde à prévoir). Ne jamais brancher ces
   sous-stats sur teamStrength()/cote()/équilibrage du jeu : c'est uniquement de la présentation. */
function hashStr(str){
  let h = 0;
  str = String(str||"");
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function hashPick(seedStr, salt, min, max){
  const h = hashStr(seedStr + "|" + salt);
  return min + (h % (max - min + 1));
}
function playerShirtNumber(p){
  const gkPool = [1,16,22,23,30,40];
  if(p.pos==="GB") return gkPool[hashPick(p.nom, "num", 0, gkPool.length-1)];
  return hashPick(p.nom, "num", 2, 99);
}
function playerFoot(p){
  const r = hashPick(p.nom, "foot", 0, 19);
  return r < 14 ? "Pied droit" : (r < 18 ? "Pied gauche" : "Ambidextre");
}
function playerHeightCm(p){
  const ranges = {GB:[185,199], DEF:[178,194], MIL:[170,187], ATT:[168,190]};
  const r = ranges[p.pos] || [172,190];
  return hashPick(p.nom, "height", r[0], r[1]);
}
function playerWeightKg(p){
  const h = playerHeightCm(p);
  return hashPick(p.nom, "weight", h-102, h-90);
}
const PLAYER_BIRTHPLACES = ["Paris","Marseille","Lyon","Lille","Bordeaux","Toulouse","Nantes","Rennes",
  "Saint-Étienne","Nice","Strasbourg","Montpellier","Le Havre","Metz","Reims","Grenoble","Créteil",
  "Évreux","Bastia","Cayenne","Sarcelles","Trappes","Vaulx-en-Velin","Corbeil-Essonnes"];
function playerBirthplace(p){
  return PLAYER_BIRTHPLACES[hashPick(p.nom, "ville", 0, PLAYER_BIRTHPLACES.length-1)];
}
const PLAYER_NICKNAMES = ["Le Métronome","La Diagonale","Le Renard des surfaces","Le Mur","La Fusée",
  "Le Chef d'orchestre","Le Guerrier","Le Magicien","L'Élastique","Le Taureau","Le Prince",
  "L'Increvable","Le Métier","La Panthère","Le Roc","L'Éclair","Le Sniper","Le Régisseur"];
function playerNickname(p){
  if(p.surnom) return p.surnom;
  return PLAYER_NICKNAMES[hashPick(p.nom, "surnom", 0, PLAYER_NICKNAMES.length-1)];
}
function subStat(p, key, base, variance){
  const delta = hashPick(p.nom + "|" + p.pos, key, -variance, variance);
  return clamp(Math.round(base + delta), 15, 99);
}
function playerVitesse(p){ return subStat(p, "vit", Math.round((p.attaque + p.forme)/2), 10); }
function playerTechnique(p){ return subStat(p, "tech", p.attaque, 8); }
function playerPhysique(p){ return subStat(p, "phys", Math.round((p.defense + p.endurance)/2), 8); }
function playerMental(p){ return subStat(p, "mental", 72, 20); }

function openPlayerSheet(id, msg, tab){
  msg = msg || "";
  if(tab) ps_lastTab = tab;
  tab = tab || ps_lastTab;
  const p = playerById(id);
  closeSheet();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "overlay";
  const tabs = [
    ["apercu","👤 Aperçu"], ["stats","📊 Stats"], ["carriere","🏆 Carrière"], ["actions","⚙️ Actions"]
  ];
  const bodyHtml = tab==="stats" ? renderPlayerTabStats(p)
    : tab==="carriere" ? renderPlayerTabCarriere(p)
    : tab==="actions" ? renderPlayerTabActions(p)
    : `<div class="fut-hero">${futCardHTML(p, {big:true, id:false})}</div>` + renderPlayerTabApercu(p);
  overlay.innerHTML = `
    <div class="sheet ps-sheet">
      ${renderPlayerSheetHeader(p, state.captainId===p.id ? "C" : null)}
      ${renderPlayerStatusMsg(p, msg)}
      <div class="ps-tabs">
        ${tabs.map(t=>`<button class="ps-tab ${tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join("")}
      </div>
      <div class="ps-body">${bodyHtml}</div>
      <button class="btn btn-ghost" id="cancelSheet">Fermer</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("closeSheet").onclick = closeSheet;
  document.getElementById("cancelSheet").onclick = closeSheet;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
  overlay.querySelectorAll(".ps-tab").forEach(btn=>{
    btn.onclick = ()=> openPlayerSheet(p.id, "", btn.dataset.tab);
  });
  psBind("trainBtn", ()=> trainPlayer(p.id));
  psBind("soinBtn", ()=> soinPlayer(p.id));
  psBind("compareBtn", ()=> openComparePicker(p.id));
  psBind("historyBtn", ()=> openPlayerHistorySheet(p.id));
  psBind("noteBtn", ()=> addScoutingNote(p.id));
  psBind("favBtn", ()=> toggleFavorite(p.id));
  psBind("restIndivBtn", ()=> individualRest(p.id));
  psBind("interviewBtn", ()=> playerInterview(p.id));
  psBind("goalBtn", ()=> setPlayerPersonalGoal(p.id));
  psBind("exportCardBtn", ()=> exportPlayerCardTXT(p.id));
  const dopeBtn = document.getElementById("dopeBtn");
  if(dopeBtn && !p.doped) dopeBtn.onclick = ()=> openDopingSheet(p.id);
  const corruptBtn = document.getElementById("corruptionBtn");
  if(corruptBtn) corruptBtn.onclick = ()=> openCorruptionSheet(p.id);
  psBind("sellBtn", ()=>{
    const btn = document.getElementById("sellBtn");
    const needed = p.favorite ? 2 : 1;
    const done = (+overlay.dataset.confirmSell) || 0;
    if(done < needed){
      overlay.dataset.confirmSell = String(done+1);
      btn.textContent = p.favorite && done===0
        ? "⭐ Protégé — cliquez encore"
        : "Confirmer la vente";
      return;
    }
    sellPlayer(p.id);
  });
  psBind("captainBtn", ()=>{
    if(state.captainId===p.id){
      state.captainId = null;
    } else {
      state.captainId = p.id;
      addNews("Sélection", `${p.nom} devient le nouveau capitaine des Bleus.`);
    }
    closeSheet(); render();
  });
}

function closeSheet(){
  const o = document.getElementById("overlay");
  if(o) o.remove();
  if(pendingBgRender){
    // On attend le prochain tick avant de rafraîchir l'onglet en dessous : si une
    // nouvelle fiche est aussitôt ré-ouverte à la place (ex: cliquer sur "Entraîner"
    // ferme puis rouvre la fiche joueur mise à jour), render() la retrouvera présente
    // et se contentera de sauvegarder, sans reconstruire tout l'onglet pour rien.
    // Ce n'est que quand la fiche reste réellement fermée que le rendu complet a lieu.
    setTimeout(()=>{ if(pendingBgRender) render(); }, 0);
  }
}

function potentialText(p){
  if(p.special) return "Ce joueur a un profil rare : il progresse plus vite et reste rarement à côté de ses stats en match.";
  if(p.dud) return "Ce joueur plafonne bas. Il peut encore grappiller quelques points mais ne deviendra pas un titulaire fiable — utile en dépannage.";
  if(overall(p) >= p.potentiel - 4) return "Ce joueur approche de son potentiel maximum : les progrès vont devenir rares.";
  return "Ce joueur a encore de la marge de progression. Continuez à l'entraîner.";
}

function trainPlayer(id){
  if(state.trainToday >= state.maxTrain) return;
  const p = playerById(id);
  if(p.banned) return;
  state.trainToday++;
  p.seances++;
  let msg;
  const prepaLvl = state.staff.prepa||0;
  const cap = p.potentiel;
  const roomAtt = cap - p.attaque, roomDef = cap - p.defense;
  const room = Math.max(roomAtt, roomDef);
  const successChance = (p.icone ? 0.4 : p.elite ? 0.5 : (p.special ? 0.85 : (p.dud ? 0.4 : 0.65))) + prepaLvl*0.04;
  if(room <= 2 || Math.random() > successChance){
    msg = room <= 2
      ? `${p.nom} a atteint son plafond — la séance n'apporte rien de plus.`
      : `Séance discrète : ${p.nom} n'a pas progressé aujourd'hui.`;
  } else {
    const gardienBonus = p.pos==="GB" ? (state.staff.gardien||0) : 0;
    const baseGain = p.icone ? 2 : p.elite ? 2 : (p.special?4:3);
    const gainAtt = roomAtt>0 ? rand(0, baseGain+prepaLvl+gardienBonus) : 0;
    const gainDef = roomDef>0 ? rand(0, baseGain+prepaLvl+gardienBonus) : 0;
    p.attaque = Math.min(cap, p.attaque+gainAtt);
    p.defense = Math.min(cap, p.defense+gainDef);
    p.forme = Math.min(99, p.forme + rand(0,3));
    msg = (gainAtt+gainDef>0)
      ? `Bonne séance ! ${p.nom} progresse (+${gainAtt} att / +${gainDef} déf).`
      : `${p.nom} s'entraîne sans gain visible cette fois.`;
  }
  checkMaxAchievements();
  openPlayerSheet(id, msg);
  render();
}

/* ---------------- DOPAGE / FILIÈRE PARALLÈLE ---------------- */
function dopingCost(p){
  let c = Math.max(18, Math.round(computePrice(p)*0.55));
  if(p.icone) c = Math.round(c*1.4);
  else if(p.elite) c = Math.round(c*1.2);
  return c;
}

// 29. Corruption : verser un pot-de-vin pour faire lever une suspension en cours (dopage).
// Très cher et pas garanti — voir executeCorruption/executeClubCorruption pour le détail des chances.
function corruptionCost(p){
  let c = 200;
  if(p.icone) c += 150;
  else if(p.elite) c += 90;
  else if(p.special) c += 40;
  return c;
}

  const p = playerById(id);
  if(!p || !p.banned) return;

function executeCorruption(id){
  const p = playerById(id);
  if(!p || !p.banned) return;
  const cost = corruptionCost(p);
  if(state.budget < cost) return;
  state.budget -= cost;
  const success = Math.random() < 0.8;
  if(success){
    p.banned = false;
    p.indispo = 0;
    p.banUntilYear = null;
    p.corrupted = true;
    addNews("Corruption", `🤝 Un accord discret permet à ${p.nom} de retrouver sa place en sélection, sa suspension levée contre ${cost} M€.`);
    SFX.crowdBurst(true, true);
    openPlayerSheet(id, `🤝 Le pot-de-vin a fonctionné : ${p.nom} n'est plus suspendu.`);
  } else {
    if(typeof p.banUntilYear === "number") p.banUntilYear += 1;
    addNews("Scandale", `🚨 Tentative de corruption pour ${p.nom} découverte : les ${cost} M€ sont perdus et sa suspension est prolongée jusqu'en ${p.banUntilYear||"?"}.`);
    SFX.crowdBurst(false, false);
    openPlayerSheet(id, `🚨 La tentative a été découverte : suspension prolongée jusqu'en ${p.banUntilYear||"?"}.`);
  }
  render();
}
